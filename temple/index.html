<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>三殿</title>
<meta name="theme-color" content="#1c1b19">
<style>
:root{--ink:#f4f0e8;--mute:rgba(244,240,232,.68);--glass:rgba(24,22,20,.55);--line:rgba(255,255,255,.16);--red:#C8323C}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1c1b19;color:var(--ink);font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;left:0;top:0;width:100%;height:100%;object-fit:cover;transition:opacity .7s;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
#pan{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 112px);transform:translateX(-50%);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12px;letter-spacing:.1em;pointer-events:none;transition:opacity .8s;z-index:2}
.kneel #pan{opacity:0}
#hit{position:fixed;background:none;border:0;padding:0;cursor:pointer;border-radius:40% 40% 8px 8px}
#halo{position:fixed;pointer-events:none;border-radius:50%;background:radial-gradient(closest-side,rgba(255,250,236,.22),rgba(255,250,236,0));mix-blend-mode:screen;animation:breath 7s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:.15}50%{opacity:.75}}
.calm #halo{animation:none;opacity:1;transition:opacity 1.5s}
.fade #bg,.fade #halo,.fade #hz{opacity:0}
#hz{position:fixed;inset:0;pointer-events:none;transition:opacity .7s}
#hz .door,#hz .spot{position:absolute;pointer-events:auto;background:none;border:0;padding:0;cursor:pointer}
#hz .door span{position:absolute;left:50%;top:-30px;transform:translateX(-50%);white-space:nowrap;font:inherit;font-size:13px;letter-spacing:.2em;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px 10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:.88}
#hz .water{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen;opacity:.55;
  background:repeating-radial-gradient(ellipse at 52% 40%,rgba(255,255,255,0) 0 6px,rgba(255,255,255,.22) 7px,rgba(255,255,255,0) 9px 14px);background-size:140% 160%;animation:ripple 5s linear infinite}
@keyframes ripple{from{background-position:0 0}to{background-position:-30% -40%}}
#hz .sheen{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:soft-light;
  background:conic-gradient(from 0deg,rgba(255,255,255,.0),rgba(255,255,255,.55) 12%,rgba(0,0,0,.0) 30%,rgba(0,0,0,.25) 55%,rgba(255,255,255,0) 80%);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#bg{transform-origin:50% 88%;transition:opacity .7s,transform 1.8s ease,filter 1.8s ease}
.kneel #bg{transform:scale(1.12);filter:brightness(.62)}
.kneel #hz,.kneel footer,.kneel header,.kneel #book{opacity:0;pointer-events:none}
#kneelv{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:24px}
#kneelv[hidden]{display:none}
.kc{width:min(520px,100%);text-align:center;animation:rise 1.6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.kc h3{margin:0 0 18px;font-weight:500;letter-spacing:.3em;font-size:15px;color:var(--mute)}
.kc .w{white-space:pre-wrap;line-height:2.1;font-size:19px;letter-spacing:.06em;text-shadow:0 1px 10px rgba(0,0,0,.6)}
.kc .row{justify-content:center;margin-top:26px}
#veil{position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,0) 16%,rgba(0,0,0,0) 74%,rgba(0,0,0,.32))}
#glow{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 2.2s;background:rgba(255,248,230,.06)}
.calm #glow{opacity:1}
header{position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none}
header h1{margin:0;font-size:22px;letter-spacing:.3em;font-weight:500;text-shadow:0 1px 10px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.5)}
header p{margin:4px 0 0;font-size:13px;color:var(--mute);letter-spacing:.15em;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.btn{font:inherit;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-decoration:none}
.btn.pri{background:rgba(244,240,232,.92);color:#2a2622;border-color:transparent}
#back{position:fixed;left:12px;top:calc(10px + env(safe-area-inset-top));z-index:3}
#book{position:fixed;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:3}
footer{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px}
#halls{position:fixed;left:0;right:0;top:calc(84px + env(safe-area-inset-top));display:flex;justify-content:center;gap:4px;z-index:3}
#halls button{text-shadow:0 1px 6px rgba(0,0,0,.7)}
.isfront #pray,.isfront #hint{display:none}
#hz .spot::before{content:"";position:absolute;inset:-4% -2%;border-radius:50%;border:1.5px solid rgba(255,250,236,.75);animation:pulse 3.2s ease-in-out infinite}
#hz .spot span{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);white-space:nowrap;font:inherit;font-size:13px;letter-spacing:.3em;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 13px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
@keyframes pulse{0%,100%{opacity:.2;transform:scale(.96)}50%{opacity:.9;transform:scale(1.04)}}
#halls button{font:inherit;font-size:14px;color:var(--mute);background:none;border:0;padding:6px 10px;cursor:pointer;letter-spacing:.1em;border-bottom:1px solid transparent}
#halls button.on{color:var(--ink);border-bottom-color:var(--ink)}
#hint{font-size:13px;color:var(--ink);text-shadow:0 1px 6px rgba(0,0,0,.85);min-height:1.2em;text-align:center;letter-spacing:.08em;transition:opacity .6s}
/* 光明燈 */
.lamp{position:absolute;pointer-events:auto;background:none;border:0;padding:0;cursor:pointer;transform:translate(-50%,-100%)}
.lamp svg{display:block;width:100%;height:100%;overflow:visible}
.lamp .fl{transform-origin:12px 13px;animation:flick 2.4s ease-in-out infinite}
.lamp .gl{animation:glowp 3.6s ease-in-out infinite}
.lamp.off .fl,.lamp.off .gl{display:none}
.lamp.off .cup{opacity:.55}
@keyframes flick{0%,100%{transform:scale(1,1)}30%{transform:scale(.92,1.08)}60%{transform:scale(1.05,.95)}}
@keyframes glowp{0%,100%{opacity:.55}50%{opacity:.85}}
.lamp .nm{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:2px;white-space:nowrap;font-size:10.5px;letter-spacing:.06em;color:var(--ink);text-shadow:0 1px 4px rgba(0,0,0,.9)}
.lamp.done .nm{color:#F2DFA6}
.fly{position:absolute;pointer-events:auto;background:none;border:0;padding:0;cursor:pointer;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 10px rgba(201,112,122,.45));animation:flyb 5s ease-in-out infinite}
.fly img{width:100%;height:100%;object-fit:contain;display:block;opacity:.78;animation:fflap 2.8s ease-in-out infinite}
.fly .fwl,.fly .fwr{transform-origin:100px 82px;animation:fflap 2.6s ease-in-out infinite}
.fly .nm{position:absolute;left:50%;top:100%;transform:translateX(-50%);white-space:nowrap;font-size:11.5px;letter-spacing:.12em;color:#FBE3E4;text-shadow:0 1px 5px rgba(0,0,0,.8)}
@keyframes fflap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.7)}}
@keyframes flyb{0%,100%{margin-top:0}50%{margin-top:-6px}}
#lampAdd{display:none}
body:not(.isfront) #lampAdd{display:inline-flex}
.frow{display:flex;gap:8px;align-items:center}
.hold{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,214,140,.45)}
.hold.on i{width:100%;transition:width 3s linear}
.oil{border-left:2px solid rgba(255,214,140,.5);padding:4px 0 4px 10px;margin:6px 0;font-size:14px;line-height:1.6}
.oil small{display:block;color:var(--mute);font-size:12px}
.cd{font-size:28px;letter-spacing:.06em;margin:4px 0 2px}
.sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35)}
.sheet[hidden]{display:none}
.box{width:min(520px,100%);max-height:82vh;overflow:auto;background:#24211e;border:1px solid var(--line);border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
.box h3{margin:0 0 4px;font-weight:500;letter-spacing:.15em}
.box .m{color:var(--mute);font-size:13px;margin:0 0 12px;line-height:1.6}
textarea,input[type=date]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:12px}
textarea{min-height:110px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--mute);margin:10px 0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tabs{display:flex;gap:6px;margin:6px 0 12px}
.tabs button{font:inherit;font-size:13px;color:var(--mute);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.tabs button.on{color:#2a2622;background:var(--ink)}
.it{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:10px;align-items:flex-start}
.it .t{flex:1;line-height:1.6;white-space:pre-wrap}
.it .d{font-size:12px;color:var(--mute)}
.it.done .t{color:var(--mute)}
.tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-right:6px;color:var(--mute)}
.mk{font:inherit;font-size:12px;white-space:nowrap;color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer}
.it.done .mk{border-color:transparent;color:#E9D49A}
.empty{color:var(--mute);font-size:14px;padding:16px 0;text-align:center}
</style>
</head><body>
<img id="bg" alt="" draggable="false">
<div id="halo"></div><div id="hz"></div><button id="hit" aria-label="參拜神像"></button>
<div id="kneelv" hidden><div class="kc" id="kc"></div></div>
<div id="veil"></div><div id="glow"></div>
<header><h1 id="ttl"></h1><p id="sub"></p></header>
<button class="btn" id="back">← 前殿</button>
<button class="btn" id="book">祈願存摺</button>
<footer>
  <div id="hint"></div>
  <div class="frow"><button class="btn pri" id="pray">合十・許願</button><button class="btn" id="lampAdd">＋ 點一盞燈</button></div>
  <nav id="halls"></nav>
</footer>
<div id="pan">← 左右滑動看整個空間 →</div>
<div class="sheet" id="sheet" hidden><div class="box" id="box" role="dialog" aria-modal="true"></div></div>
<script src="../sync/origina-sync.js" data-app="bedside" data-folder="Bedside" data-keys="origina.bedside.v1,origina.prayer.v1" data-pos="bl" data-offset="160"></script>
<script>
"use strict";
const PKEY="origina.prayer.v1";
const HALLS={
  front:{name:"前殿",sub:"點跪墊跪下・點門走進三殿",img:"img/front.webp",front:1,hint:"",
    doors:[["mazu",[326,279,402,418],0],["mazu",[622,279,698,418],0],["caishen",[190,231,252,425],1],["yuelao",[848,192,924,436],1]],labels:[["mazu",512,279]],
    kneelAt:[462,488,532,546],water:[92,459,244,486],ball:[169,458,27]},
  yuelao:{name:"月老殿",sub:"愛・先愛自己，再遇見對的人",img:"img/yuelao.webp",stat:[474,252,550,394],
    ask:"想對自己說的愛，或想遇見什麼樣的人？",hint:"點月老，說說心裡的愛"},
  mazu:{name:"媽祖殿",sub:"出發平安・旅行、手術、上台",img:"img/mazu.webp",stat:[474,182,550,394],
    ask:"要去哪裡？為了什麼出發？",hint:"點媽祖，求出發平安",dated:1},
  caishen:{name:"財神殿",sub:"豐盛・夠用，而且越來越多",img:"img/caishen.webp",stat:[462,206,562,394],
    ask:"想要什麼樣的豐盛？可以寫數字，也可以寫畫面。",hint:"點財神爺，說說想要的豐盛"}
};
const ORDER=["front","caishen","mazu","yuelao"];  // 由左到右：虎邊財神・中殿媽祖・龍邊月老
const ls=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0"),ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
let cur=new URLSearchParams(location.search).get("d");if(!HALLS[cur])cur="front";

/* ---------- 神像在照片裡；這裡只負責點得到、會呼吸的光 ---------- */
let box={x:0,y:0,w:0,h:0};
function setHall(id,instant){
  const H=HALLS[id];cur=id;document.body.classList.add("fade");
  const go=()=>{
    panX=0;$("#bg").src=H.img;$("#ttl").textContent=H.name;$("#sub").textContent=H.sub;$("#hint").textContent=H.hint;
    const F=!!H.front;document.body.classList.toggle("isfront",F);$("#pray").textContent=F?"跪下":"合十・許願";
    $("#back").textContent=F?"← Origina":"← 前殿";
    document.querySelectorAll("#halls button").forEach(b=>b.classList.toggle("on",b.dataset.h===id));
    try{history.replaceState(null,"","?d="+id)}catch(e){}
    layout();const done=()=>document.body.classList.remove("fade");$("#bg").complete?requestAnimationFrame(done):($("#bg").onload=done);};
  instant?go():setTimeout(go,450);}
let panX=0;   // 直式畫面：照片比螢幕寬，可以左右滑動
function layout(){const w=innerWidth,h=innerHeight,H=HALLS[cur],s=Math.max(w/1024,h/572),spare=Math.max(0,1024*s-w);panX=Math.max(-spare/2,Math.min(spare/2,panX));const ox=(w-1024*s)/2+panX,oy=(h-572*s)/2;
  Object.assign($("#bg").style,{left:ox+"px",top:oy+"px",width:1024*s+"px",height:572*s+"px"});$("#pan").style.display=spare>40?"":"none";
  const R=([a,b,c,d])=>({left:ox+a*s+"px",top:oy+b*s+"px",width:(c-a)*s+"px",height:(d-b)*s+"px"});
  const hz=$("#hz");hz.innerHTML="";
  if(H.front){
    (H.labels||[]).forEach(([id,lx,ly])=>{const l=document.createElement("button");l.className="door lbl";l.setAttribute("aria-label","走進"+HALLS[id].name);l.innerHTML=`<span>${HALLS[id].name}</span>`;Object.assign(l.style,R([lx-1,ly,lx+1,ly+1]));l.onclick=()=>setHall(id);hz.appendChild(l);});
    H.doors.forEach(([id,bb,lab])=>{const d=document.createElement("button");d.className="door";d.setAttribute("aria-label","走進"+HALLS[id].name);d.innerHTML=lab?`<span>${HALLS[id].name}</span>`:"";Object.assign(d.style,R(bb));if(lab&&bb[1]<279)d.firstChild.style.top=((279-bb[1])*s-30)+"px";d.onclick=()=>setHall(id);hz.appendChild(d);const sp=d.firstChild;if(!sp)return;const db=d.getBoundingClientRect();if(db.right<0||db.left>w){sp.style.display="none";return;}const r=sp.getBoundingClientRect();if(r.left<8)sp.style.transform=`translateX(calc(-50% + ${8-r.left}px))`;else if(r.right>w-8)sp.style.transform=`translateX(calc(-50% - ${r.right-w+8}px))`;});
    const k=document.createElement("button");k.className="spot";k.setAttribute("aria-label","跪下");k.innerHTML="<span>跪下</span>";k.innerHTML="<span>跪下</span>";Object.assign(k.style,R(H.kneelAt));k.onclick=kneel;hz.appendChild(k);
    const wa=document.createElement("div");wa.className="water";Object.assign(wa.style,R(H.water));hz.appendChild(wa);
    const [bx,by,br]=H.ball,ba=document.createElement("div");ba.className="sheen";Object.assign(ba.style,R([bx-br,by-br,bx+br,by+br]));hz.appendChild(ba);
    Object.assign($("#hit").style,{width:0,height:0});Object.assign($("#halo").style,{width:0,height:0});drawLamps(hz,ox,oy,s,w);return;}
  const [x0,y0,x1,y1]=H.stat;box={x:ox+x0*s,y:oy+y0*s,w:(x1-x0)*s,h:(y1-y0)*s};
  const hit=$("#hit");Object.assign(hit.style,{left:box.x+"px",top:box.y+"px",width:box.w+"px",height:box.h+"px"});
  const r=Math.max(box.w,box.h)*1.1,cx=box.x+box.w/2,cy=box.y+box.h*.45;
  Object.assign($("#halo").style,{left:(cx-r)+"px",top:(cy-r)+"px",width:2*r+"px",height:2*r+"px"});drawLamps(hz,ox,oy,s,w);}
addEventListener("resize",layout);
{let px=null,p0=0;addEventListener("pointerdown",e=>{if(e.target.closest("button,.sheet,#kneelv,a,input,textarea"))return;px=e.clientX;p0=panX;});
  addEventListener("pointermove",e=>{if(px==null)return;panX=p0+(e.clientX-px);layout();});
  addEventListener("pointerup",()=>{px=null;});addEventListener("pointercancel",()=>{px=null;});
  setTimeout(()=>{const p=$("#pan");if(p)p.style.opacity="0";},4000);}
ORDER.forEach(id=>{const b=document.createElement("button");b.textContent=HALLS[id].name;b.dataset.h=id;b.onclick=()=>id!==cur&&setHall(id);$("#halls").appendChild(b);});
$("#hit").onclick=()=>pray();

/* ---------- 鈴 ---------- */
let actx=null,abuf=null;
async function bell(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")await actx.resume();
  if(!abuf){const r=await fetch("../mission/sound/bell.mp3");abuf=await new Promise((res,rej)=>r.arrayBuffer().then(ab=>actx.decodeAudioData(ab,res,rej)));}
  const s=actx.createBufferSource(),g=actx.createGain();s.buffer=abuf;g.gain.value=.4;s.connect(g).connect(actx.destination);s.start();}catch(e){}}

/* ---------- 合十・許願 ---------- */
const sheet=$("#sheet"),bx=$("#box");
function open(html,on){bx.innerHTML=html;sheet.hidden=false;on&&on(bx);}
function close(){sheet.hidden=true;}
sheet.addEventListener("click",e=>{if(e.target===sheet||e.target.closest("[data-x]"))close();});
let calming=false;
function pray(){if(calming)return;calming=true;bell();navigator.vibrate&&navigator.vibrate(15);
  document.body.classList.add("calm");const hint=$("#hint");hint.textContent="合十，靜一下，想清楚要說的話";
  setTimeout(()=>{calming=false;document.body.classList.remove("calm");hint.textContent=HALLS[cur].hint;wishForm();},3800);}
function wishForm(){const H=HALLS[cur];
  open(`<h3>${H.name}</h3><p class="m">${esc(H.ask)}</p><textarea id="wt" placeholder="慢慢寫"></textarea>
    ${H.dated?`<label class="f">出發的日子（可以不填）</label><input type="date" id="wd">`:""}
    <div class="row"><button class="btn pri" data-ok>獻上</button><button class="btn" data-x>先不寫</button></div>`,
  b=>{b.querySelector("#wt").focus();b.querySelector("[data-ok]").onclick=()=>{const t=b.querySelector("#wt").value.trim();if(!t)return;
    const P=ls(PKEY)||{items:[]};const it={id:"p"+Date.now().toString(36),date:ymd(new Date()),text:t,status:"open",deity:cur};
    const d=b.querySelector("#wd");if(d&&d.value)it.go=d.value;P.items.push(it);ls(PKEY,P);
    open(`<h3>已獻上</h3><p class="m">放在${H.name}了。成真的那天，回來祈願存摺按一下「還願」。</p><div class="row"><button class="btn pri" data-x>好</button></div>`);};});}

/* ---------- 前殿：跪下 ---------- */
const DEF_M="今天是新的一天。\n我不被外界的聲音帶走，我的身體柔軟、放鬆。\n我用聲音帶路，我允許自己被愛、也好好愛自己，我穩穩地累積豐盛。\n我先把心情照顧好，好事就會自然進來。";
const DEF_N="今天的我已經夠好了。\n我放下今天，把明天交出去。";
function kneel(){const hr=new Date().getHours(),M=hr>=4&&hr<15,B=ls("origina.bedside.v1")||{};
  document.body.classList.add("kneel");navigator.vibrate&&navigator.vibrate(15);
  setTimeout(()=>{bell();$("#kc").innerHTML=`<h3>${M?"起床的話":"睡前的話"}</h3><div class="w">${esc(M?(B.morning||DEF_M):(B.night||DEF_N))}</div>
    <div class="row"><button class="btn" id="kb">再敲一下鈴</button><button class="btn" id="kw">記一筆禱告</button><button class="btn pri" id="ku">起身</button></div>`;
    $("#kneelv").hidden=false;$("#kb").onclick=bell;$("#ku").onclick=rise;
    $("#kw").onclick=()=>{const H=HALLS.front;H.ask="為了什麼禱告？";wishForm();};},1500);}
function rise(){$("#kneelv").hidden=true;document.body.classList.remove("kneel");}

/* ---------- 光明燈：點燈・添油・圓燈 ---------- */
const LAMP_SEED=[["mazu","正顎手術",1],["yuelao","HH"],["caishen","金庫手冊"],["caishen","國泰業績"],["caishen","晏任行銷"]];
function PL(){const P=ls(PKEY)||{items:[]};P.items=P.items||[];if(!P.lampsSeeded){P.lamps=(P.lamps||[]).concat(LAMP_SEED.map(([d,t,dated],i)=>({id:"L"+Date.now().toString(36)+i,deity:d,text:t,dated:!!dated,date:"",lit:"",oil:[],done:""})));P.lampsSeeded=1;ls(PKEY,P);}P.lamps=P.lamps||[];
  if(!P.seed2){if(!P.lamps.some(l=>l.text==="Vocal"))P.lamps.push({id:"Lv"+Date.now().toString(36),deity:"mazu",text:"Vocal",dated:true,date:"2028-09-01",lit:"",oil:[],done:""});P.seed2=1;ls(PKEY,P);}return P;}
const daysTo=d=>{if(!d)return null;const [y,m,dd]=d.split("-").map(Number),t=new Date(y,m-1,dd),n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5);};
const LAMP_SVG=`<svg viewBox="0 0 24 34"><radialGradient id="lg" cx="50%" cy="40%" r="50%"><stop offset="0" stop-color="#FFE7AE" stop-opacity=".95"/><stop offset="1" stop-color="#FFC86A" stop-opacity="0"/></radialGradient>
  <circle class="gl" cx="12" cy="12" r="12" fill="url(#lg)"/><path class="fl" d="M12 4c2.2 3 3.2 4.8 3.2 6.6a3.2 3.2 0 0 1-6.4 0C8.8 8.8 9.8 7 12 4Z" fill="#FFD27A"/><path class="fl" d="M12 7.5c1 1.5 1.5 2.4 1.5 3.3a1.5 1.5 0 0 1-3 0c0-.9.5-1.8 1.5-3.3Z" fill="#FFF6DE"/>
  <path class="cup" d="M3 16h18l-2.2 9.5c-.4 1.6-1.8 2.5-3.4 2.5H8.6c-1.6 0-3-.9-3.4-2.5Z" fill="var(--cup,#F2EEE6)" stroke="rgba(0,0,0,.18)" stroke-width=".6"/><rect class="cup" x="7.5" y="28" width="9" height="2.2" rx="1" fill="var(--cup,#E6E0D5)"/></svg>`;
// 燈的位置（照片座標）：三殿排在台座兩側；前殿把圓滿的燈排在光縫兩旁的牆腳
function lampSpots(n,front){const out=[];for(let i=0;i<n;i++){const k=Math.floor(i/2),side=i%2?-1:1;
  if(front){out.push([512+side*(30+k*40),416]);}else{const row=Math.floor(k/4),col=k%4;out.push([512+side*(92+col*46),410-row*40]);}}return out;}
function drawLamps(hz,ox,oy,s,w){const P=PL();const front=!!HALLS[cur].front;
  if(cur==="yuelao"){const f=document.createElement("button");f.className="fly";f.setAttribute("aria-label","燕尾蝶燈・愛自己");const fs=Math.max(54,60*s);
    f.style.cssText=`left:${ox+640*s}px;top:${oy+300*s}px;width:${fs}px;height:${fs*.8}px`;
    f.innerHTML=`<img src="img/butterfly.png" alt=""><span class="nm">燕尾蝶・愛自己</span>`;
    f.onclick=()=>{location.href="../love/";};hz.appendChild(f);}
  const L=front?P.lamps.filter(l=>l.done):P.lamps.filter(l=>l.deity===cur&&!l.done);
  const pos=lampSpots(L.length,front),sz=Math.max(18,22*s*(front?.9:1));
  L.forEach((l,i)=>{const b=document.createElement("button");b.className="lamp"+(l.done?" done":l.lit?"":" off");b.setAttribute("aria-label",(l.done?"圓滿的燈：":l.lit?"點亮的燈：":"還沒點的燈：")+l.text);
    b.style.cssText=`left:${ox+pos[i][0]*s}px;top:${oy+pos[i][1]*s}px;width:${sz}px;height:${sz*34/24}px;${l.done?"--cup:#E2C377;":""}`;
    b.innerHTML=LAMP_SVG+`<span class="nm">${esc(l.text)}</span>`;b.onclick=()=>lampView(l.id);hz.appendChild(b);});}
function saveLamp(id,fn){const P=PL(),l=P.lamps.find(x=>x.id===id);if(!l)return;fn(l,P);ls(PKEY,P);layout();}
function lampView(id){const P=PL(),l=P.lamps.find(x=>x.id===id);if(!l)return;const dn=DNAME[l.deity],n=daysTo(l.date);
  const cd=l.date?(n>0?`<div class="cd">還有 ${n} 天</div><p class="m">${esc(l.date)}</p>`:n===0?`<div class="cd">就是今天</div><p class="m">燈為你亮著。</p>`:`<p class="m">${esc(l.date)} 已經過了 ${-n} 天</p>`):"";
  if(l.done){open(`<h3>圓滿・${esc(l.text)}</h3><p class="m">${dn}的燈，${esc(l.lit||"")} 點亮，${esc(l.done)} 圓滿。</p>${l.oil.map(o=>`<div class="oil">${esc(o.t)}<small>${esc(o.d)}</small></div>`).join("")}
      <div class="row"><button class="btn" data-undo>還沒圓滿，放回${dn}那裡</button><button class="btn pri" data-x>好</button></div>`,
    b=>{b.querySelector("[data-undo]").onclick=()=>{saveLamp(id,x=>{x.done="";});close();};});return;}
  if(!l.lit){open(`<h3>${dn}・${esc(l.text)}</h3><p class="m">這盞燈還沒點。按住下面的按鈕三秒，燈就會亮起來。</p>
      ${l.dated||l.date?`<label class="f">日子（例如手術那天，可以之後再填）</label><input type="date" id="ld" value="${esc(l.date)}">`:""}
      <div class="row"><button class="btn pri hold" id="hold"><i></i><span style="position:relative">按住點燈</span></button><button class="btn" data-edit>改名稱</button><button class="btn" data-x>先不要</button></div>`,
    b=>{holdBtn(b.querySelector("#hold"),()=>{const d=b.querySelector("#ld");saveLamp(id,x=>{x.lit=ymd(new Date());if(d)x.date=d.value;});bell();navigator.vibrate&&navigator.vibrate([20,40,20]);
        open(`<h3>燈亮了</h3><p class="m">${dn}的燈，為「${esc(l.text)}」亮著。想回來的時候，在燈前記一句近況。</p><div class="row"><button class="btn pri" data-x>好</button></div>`);});
      b.querySelector("[data-edit]").onclick=()=>editLamp(id);});return;}
  open(`<h3>${dn}・${esc(l.text)}</h3>${cd}<p class="m">${esc(l.lit)} 點亮${l.oil.length?`・添過 ${l.oil.length} 次油`:""}</p>
    ${l.oil.slice().reverse().map(o=>`<div class="oil">${esc(o.t)}<small>${esc(o.d)}</small></div>`).join("")}
    <label class="f">添油：記一句近況（可以不寫）</label><textarea id="lo" placeholder="例如：這個月做到七成" style="min-height:70px"></textarea>
    ${l.dated||l.date?`<label class="f">日子</label><input type="date" id="ld" value="${esc(l.date)}">`:""}
    <div class="row"><button class="btn pri" data-oil>添油</button><button class="btn" data-done>圓燈・事情成了</button><button class="btn" data-edit>改名稱</button><button class="btn" data-x>關起來</button></div>`,
  b=>{b.querySelector("[data-oil]").onclick=()=>{const t=b.querySelector("#lo").value.trim(),d=b.querySelector("#ld");saveLamp(id,x=>{if(t)x.oil.push({d:ymd(new Date()),t});if(d)x.date=d.value;});lampView(id);};
    b.querySelector("[data-done]").onclick=()=>{saveLamp(id,x=>{x.done=ymd(new Date());});bell();
      open(`<h3>圓燈</h3><p class="m">「${esc(l.text)}」圓滿了。這盞燈變成金色，搬到前殿光縫旁的牆腳，每次走進禱告室都看得到。</p><div class="row"><button class="btn pri" data-x>好</button></div>`);};
    b.querySelector("[data-edit]").onclick=()=>editLamp(id);});}
function editLamp(id){const P=PL(),l=id&&P.lamps.find(x=>x.id===id);
  open(`<h3>${l?"改這盞燈":"點一盞新的燈・"+HALLS[cur].name}</h3><label class="f">為了什麼</label><input type="text" id="ln" maxlength="16" value="${esc(l?l.text:"")}" style="width:100%;font:inherit;font-size:16px;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:12px">
    <label class="f">日子（可以不填）</label><input type="date" id="ld" value="${esc(l?l.date:"")}">
    <div class="row"><button class="btn pri" data-ok>${l?"存好":"放上燈牆"}</button>${l?`<button class="btn" data-del>撤下這盞燈</button>`:""}<button class="btn" data-x>取消</button></div>`,
  b=>{b.querySelector("[data-ok]").onclick=()=>{const t=b.querySelector("#ln").value.trim(),d=b.querySelector("#ld").value;if(!t)return;
      if(l)saveLamp(id,x=>{x.text=t;x.date=d;x.dated=x.dated||!!d;});else{const P2=PL();const nl={id:"L"+Date.now().toString(36),deity:cur,text:t,dated:!!d,date:d,lit:"",oil:[],done:""};P2.lamps.push(nl);ls(PKEY,P2);layout();lampView(nl.id);return;}
      l?lampView(id):close();};
    const del=b.querySelector("[data-del]");if(del)del.onclick=()=>{if(!confirm("撤下這盞燈？"))return;const P2=PL();P2.lamps=P2.lamps.filter(x=>x.id!==id);ls(PKEY,P2);layout();close();};});}
function holdBtn(el,done){let t=null;const start=e=>{e.preventDefault();el.classList.add("on");t=setTimeout(()=>{el.classList.remove("on");t=null;done();},3000);};
  const stop=()=>{if(t){clearTimeout(t);t=null;}el.classList.remove("on");};
  el.addEventListener("pointerdown",start);el.addEventListener("pointerup",stop);el.addEventListener("pointerleave",stop);el.addEventListener("pointercancel",stop);el.addEventListener("contextmenu",e=>e.preventDefault());}
$("#lampAdd").onclick=()=>editLamp(null);

/* ---------- 祈願存摺 ---------- */
const DNAME={mazu:"媽祖",yuelao:"月老",caishen:"財神爺",front:"前殿"};
let bookTab="here";
function bookView(){const P=ls(PKEY)||{items:[]};
  if(HALLS[cur].front)bookTab="all";const list=P.items.filter(i=>bookTab==="all"||i.deity===cur).slice().reverse();
  open(`<h3>祈願存摺</h3><div class="tabs">${HALLS[cur].front?"":`<button data-t="here" class="${bookTab==="here"?"on":""}">${HALLS[cur].name}</button>`}<button data-t="all" class="${bookTab==="all"?"on":""}">全部</button></div>
    ${list.length?list.map(i=>`<div class="it ${i.status==="done"?"done":""}"><div class="t">${bookTab==="all"?`<span class="tag">${esc(DNAME[i.deity]||"床邊")}</span>`:""}${esc(i.text)}<div class="d">${esc(i.date)}${i.go?" ・出發 "+esc(i.go):""}${i.status==="done"&&i.doneAt?" ・還願 "+esc(i.doneAt):""}</div></div><button class="mk" data-id="${esc(i.id)}">${i.status==="done"?"已還願":"還願"}</button></div>`).join("")
      :`<div class="empty">還沒有祈願</div>`}
    <div class="row"><button class="btn" data-x>關起來</button></div>`,
  b=>{b.querySelectorAll("[data-t]").forEach(x=>x.onclick=()=>{bookTab=x.dataset.t;bookView();});
    b.querySelectorAll("[data-id]").forEach(x=>x.onclick=()=>{const P2=ls(PKEY)||{items:[]};const it=P2.items.find(i=>i.id===x.dataset.id);if(!it)return;
      if(it.status==="done"){it.status="open";delete it.doneAt;}else{it.status="done";it.doneAt=ymd(new Date());}ls(PKEY,P2);bookView();});});}
$("#pray").onclick=()=>HALLS[cur].front?kneel():pray();$("#book").onclick=bookView;
$("#back").onclick=()=>{if(!HALLS[cur].front){setHall("front");return;}if(window.top!==window.self)parent.postMessage({origina:"close-app"},"*");else location.href="https://fuwei0618-cmd.github.io/Entry/?go=attic,halls";};
setHall(cur,true);
</script>
