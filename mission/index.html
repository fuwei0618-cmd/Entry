<html lang="zh-Hant"><head><meta charset="utf-8">

<title>使命板</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
:root{
  --stone:#F5F2EC;--stone2:#ECE6DC;--card:#FBF9F5;--ink:#3B352E;--muted:#857A6D;--line:#E3DCD0;
  --brass:#B08D57;--brass2:#8A6A3A;--iron:#2E2925;--teresa:#C9705A;--elva:#B5546F;--chiara:#8C9A6B;
  --serif:"Noto Serif TC","Songti TC",serif;--f:"PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(59,53,46,.05),0 8px 24px rgba(59,53,46,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--stone);color:var(--ink);font-family:var(--f);line-height:1.65}
body{background:radial-gradient(120% 60% at 50% 0,#FFFDF8 0,var(--stone) 60%)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(245,242,236,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:999px;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:#FBF9F5}
.mute{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:13px;color:var(--muted);white-space:nowrap}
.wrap{max-width:720px;margin:0 auto;padding:8px 16px calc(48px + env(safe-area-inset-bottom));display:grid;gap:26px}
.wrap>*{min-width:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-size:14px;min-height:38px}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#FBF9F5}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 12px;min-height:32px;font-size:13px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
h2{margin:0 0 10px;font-size:14px;letter-spacing:.16em;color:var(--muted);font-weight:600}
h2 small{font-weight:400;letter-spacing:.02em;margin-left:8px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:15px}
textarea{min-height:76px;resize:vertical}

/* 主頁：安靜、留白 */
.why{font-family:var(--serif);font-size:clamp(22px,5.4vw,30px);line-height:1.55;letter-spacing:.04em;text-align:center;margin:18px auto 0;max-width:22em;text-wrap:balance;cursor:text;border-radius:12px;padding:4px 8px}
.why:hover{background:rgba(176,141,87,.06)}
.belltop{position:relative;height:min(54vh,420px);margin:0 -16px}
#bellc{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#bellc:active{cursor:grabbing}
.bellhint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:13px;color:var(--muted);pointer-events:none;transition:opacity .6s}
.step{display:grid;gap:12px;animation:rise .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stepn{font-size:12px;letter-spacing:.24em;color:var(--brass2)}
.breath{display:grid;justify-items:center;gap:10px;padding:18px}
.orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFF6E4,#E8D3AE 70%);box-shadow:0 0 0 1px rgba(176,141,87,.25),0 10px 40px rgba(176,141,87,.25);transform:scale(.6)}
.orb.in{transition:transform 4s ease-in-out;transform:scale(1)}
.orb.out{transition:transform 6s ease-in-out;transform:scale(.6)}
.btext{font-family:var(--serif);font-size:20px;letter-spacing:.2em}
.alarms{display:flex;flex-wrap:wrap;gap:8px}
.alarms button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 18px;font-size:15px}
.alarms button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#FBF9F5}
.alarms .add{border-style:dashed;color:var(--muted);background:transparent}
.logic{padding:16px 18px;display:grid;gap:6px}
.logic .l{font-size:15px}
.logic .q{font-family:var(--serif);font-size:18px;line-height:1.6}
.act{padding:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.act .a{font-family:var(--serif);font-size:19px}
.go{font-size:14px;color:var(--brass2);background:none;border:0;padding:6px 0;text-decoration:underline;text-underline-offset:4px}
.skip{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}

/* 我是誰 */
.cover{padding:18px;display:grid;justify-items:center;gap:8px;text-align:center}
.cover svg{width:min(320px,80vw);height:auto}
.cover .fire{font-family:var(--serif);font-size:18px}
.cover p{margin:0;font-size:14px;color:var(--muted);max-width:30em}
.persona{overflow:hidden}
.persona>button{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;width:100%;padding:14px 16px;border:0;background:none;text-align:left}
.persona .ill{width:64px;height:64px}
.persona .nm{font-family:var(--serif);font-size:21px;letter-spacing:.06em}
.persona .fm{font-size:13px;color:var(--muted)}
.persona .chev{color:var(--muted);transition:transform .3s}
.persona.open .chev{transform:rotate(90deg)}
.pbody{display:none;padding:0 16px 18px;gap:12px}
.persona.open .pbody{display:grid}
.pbody .big{display:flex;gap:10px;justify-content:center;padding:10px;background:var(--stone);border-radius:14px}
.pbody .big svg{width:30%;max-width:120px;height:auto}
.pbody dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.pbody dt{color:var(--muted)}.pbody dd{margin:0}

/* 拆解室 */
.fws{display:flex;flex-wrap:wrap;gap:8px}
.fws button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px}
.fws button[aria-pressed="true"]{background:var(--ink);color:#FBF9F5;border-color:var(--ink)}
.fws .add{border-style:dashed;color:var(--muted);background:transparent}
.qs{padding:16px;display:grid;gap:14px}
.qs label{display:grid;gap:6px;font-size:15px}
.qs label span{font-family:var(--serif)}
.tmap{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:6px}
.tmap .th{font-size:12px;color:var(--muted);text-align:center;align-self:end;padding:2px}
.tmap .th.side{writing-mode:vertical-rl;text-align:center;align-self:center;letter-spacing:.1em;padding:4px 0}
.tcell{min-height:84px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;text-align:left;position:relative}
.tcell span{font-size:12px;background:var(--stone2);border-radius:999px;padding:1px 8px}
.tcell i{font-style:normal;color:#CFC6B8;font-size:12px}
.tcell b{position:absolute;right:6px;bottom:4px;font-size:11px;color:var(--brass2);font-weight:600}
.tcell.on{border-color:var(--brass);box-shadow:0 0 0 2px rgba(176,141,87,.3)}
.cellv{padding:14px 16px;margin-top:10px;display:grid;gap:6px}
.cellv p{margin:0;font-size:14.5px}.cellv b,.qa b{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{font-size:13px;background:var(--stone2);border-radius:999px;padding:2px 10px}
.q2{font-family:var(--serif);font-size:16px}
.fp{border-left:2px solid var(--brass);padding-left:10px;display:grid;gap:4px}
.anti{font-family:var(--serif);font-size:16px;padding:6px 0;border-top:1px solid var(--line)}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.logsel{font-size:14px;color:var(--muted)}
.logsel select{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;max-width:100%}

/* 證據 */
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.num{padding:14px;display:grid;gap:2px}
.num b{font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2;font-family:var(--serif)}
.num span{font-size:12.5px;color:var(--muted)}
.chart{padding:14px}
.chart svg{width:100%;height:auto;display:block}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;margin-top:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.recs{padding:14px;display:grid;gap:8px}
.rec{display:grid;grid-template-columns:74px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.rec:first-child{border-top:0}
.rec .m{font-variant-numeric:tabular-nums;color:var(--muted)}
.blist{display:grid;gap:8px}
.bitem{padding:12px 14px}
.bitem summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:14.5px;list-style:none}
.bitem summary::-webkit-details-marker{display:none}
.bitem .qa{margin:8px 0 0;font-size:14px;display:grid;gap:6px}
.bitem .qa p{margin:0}.bitem .qa b{font-weight:600;color:var(--muted);font-size:13px;display:block}
.empty{padding:16px;color:var(--muted);font-size:14px}

.dlg{position:fixed;inset:0;background:rgba(40,34,28,.32);display:grid;place-items:end center;z-index:20;padding:12px}
@media (min-width:640px){.dlg{place-items:center}}
.dlg[hidden]{display:none}
.dlg .box{width:100%;max-width:460px;padding:18px;display:grid;gap:12px;max-height:88vh;overflow:auto}
.dlg h3{margin:0;font-size:17px}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.list{display:grid;gap:6px}
.list div{display:flex;gap:8px;align-items:center;font-size:14.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.list div span{flex:1}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:4px 8px}
@media (prefers-reduced-motion:reduce){.step{animation:none}.orb.in,.orb.out{transition-duration:.01s}}
@media (max-width:480px){.num b{font-size:20px}.persona>button{grid-template-columns:52px 1fr auto}.persona .ill{width:52px;height:52px}}
</style>

"use strict";
const KEY="origina.mission.v1";
const ALARM_COLORS=["#C9705A","#8C9A6B","#B08D57","#7C93A8","#B5546F","#6E8F8A","#A68B6B"];
const DEFAULT={v:1,

    {id:"money",name:"錢",logic:"從小的匱乏感，把錢當成允許自己想要的通行證。",question:"我的價值，和今天賺多少，是同一件事嗎？"},
    {id:"passion",name:"熱情",logic:"把熱情想成要很吵才算數。",question:"最近有沒有什麼東西「長得對了」？"}],
  smallActs:["帶自己去一間漂亮的咖啡廳","錄一首歌","散步十五分鐘","整理 Origina 一個房間","煮好吃的給自己","送自己一個平常不敢買的小東西","聽一首鄧麗君"],

    {id:"entropy",name:"熵",questions:["我現在在高熵（新環境、混亂、旅行中）還是低熵（太安逸、停滯）？","這個念頭是混亂帶來的，還是停滯帶來的？","我需要的是秩序（一個錨點、一個固定習慣），還是新鮮感？"]},
    {id:"loop",name:"閉環",questions:["這件事卡在哪一環：表達（唱歌）、身體主權（性感）、落地（財富）？","補哪一環，會讓另外兩環也動起來？","今天能做的最小一步是什麼？"]}],

let D;try{D=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){D=null;}
if(!D||!D.alarms)D=JSON.parse(JSON.stringify(DEFAULT));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const nowStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;};
const ym=s=>s.slice(0,7);
const alarmById=id=>D.alarms.find(a=>a.id===id);
const alarmColor=id=>ALARM_COLORS[Math.max(0,D.alarms.findIndex(a=>a.id===id))%ALARM_COLORS.length];
let muted=false;try{muted=localStorage.getItem("mission-muted")==="1";}catch(e){}

/* ---------- 插畫（線條，同一套筆觸） ---------- */
const S=`fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"`;
const ILL={
  ginkgo:`<svg viewBox="0 0 100 100" ${S}><path d="M50 92 C50 74 50 66 50 58"/><path d="M50 58 C30 58 14 44 14 26 C26 18 40 20 46 30 L50 42 L54 30 C60 20 74 18 86 26 C86 44 70 58 50 58Z"/><path d="M50 58 L36 32 M50 58 L44 26 M50 58 L56 26 M50 58 L64 32"/></svg>`,

  poppy:`<svg viewBox="0 0 100 100" ${S}><path d="M50 92 C52 76 48 66 50 54"/><path d="M50 54 C34 56 22 44 26 30 C30 18 44 20 50 30 C56 20 70 18 74 30 C78 44 66 56 50 54Z"/><path d="M38 34 C42 44 58 44 62 34"/><circle cx="50" cy="38" r="5"/><path d="M50 78 C60 72 66 74 70 68"/></svg>`,

const PNAME={teresa:"Teresa",elva:"Elva",chiara:"Chiara"};
function sundialSVG(){ // 日晷封面：三個圓＋中間一把火＋外圈時間（之後換成你的圖）
  let ticks="";for(let i=0;i<24;i++){const a=i/24*Math.PI*2,r1=i%2?132:126,r2=140;ticks+=`<line x1="${150+Math.cos(a)*r1}" y1="${150+Math.sin(a)*r1}" x2="${150+Math.cos(a)*r2}" y2="${150+Math.sin(a)*r2}"/>`;}

/* ---------- 3D 黃銅掛鈴 ---------- */
const bell=(()=>{
  let R,scene,cam,bellG,clapG,canvas,raf=0,ctx=null,buf=null,loading=null,last=0;
  let th=0,thv=0,ph=0,phv=0,drag=null,lastHit=0;
  const L1=.4,L2=.5,LIM=.34,G=9.8;
  function init(){
    R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
    R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=.9;R.physicallyCorrectLights=true;
    scene=new THREE.Scene();cam=new THREE.PerspectiveCamera(30,1,.1,50);cam.position.set(-.25,-.1,4.2);cam.lookAt(-.25,-.22,0);

    const env=new THREE.Scene(),eg=new THREE.SphereGeometry(10,32,16),cols=[];const top=new THREE.Color(0xFFE6C2),mid=new THREE.Color(0xC9A27A),bot=new THREE.Color(0x3A2C22);
    for(let i=0;i<eg.attributes.position.count;i++){const y=eg.attributes.position.getY(i)/10,c=y>0?mid.clone().lerp(top,y):mid.clone().lerp(bot,-y);cols.push(c.r,c.g,c.b);}
    eg.setAttribute("color",new THREE.Float32BufferAttribute(cols,3));env.add(new THREE.Mesh(eg,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
    const win=new THREE.Mesh(new THREE.PlaneGeometry(6,4),new THREE.MeshBasicMaterial({color:0xFFF4DD}));win.position.set(-6,3,4);win.lookAt(0,0,0);env.add(win);
    const win2=new THREE.Mesh(new THREE.PlaneGeometry(3,6),new THREE.MeshBasicMaterial({color:0xFFD9A8}));win2.position.set(7,1,-2);win2.lookAt(0,0,0);env.add(win2);
    const pm=new THREE.PMREMGenerator(R);scene.environment=pm.fromScene(env,.04).texture;
    const key=new THREE.DirectionalLight(0xFFE2B8,2.2);key.position.set(-3,4,3);scene.add(key);
    scene.add(new THREE.HemisphereLight(0xFFF1DC,0x5A4636,.6));
    // 黃銅：用過的溫潤光澤（粗糙度帶一點斑駁）
    const cv=document.createElement("canvas");cv.width=cv.height=256;const g=cv.getContext("2d");g.fillStyle="#7a7a7a";g.fillRect(0,0,256,256);
    for(let i=0;i<2600;i++){const v=100+Math.random()*80|0;g.fillStyle=`rgba(${v},${v},${v},.35)`;g.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*3,1+Math.random()*2);}
    const rough=new THREE.CanvasTexture(cv);rough.wrapS=rough.wrapT=THREE.RepeatWrapping;rough.repeat.set(3,2);
    const brass=new THREE.MeshStandardMaterial({color:0x9C6B31,metalness:1,roughness:.33,roughnessMap:rough,side:THREE.DoubleSide});
    const brassIn=new THREE.MeshStandardMaterial({color:0x8E6B3A,metalness:1,roughness:.55,side:THREE.BackSide});
    const iron=new THREE.MeshStandardMaterial({color:0x2C2724,metalness:.7,roughness:.6});
    // 鍛鐵支架：細長立柱、底座、頂飾、帶捲草的橫臂、U 形吊架
    const tube=(pts,r)=>new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p))),120,r,8,false),iron);
    const PX=-.72;
    scene.add(tube([[PX,-1.62,0],[PX,.84,0]],.032));
    const base=new THREE.Mesh(new THREE.CylinderGeometry(.11,.17,.08,32),iron);base.position.set(PX,-1.66,0);scene.add(base);
    const base2=new THREE.Mesh(new THREE.CylinderGeometry(.06,.1,.12,24),iron);base2.position.set(PX,-1.56,0);scene.add(base2);
    [-.9,-.1,.55].forEach(y=>{const c=new THREE.Mesh(new THREE.TorusGeometry(.045,.012,8,20),iron);c.rotation.x=Math.PI/2;c.position.set(PX,y,0);scene.add(c);});
    const fin=new THREE.Mesh(new THREE.ConeGeometry(.045,.14,16),iron);fin.position.set(PX,.94,0);scene.add(fin);
    const finB=new THREE.Mesh(new THREE.SphereGeometry(.04,16,12),iron);finB.position.set(PX,.86,0);scene.add(finB);
    scene.add(tube([[PX,.66,0],[-.3,.665,0],[.06,.66,0]],.02));
    const tipB=new THREE.Mesh(new THREE.SphereGeometry(.03,12,10),iron);tipB.position.set(.08,.66,0);scene.add(tipB);
    // 橫臂下的兩個 S 形捲草
    const scr=[];for(let i=0;i<=50;i++){const t=i/50;scr.push([PX+.02+t*.5,.62-Math.sin(t*Math.PI)*.12-t*.04,0]);}
    scene.add(tube(scr,.011));
    const curl=(cx,cy,r0,dir)=>{const q=[];for(let i=0;i<=36;i++){const t=i/36,a=t*Math.PI*1.6,r=r0*(1-t*.7);q.push([cx+Math.cos(a)*r*dir,cy+Math.sin(a)*r,0]);}return tube(q,.009);};
    scene.add(curl(PX+.52,.54,.06,1));scene.add(curl(PX+.1,.5,.05,-1));
    // U 形吊架
    scene.add(tube([[-.05,.66,0],[-.05,.5,0]],.01));scene.add(tube([[.05,.66,0],[.05,.5,0]],.01));
    // 鈴：古典鐘形（圓肩、內收的腰、外翻厚唇），比例縮小配合支架
    bellG=new THREE.Group();bellG.position.set(0,.5,0);scene.add(bellG);
    const axle=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.13,8),iron);axle.rotation.z=Math.PI/2;bellG.add(axle);
    const canon=new THREE.Mesh(new THREE.TorusGeometry(.035,.011,8,20),brass);canon.position.y=-.025;bellG.add(canon);
    const T=-.06;
    const P=[[0,T],[.05,T],[.09,T-.012],[.135,T-.04],[.165,T-.085],[.18,T-.14],[.185,T-.2],[.19,T-.27],[.205,T-.34],[.235,T-.41],[.28,T-.47],[.32,T-.51],[.338,T-.535],[.34,T-.56],[.33,T-.575]].map(([x,y])=>new THREE.Vector2(x,y));
    bellG.add(new THREE.Mesh(new THREE.LatheGeometry(P,96),brass));
    const Pin=[[.315,T-.57],[.3,T-.53],[.265,T-.48],[.225,T-.42],[.195,T-.35],[.178,T-.27],[.172,T-.2],[.165,T-.14],[.14,T-.09],[.09,T-.06],[0,T-.055]].map(([x,y])=>new THREE.Vector2(x,y));
    bellG.add(new THREE.Mesh(new THREE.LatheGeometry(Pin,96),brassIn));
    [[.175,T-.1,.006],[.19,T-.24,.005],[.322,T-.52,.008]].forEach(([r,y,w])=>{const b=new THREE.Mesh(new THREE.TorusGeometry(r,w,8,96),brass);b.rotation.x=Math.PI/2;b.position.y=y;bellG.add(b);});

    const rod=new THREE.Mesh(new THREE.CylinderGeometry(.007,.007,L2-.08,8),iron);rod.position.y=-(L2+.08)/2;clapG.add(rod);

  function size(){if(!canvas)return;const w=canvas.clientWidth,h=canvas.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.position.z=w/h<.8?4.6:3.9;cam.updateProjectionMatrix();}
  async function loadSound(){if(buf||loading)return loading;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
    loading=fetch("sound/bell.mp3").then(r=>r.arrayBuffer()).then(a=>new Promise((res,rej)=>ctx.decodeAudioData(a,res,rej))).then(b=>{buf=b;}).catch(()=>{});return loading;}
  function ding(power){navigator.vibrate&&navigator.vibrate(Math.min(30,8+power*14|0));onRing();
    if(muted||!ctx||!buf)return;const s=ctx.createBufferSource(),g=ctx.createGain();s.buffer=buf;s.playbackRate.value=.97+Math.random()*.06;

  function step(dt){

  function pointer(){

    const up=e=>{if(!drag)return;const d=drag;drag=null;if(!d.moved){const r=canvas.getBoundingClientRect(),side=(e.clientX-r.left)/r.width<.5?1:-1;thv+=side*2.6;}};

/* ---------- 拆解室：說一個事件 → 帶去 Claude 拆 → 貼回拆解碼 → 存成紀錄 ---------- */
let roomFrom=null,openCell=null;
const DOMAINS=["生存・事業","身體","愛・生活・旅行"],LEVELS=["生理・安全","愛與歸屬・尊重","自我實現"];
function claudePrompt(story){
  const themes=[...new Set(D.breakdowns.filter(b=>b.theme).map(b=>b.theme))];
  const anti=D.breakdowns.filter(b=>b.antidote).slice(-6).map(b=>`- ${b.theme||""}：${b.antidote}`).join("\n");
  return `請幫我拆解一個事件（我在 Origina 使命板的拆解室）。

【我的公式】共鳴（Teresa・一生唱，給世界）× 慾望（Elva・一生愛，給自己）× 豐盛（Chiara・一生豐盛，地基）＝生命力。是乘法，任何一項變零整個就是零。
【我為什麼努力】${D.why}
【常見警報】${D.alarms.map(a=>a.name).join("、")}
【可用的框架】副本檢查、人事時地物、馬斯洛、邏輯層次（迪爾茨）、熵、閉環（唱歌・性感・財富）
${themes.length?`【我以前拆過的主題】${themes.join("、")}（如果這次是同一個主題，請用一樣的名字）\n`:""}${anti?`【以前的解藥句】\n${anti}\n`:""}
【事件】
${story}

請先用溫暖、有深度的方式陪我想清楚（像朋友開導我，但要真的拆到底層，不要只給正向口號），再把結果整理成下面這個 JSON，放在最後一個程式碼區塊裡，讓我複製貼回拆解室。欄位都用繁體中文：
\`\`\`json
{"type":"breakdown","event":"一句話描述事件","alarm":"觸發的警報（從常見警報選，沒有就新取一個）","theme":"這類念頭的主題名稱（短，例如：選擇＝失去）","domain":"生存・事業／身體／愛・生活・旅行 三選一","level":"生理・安全／愛與歸屬・尊重／自我實現 三選一","assumptions":["藏在底下的假設"],"firstPrinciples":{"facts":["確定的事實"],"assumed":["其實只是假設的部分"],"core":"拆到最底層，真正的需求","rebuild":"從事實重新推一次的結論"},"lenses":[{"name":"框架名","insight":"這個框架看見的事（只挑真正用得上的 2～3 個）"}],"formula":"這件事讓公式哪一項變零？怎麼讓三項都留著？","conclusion":"一句結論","action":"今天能做的一個小行動","antidote":"下次這個念頭出現時，對自己說的一句話","bridge":"從現在的我走到想要的我，一句我現在就能相信的橋接句"}
\`\`\``;}
function parseCode(txt){const m=txt.match(/\{[\s\S]*\}/);if(!m)throw new Error("找不到拆解碼");return JSON.parse(m[0]);}
function renderRoom(){
  D.library=D.library||{cells:{}};
  const themes={};D.breakdowns.forEach(b=>{if(b.theme)(themes[b.theme]=themes[b.theme]||[]).push(b);});
  const grid=`<div class="tmap"><div></div>${LEVELS.map(l=>`<div class="th">${l}</div>`).join("")}${DOMAINS.map(d=>`<div class="th side">${d}</div>${LEVELS.map(l=>{const k=d+"|"+l,c=D.library.cells[k]||{},n=D.breakdowns.filter(b=>b.domain===d&&b.level===l).length;
    return `<button class="tcell${openCell===k?" on":""}" data-cell="${esc(k)}">${(c.thoughts||[]).slice(0,4).map(t=>`<span>${esc(t)}</span>`).join("")||'<i>空</i>'}${n?`<b>${n} 筆</b>`:""}</button>`;}).join("")}`).join("")}</div>`;
  const cell=openCell&&(D.library.cells[openCell]||{});
  $("#app").innerHTML=`<section class="card qs">
    <h2 style="margin:0">發生了什麼？</h2>
    <textarea id="story" style="min-height:120px" placeholder="把事情講出來就好，不用整理。例如：今天看到朋友要嫁去國外，突然覺得我在台灣認真唱歌，是不是就沒有這個選擇了……">${esc(sessionStorage.getItem("mission-story")||"")}</textarea>
    <div class="row"><button class="btn pri" id="toClaude">帶去 Claude 拆解 ↗</button><button class="btn" id="copyP">只複製</button></div>
    <p class="muted" style="margin:0;font-size:13px">會打開 Claude 的新對話，並把你的事件和拆解格式一起帶過去（沒自動填好就直接貼上）。聊完，把 Claude 最後給的拆解碼複製回來，貼在下面。</p></section>
  <section class="card qs"><h2 style="margin:0">貼上拆解碼</h2><textarea id="code" placeholder="把 Claude 給的那一段 { … } 貼在這裡"></textarea>
    <div class="row"><button class="btn pri" id="saveCode">存起來</button></div><div id="codeMsg" class="muted" style="font-size:13px"></div></section>
  <section><h2>念頭地圖<small>你常有的念頭，放在它屬於的格子裡；點一格看它的橋接句</small></h2>${grid}
    ${cell?`<div class="card cellv"><div class="muted" style="font-size:12.5px">${esc(openCell.replace("|","・"))}</div>
      ${(cell.thoughts||[]).length?`<div class="chips">${cell.thoughts.map(t=>`<span>${esc(t)}</span>`).join("")}</div>`:""}
      ${cell.need?`<p><b>底層的需要</b>${esc(cell.need)}</p>`:""}${cell.bridge?`<p class="q2"><b>橋接句</b>${esc(cell.bridge)}</p>`:""}${cell.destination?`<p><b>想走到的地方</b>${esc(cell.destination)}</p>`:""}
      <div class="row"><button class="btn sm" id="editCell">編輯這一格</button></div></div>`:""}</section>
  ${Object.keys(themes).length?`<section><h2>反覆出現的主題</h2><div class="blist">${Object.entries(themes).sort((a,b)=>b[1].length-a[1].length).map(([t,L])=>{const last=L[L.length-1];return `<div class="card bitem"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(t)}</b><span class="muted">${L.length} 次</span></div>${last.antidote?`<p class="q2" style="margin:6px 0 0">${esc(last.antidote)}</p>`:""}</div>`;}).join("")}</div></section>`:""}
  <section><h2>拆過的紀錄</h2>${breakdownList()}</section>`;
  const st=$("#story");st.oninput=()=>{try{sessionStorage.setItem("mission-story",st.value);}catch(e){}};
  const copy=async()=>{const t=claudePrompt(st.value.trim()||"（我還沒寫，先跟你說說）");try{await navigator.clipboard.writeText(t);return true;}catch(e){return false;}};
  $("#copyP").onclick=async()=>{$("#copyP").textContent=(await copy())?"已複製 ✓":"複製失敗，請手動選取";};
  $("#toClaude").onclick=async()=>{const ok=await copy();const t=claudePrompt(st.value.trim());const u="https://claude.ai/new?q="+encodeURIComponent(t.length>6000?t.slice(0,6000):t);window.open(u,"_blank","noopener");if(!ok)$("#toClaude").textContent="已打開 Claude";};
  $("#saveCode").onclick=()=>{const msg=$("#codeMsg");try{const j=parseCode($("#code").value);
    if(j.type==="library"){(j.cells||[]).forEach(c=>{const k=c.domain+"|"+c.level;D.library.cells[k]={thoughts:c.thoughts||[],need:c.need||"",bridge:c.bridge||"",destination:c.destination||""};});save();msg.textContent="念頭地圖更新好了 ✓";renderRoom();return;}
    const d=new Date(),b={id:"b"+Date.now().toString(36),v:2,date:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,story:st.value.trim(),...j,forChapter9:false};delete b.type;
    if(b.alarm&&!D.alarms.some(a=>a.name===b.alarm))D.alarms.push({id:"a"+Date.now().toString(36),name:b.alarm,logic:(b.assumptions||[])[0]||"",question:"這是事實，還是我又相信了一個假設？"});
    const al=D.alarms.find(a=>a.name===b.alarm);if(al)b.alarmId=al.id;
    D.breakdowns.push(b);if(roomFrom){const l=D.bellLog.find(x=>x.id===roomFrom);if(l)l.breakdownId=b.id;roomFrom=null;}
    const same=D.breakdowns.filter(x=>x.theme&&x.theme===b.theme).length;save();try{sessionStorage.removeItem("mission-story");}catch(e){}
    renderRoom();$("#codeMsg").textContent=same>1?`存好了。這是「${b.theme}」第 ${same} 次出現，上面有前幾次的解藥句。`:"存好了 ✓";}catch(e){msg.textContent="看不懂這段拆解碼：請確認有完整複製到最後一個 }";}};
  document.querySelectorAll("[data-cell]").forEach(b=>b.onclick=()=>{openCell=openCell===b.dataset.cell?null:b.dataset.cell;renderRoom();});
  const ec=$("#editCell");if(ec)ec.onclick=()=>{const c=D.library.cells[openCell]||{};dialog(`<h3>${esc(openCell.replace("|","・"))}</h3>
    <label class="field">常有的念頭（一行一個）<textarea id="ct">${esc((c.thoughts||[]).join("\n"))}</textarea></label><label class="field">底層的需要<textarea id="cn">${esc(c.need||"")}</textarea></label>
    <label class="field">橋接句<textarea id="cb">${esc(c.bridge||"")}</textarea></label><label class="field">想走到的地方<textarea id="cd">${esc(c.destination||"")}</textarea></label>
    <div class="row"><button class="btn pri" data-ok>存好</button><button class="btn ghost" data-x>取消</button></div>`,
    box=>box.querySelector("[data-ok]").onclick=()=>{D.library.cells[openCell]={thoughts:box.querySelector("#ct").value.split("\n").map(s=>s.trim()).filter(Boolean),need:box.querySelector("#cn").value.trim(),bridge:box.querySelector("#cb").value.trim(),destination:box.querySelector("#cd").value.trim()};save();closeDlg();renderRoom();});};
  bindBList();}
function breakdownList(){if(!D.breakdowns.length)return `<div class="card empty">還沒有拆過。把一件事講出來，帶去 Claude 拆完，再貼回來。</div>`;
  const li=(t,arr)=>arr&&arr.length?`<p><b>${t}</b>${arr.map(esc).join("<br>")}</p>`:"";
  return `<div class="blist">${D.breakdowns.slice().reverse().map(b=>{
    if(b.v!==2){const f=D.frameworks.find(x=>x.id===b.framework);return `<details class="card bitem"><summary><span>${esc(b.date)}・${esc(f?f.name:"")}</span><span class="muted">${esc(b.conclusion||"")}</span></summary><div class="qa">${(f?f.questions:[]).map((q,i)=>b.answers&&b.answers[i]?`<p><b>${esc(q)}</b>${esc(b.answers[i])}</p>`:"").join("")}<div class="row"><button class="btn sm ghost" data-delb="${b.id}">刪除</button></div></div></details>`;}
    const fp=b.firstPrinciples||{};
    return `<details class="card bitem"><summary><span>${esc(b.date)}・${esc(b.event||"")}</span><span class="muted">${esc(b.theme||"")}${b.forChapter9?"・第九章":""}</span></summary>
    <div class="qa">${b.story?`<p><b>當時說的</b>${esc(b.story)}</p>`:""}${b.alarm?`<p><b>警報</b>${esc(b.alarm)}</p>`:""}${li("藏在底下的假設",b.assumptions)}
    ${fp.facts||fp.core?`<div class="fp"><b>第一性原理</b>${li("事實",fp.facts)}${li("其實是假設",fp.assumed)}${fp.core?`<p><b>最底層的需要</b>${esc(fp.core)}</p>`:""}${fp.rebuild?`<p><b>重新推一次</b>${esc(fp.rebuild)}</p>`:""}</div>`:""}
    ${(b.lenses||[]).map(l=>`<p><b>${esc(l.name)}</b>${esc(l.insight)}</p>`).join("")}${b.formula?`<p><b>回到公式</b>${esc(b.formula)}</p>`:""}
    ${b.conclusion?`<p><b>結論</b>${esc(b.conclusion)}</p>`:""}${b.action?`<p><b>小行動</b>${esc(b.action)}</p>`:""}${b.antidote?`<p class="q2"><b>解藥句</b>${esc(b.antidote)}</p>`:""}${b.bridge?`<p class="q2"><b>橋接句</b>${esc(b.bridge)}</p>`:""}
    <div class="row"><button class="btn sm" data-ch9="${b.id}">${b.forChapter9?"從第九章拿掉":"放進第九章"}</button><button class="btn sm ghost" data-delb="${b.id}">刪除</button></div></div></details>`;}).join("")}</div>`;}
function bindBList(){document.querySelectorAll("[data-ch9]").forEach(x=>x.onclick=()=>{const b=D.breakdowns.find(y=>y.id===x.dataset.ch9);b.forChapter9=!b.forChapter9;save();render();});
  document.querySelectorAll("[data-delb]").forEach(x=>x.onclick=()=>dialog(`<h3>刪除這筆拆解？</h3><div class="row"><button class="btn pri" data-ok>刪除</button><button class="btn ghost" data-x>取消</button></div>`,
    box=>box.querySelector("[data-ok]").onclick=()=>{D.breakdowns=D.breakdowns.filter(y=>y.id!==x.dataset.delb);D.bellLog.forEach(l=>{if(l.breakdownId===x.dataset.delb)l.breakdownId=null;});save();closeDlg();render();}));}

/* ---------- 證據 ---------- */
const idb=(()=>{let p;const db=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open("origina-mission",1);r.onupgradeneeded=()=>r.result.createObjectStore("rec");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
  const tx=(m,f)=>db().then(d=>new Promise((res,rej)=>{const t=d.transaction("rec",m),q=f(t.objectStore("rec"));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);}));
  return{put:(k,v)=>tx("readwrite",s=>s.put(v,k)),get:k=>tx("readonly",s=>s.get(k)),del:k=>tx("readwrite",s=>s.delete(k))};})();
async function recBlob(r){try{const b=await idb.get(r.file);if(b)return b;}catch(e){}
  try{if(window.OriginaSync&&await OriginaSync.getToken()){const b=await OriginaSync.api.getBlob("Mission/recordings/"+r.file);if(b){idb.put(r.file,b).catch(()=>{});return b;}}}catch(e){}return null;}
function renderProof(){
  const m=ym(nowStr()),thisM=D.bellLog.filter(l=>ym(l.date)===m);
  const freq={};D.bellLog.forEach(l=>{if(l.alarm)freq[l.alarm]=(freq[l.alarm]||0)+1;});
  const top=Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
  // 最近 6 個月
  const months=[];{const d=new Date();d.setDate(1);for(let i=5;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);months.push(`${x.getFullYear()}-${pad(x.getMonth()+1)}`);}}
  const keys=[...D.alarms.map(a=>a.id),"none"];
  const data=months.map(mm=>{const o={};D.bellLog.filter(l=>ym(l.date)===mm).forEach(l=>{const k=l.alarm||"none";o[k]=(o[k]||0)+1;});return o;});
  const maxV=Math.max(4,...data.map(o=>Object.values(o).reduce((a,b)=>a+b,0)));
  const W=600,H=220,pl=30,pb=26,bw=(W-pl-10)/6*.56;
  let bars="";data.forEach((o,i)=>{let y=H-pb;const x=pl+(i+.5)*(W-pl-10)/6-bw/2;keys.forEach(k=>{const v=o[k]||0;if(!v)return;const h=v/maxV*(H-pb-14);y-=h;bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${k==="none"?"#D8D0C2":alarmColor(k)}"><title>${months[i]}・${k==="none"?"沒選警報":esc(alarmById(k).name)}：${v} 次</title></rect>`;});
    bars+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="#857A6D">${+months[i].slice(5)} 月</text>`;});
  let grid="";for(let v=0;v<=maxV;v+=Math.ceil(maxV/4)){const y=H-pb-v/maxV*(H-pb-14);grid+=`<line x1="${pl}" x2="${W-10}" y1="${y}" y2="${y}" stroke="#E9E2D6"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#857A6D">${v}</text>`;}
  const recs=D.recordings.slice().sort((a,b)=>a.month<b.month?1:-1);
  $("#app").innerHTML=`<section><h2>證據</h2><div class="nums">
    <div class="card num"><b>${thisM.length}</b><span>這個月鈴響</span></div>
    <div class="card num"><b>${top?esc(alarmById(top[0])?.name||"—"):"—"}</b><span>最常響的警報</span></div>
    <div class="card num"><b>${D.recordings.length}</b><span>錄音</span></div></div></section>
  <section><h2>鈴響趨勢<small></small></h2><div class="card chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="最近六個月每月鈴響次數">${grid}${bars}</svg>
    <div class="leg">${D.alarms.map(a=>`<span><i style="background:${alarmColor(a.id)}"></i>${esc(a.name)}</span>`).join("")}<span><i style="background:#D8D0C2"></i>沒選警報</span></div></div></section>
  <section><h2>每月錄音牆</h2><div class="card recs">
    <div class="row" style="justify-content:space-between"><span class="muted" style="font-size:13.5px">同一首歌每個月錄一次，聽聽自己的變化。</span><span class="row"><button class="btn sm" id="playAll" ${recs.length?"":"disabled"}>從最早連續播放</button><label class="btn sm pri" style="display:inline-flex;align-items:center">加這個月的錄音<input type="file" id="recIn" accept="audio/*" hidden></label></span></div>
    ${recs.length?recs.map(r=>`<div class="rec"><span class="m">${esc(r.month)}</span><span>${esc(r.song||"（沒寫歌名）")}</span><span class="row"><button class="btn sm" data-play="${esc(r.file)}">播放</button><button class="x" data-delr="${esc(r.file)}" aria-label="刪除">×</button></span></div>`).join(""):`<div class="empty" style="padding:6px 0">還沒有錄音。錄一首歌，按「加這個月的錄音」。</div>`}
    <audio id="player" controls hidden style="width:100%"></audio></div></section>
  <section><h2>拆解紀錄</h2>${breakdownList()}</section>`;
  bindBList();
  const player=$("#player");let queue=[];
  const play=async r=>{const b=await recBlob(r);if(!b){player.hidden=true;return dialog(`<h3>找不到這個錄音</h3><p class="muted" style="margin:0">這台裝置上沒有，OneDrive 也還沒登入或沒有這個檔案。</p><div class="row"><button class="btn pri" data-x>好</button></div>`);}
    if(player.dataset.url)URL.revokeObjectURL(player.dataset.url);player.dataset.url=URL.createObjectURL(b);player.src=player.dataset.url;player.hidden=false;player.play().catch(()=>{});};
  player.onended=()=>{if(queue.length)play(queue.shift());};
  document.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>{queue=[];play(D.recordings.find(r=>r.file===b.dataset.play));});
  const pa=$("#playAll");if(pa)pa.onclick=()=>{queue=D.recordings.slice().sort((a,b)=>a.month<b.month?-1:1);play(queue.shift());};
  document.querySelectorAll("[data-delr]").forEach(b=>b.onclick=()=>dialog(`<h3>刪除這個月的錄音？</h3><p class="muted" style="margin:0">只會從這裡拿掉；OneDrive 裡的檔案會留著。</p><div class="row"><button class="btn pri" data-ok>刪除</button><button class="btn ghost" data-x>取消</button></div>`,
    box=>box.querySelector("[data-ok]").onclick=()=>{D.recordings=D.recordings.filter(r=>r.file!==b.dataset.delr);idb.del(b.dataset.delr).catch(()=>{});save();closeDlg();renderProof();}));
  $("#recIn").onchange=e=>{const f=e.target.files[0];if(!f)return;const mm=ym(nowStr());
    dialog(`<h3>${mm} 的錄音</h3><label class="field">歌名<input type="text" id="song" maxlength="40" value="${esc((D.recordings.find(r=>r.month===mm)||D.recordings[D.recordings.length-1]||{}).song||"")}"></label><p class="muted" style="margin:0;font-size:13px">檔案會存在這台裝置；登入 OneDrive 時也會放進「使命板/recordings」資料夾。</p><div class="row"><button class="btn pri" data-ok>存好</button><button class="btn ghost" data-x>取消</button></div>`,
    box=>box.querySelector("[data-ok]").onclick=async()=>{const ext=(f.name.match(/\.[a-z0-9]+$/i)||[".m4a"])[0].toLowerCase(),file=mm+ext;
      try{await idb.put(file,f);}catch(err){}
      D.recordings=D.recordings.filter(r=>r.month!==mm);D.recordings.push({month:mm,song:box.querySelector("#song").value.trim(),file});save();closeDlg();renderProof();
      try{if(window.OriginaSync&&await OriginaSync.getToken())await OriginaSync.api.putBlob("Mission/recordings/"+file,f);}catch(err){}});};}

renderTabs();muteLabel();render();
</script>
</body></html>
