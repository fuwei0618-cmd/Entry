<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#111">
<title>拍照教練</title>
<style>
:root{--ink:#fff;--glass:rgba(20,18,16,.55);--gold:#E8C46A;--ok:#7FE0A0;--line:rgba(255,255,255,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#111;color:var(--ink);font-family:"PingFang TC","Noto Sans TC",system-ui,sans-serif;overflow:hidden}
#v{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#v.mirror{transform:scaleX(-1)}
#tpl{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;opacity:.35;display:none}
#ov{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#grid{position:fixed;inset:0;pointer-events:none;display:none;background:
 linear-gradient(to right,transparent 33.2%,var(--line) 33.3%,var(--line) 33.5%,transparent 33.6%,transparent 66.5%,var(--line) 66.6%,var(--line) 66.8%,transparent 66.9%),
 linear-gradient(to bottom,transparent 33.2%,var(--line) 33.3%,var(--line) 33.5%,transparent 33.6%,transparent 66.5%,var(--line) 66.6%,var(--line) 66.8%,transparent 66.9%)}
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.top::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--glass);color:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip.on{background:#fff;color:#111;border-color:#fff}
#status{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 60px);display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-width:calc(100% - 80px)}
#status span{background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:6px 12px;font-size:13px}
#score{font-weight:700;font-size:15px!important}
#score.good{background:rgba(40,120,70,.75)!important}
#hint{font-size:15px!important;display:none}
#tip{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 178px);text-align:center;pointer-events:none}
#tip span{display:inline-block;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:16px;padding:10px 16px;font-size:17px;line-height:1.5;transition:opacity .35s;max-width:520px}
#tip small{display:block;font-size:12px;opacity:.7}
.poses{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 104px);display:flex;gap:8px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.poses::-webkit-scrollbar{display:none}
.poses button{flex:none;width:58px;height:66px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:#fff;font:inherit;font-size:11px;display:grid;place-items:center;padding:4px 2px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.poses button.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.poses svg{height:36px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 20px calc(env(safe-area-inset-bottom) + 16px);display:flex;align-items:center;justify-content:space-between}
.round{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:#fff;font:inherit;font-size:12px;display:grid;place-items:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow:hidden;padding:0}
.round img{width:100%;height:100%;object-fit:cover}
#shot{width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.25)}
#shot:active{background:#fff}
.side{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 60px);display:flex;flex-direction:column;gap:8px}
.side .round{width:46px;height:46px;font-size:11px;line-height:1.2;text-align:center}
.side .round.on{border-color:var(--gold);color:var(--gold)}
#count{position:fixed;inset:0;display:none;place-items:center;font-size:120px;font-weight:700;text-shadow:0 2px 20px rgba(0,0,0,.5);pointer-events:none}
#warm{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:22px;text-align:center;background:var(--glass);padding:14px 20px;border-radius:18px;display:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#start{position:fixed;inset:0;display:grid;place-items:center;background:#15120F;padding:24px;text-align:center}
#start h1{font-size:26px;margin:0 0 8px;letter-spacing:.08em}
#start p{color:#C9C0B5;line-height:1.7;font-size:15px;margin:0 0 22px}
#start button{background:#fff;color:#111;border:0;border-radius:999px;padding:14px 28px;font:inherit;font-size:16px;font-weight:600}
#opa{position:fixed;left:24px;right:84px;bottom:calc(env(safe-area-inset-bottom) + 240px);display:none;accent-color:var(--gold)}
#review{position:fixed;inset:0;background:#000;display:none;flex-direction:column}
#review img{flex:1;min-height:0;object-fit:contain;width:100%}
#review .rb{display:flex;gap:10px;justify-content:center;padding:14px 14px calc(env(safe-area-inset-bottom) + 18px)}
#review .rb button{background:var(--glass);border:1px solid var(--line);color:#fff;border-radius:999px;padding:12px 20px;font:inherit;font-size:15px}
#review .rb button.pri{background:#fff;color:#111}
</style></head><body>
<video id="v" playsinline muted autoplay></video>
<img id="tpl" alt="">
<div id="grid"></div>
<canvas id="ov" aria-hidden="true"></canvas>
<div class="top" id="scenes"></div>
<div id="status"><span id="ai">姿勢偵測載入中…</span><span id="score" hidden></span><span id="hint"></span></div>
<input type="range" id="opa" min="10" max="70" value="35" aria-label="模板透明度">
<div class="side">
  <button class="round on" id="bAuto">對到<br>就拍</button>
  <button class="round on" id="bWarm">暖身<br>倒數</button>
  <button class="round" id="bGrid">九宮格</button>
  <button class="round" id="bTpl">我的<br>模板</button>
  <button class="round" id="bFlip">前後<br>鏡頭</button>
</div>
<div id="tip"><span id="tipT"></span></div>
<div class="poses" id="poses"></div>
<div class="bar">
  <button class="round" id="thumb" aria-label="剛拍的照片">相片</button>
  <button id="shot" aria-label="拍照"></button>
  <button class="round" id="bNext" aria-label="下一個提醒">下一句</button>
</div>
<div id="warm"></div><div id="count"></div><div id="flash"></div>
<input type="file" id="file" accept="image/*" hidden>
<div id="review"><img id="rImg" alt="剛拍的照片"><div class="rb"><button id="rBack">繼續拍</button><button id="rSave">存到相簿</button><button class="pri" id="rRec">存到記錄之流</button></div></div>
<div id="start"><div><h1>拍照教練</h1><p>鏡頭會認出你的身體，<br>把姿勢框對齊到你的位置和大小，<br>告訴你哪隻手、哪隻腳再調一點。<br>對到了會自動拍。</p><button id="go">打開相機</button></div></div>

<script type="module">
const $=s=>document.querySelector(s);
const SCENES={
 "隨手":["下巴微微往前、往下一點，脖子會變長","眼睛看鏡頭上方一點點，眼神比較柔","肩膀放鬆往下，不要聳肩","重心放在一隻腳，另一隻腳輕點地","手找事情做：摸頭髮、拉衣角、拿包包"],
 "咖啡廳":["手扶杯子，不要緊握，手指放鬆","坐椅子前三分之一，背打直","看窗外、低頭看飲料都比直視鏡頭自然","身體側 45 度，臉轉回來看鏡頭","拿起杯子到下巴高度，假裝要喝"],
 "戶外花海":["走進花裡，讓前景的花擋到一點畫面","閉眼抬頭感受陽光，不用看鏡頭","手輕碰花，指尖就好","逆光站，頭髮會有一圈光","邊走邊回頭，拍很多張挑一張"],
 "街拍":["走路抓拍：自然往前走，拍的人連拍","過馬路線、轉角都是好位置","靠牆時只靠一邊肩膀，不要整個背貼上去","手插口袋只插一半，比較不僵","低頭看地上再慢慢抬頭"],
 "海邊":["裙擺、頭髮被風吹就是動態","踢水、踩浪讓動作自然","人放在畫面下三分之一，留天空","背對鏡頭看海，也是一種故事","光腳、拎著鞋，畫面更放鬆"],
 "室內民宿":["坐在窗邊，用窗光照臉","抱枕、棉被、書都可以當道具","躺著拍時，手機從上往下","側躺時手臂撐頭，身體拉長","鏡子自拍：手機擋住半張臉也可以"],
 "夜拍":["站到招牌或路燈的光下","停 1 秒不動，夜拍容易糊","手機打光從側面，不要正面","背景的燈越多越好看","眼睛找光源，眼神會亮"]
};
const WARM=["想一件剛剛很好笑的事","輕輕吐一口氣，肩膀放下","嘴巴發「一」的音再放鬆","想像對面是你最喜歡的人"];
/* 姿勢：以「拍出來的照片」看到的樣子定義（畫面左邊是你的右手）。座標 100×200 */
const POSES={
 "重心一腳":{n:[50,22],rs:[34,38],ls:[66,38],re:[28,62],le:[70,62],rw:[38,80],lw:[62,82],rh:[43,92],lh:[57,92],rk:[46,140],lk:[50,140],ra:[48,190],la:[40,186]},
 "手扶腰":{n:[50,22],rs:[34,38],ls:[66,38],re:[22,60],le:[72,62],rw:[38,76],lw:[74,88],rh:[43,92],lh:[57,92],rk:[44,140],lk:[58,140],ra:[42,190],la:[62,190]},
 "撥頭髮":{n:[50,22],rs:[34,38],ls:[66,38],re:[24,24],le:[70,62],rw:[40,14],lw:[66,84],rh:[43,92],lh:[57,92],rk:[48,140],lk:[52,140],ra:[50,190],la:[42,188]},
 "雙手舉高":{n:[50,24],rs:[36,40],ls:[64,40],re:[26,22],le:[74,22],rw:[20,4],lw:[80,4],rh:[44,94],lh:[56,94],rk:[45,142],lk:[55,142],ra:[44,192],la:[56,192]},
 "走路":{n:[50,22],rs:[36,38],ls:[64,38],re:[26,62],le:[72,60],rw:[28,84],lw:[80,78],rh:[45,92],lh:[59,92],rk:[38,140],lk:[62,140],ra:[28,184],la:[66,190]},
 "側身回頭":{n:[58,22],rs:[44,38],ls:[60,37],re:[40,64],le:[62,64],rw:[46,86],lw:[58,84],rh:[46,94],lh:[56,94],rk:[46,142],lk:[60,140],ra:[44,190],la:[64,188]},
 "坐姿":{n:[50,40],rs:[34,58],ls:[66,58],re:[30,82],le:[70,82],rw:[46,102],lw:[56,104],rh:[44,110],lh:[56,110],rk:[40,142],lk:[60,142],ra:[40,182],la:[60,182]},
 "不用框":null
};
const IDX={n:0,ls:11,rs:12,le:13,re:14,lw:15,rw:16,lh:23,rh:24,lk:25,rk:26,la:27,ra:28};
const LIMBS=[["rs","re","右手臂"],["re","rw","右手"],["ls","le","左手臂"],["le","lw","左手"],["rh","rk","右大腿"],["rk","ra","右小腿"],["lh","lk","左大腿"],["lk","la","左小腿"]];
const BONES=[["rs","ls"],["rh","lh"],["rs","rh"],["ls","lh"],...LIMBS.map(l=>[l[0],l[1]])];
let scene="隨手",pose="重心一腳",tipI=0,tipTimer,facing="user",stream,warmOn=true,autoOn=true,lastBlob=null,landmarker=null,busy=false,goodSince=0,lastShot=0;
const cv=$("#ov"),g=cv.getContext("2d"),V=$("#v");

function chips(){
 $("#scenes").innerHTML=Object.keys(SCENES).map(k=>`<button class="chip${k===scene?" on":""}" data-s="${k}">${k}</button>`).join("");
 $("#poses").innerHTML=Object.keys(POSES).map(k=>{const p=POSES[k];
  return `<button class="${k===pose?"on":""}" data-p="${k}">${p?`<svg viewBox="0 0 100 200"><circle cx="${p.n[0]}" cy="${p.n[1]}" r="11" fill="none" stroke="#fff" stroke-width="7"/><path d="${BONES.map(([a,b])=>`M${p[a]} L${p[b]}`).join(" ")} M${(p.rs[0]+p.ls[0])/2} ${(p.rs[1]+p.ls[1])/2} L${p.n}" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/></svg>`:"<b style='font-size:20px'>×</b>"}${k}</button>`;}).join("");
}
function showTip(next){const L=SCENES[scene];if(next)tipI=(tipI+1)%L.length;const t=$("#tipT");t.style.opacity=0;
 setTimeout(()=>{t.innerHTML=`<small>${scene}・${tipI+1}/${L.length}</small>${L[tipI]}`;t.style.opacity=1;},200);
 clearInterval(tipTimer);tipTimer=setInterval(()=>showTip(true),5000);}
$("#scenes").onclick=e=>{const b=e.target.closest("[data-s]");if(!b)return;scene=b.dataset.s;tipI=0;chips();showTip();};
$("#poses").onclick=e=>{const b=e.target.closest("[data-p]");if(!b)return;pose=b.dataset.p;goodSince=0;chips();};
$("#bNext").onclick=()=>showTip(true);
$("#bGrid").onclick=e=>{const gr=$("#grid"),on=gr.style.display!=="block";gr.style.display=on?"block":"none";e.currentTarget.classList.toggle("on",on);};
$("#bWarm").onclick=e=>{warmOn=!warmOn;e.currentTarget.classList.toggle("on",warmOn);};
$("#bAuto").onclick=e=>{autoOn=!autoOn;e.currentTarget.classList.toggle("on",autoOn);};
$("#bTpl").onclick=()=>{if($("#tpl").style.display==="block"){$("#tpl").style.display="none";$("#opa").style.display="none";$("#bTpl").classList.remove("on");}else $("#file").click();};
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;$("#tpl").src=URL.createObjectURL(f);$("#tpl").style.display="block";$("#opa").style.display="block";$("#bTpl").classList.add("on");e.target.value="";};
$("#opa").oninput=e=>$("#tpl").style.opacity=e.target.value/100;

async function cam(){
 try{if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
  V.srcObject=stream;V.classList.toggle("mirror",facing==="user");await V.play();
 }catch(e){$("#start").style.display="grid";$("#start p").innerHTML="打不開相機。<br>請在 iPhone「設定 → Safari → 相機」選「允許」，<br>或用 Safari 打開這個網址再試一次。";}
}
$("#bFlip").onclick=()=>{facing=facing==="user"?"environment":"user";cam();};

/* 人體姿勢偵測：Google MediaPipe，在手機上直接跑，不上傳照片 */
const MP="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
async function loadAI(){
 try{const {PoseLandmarker,FilesetResolver}=await import(MP+"/vision_bundle.mjs");
  const fs=await FilesetResolver.forVisionTasks(MP+"/wasm");
  const opt=d=>({baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:d},runningMode:"VIDEO",numPoses:1});
  try{landmarker=await PoseLandmarker.createFromOptions(fs,opt("GPU"));}catch(e){landmarker=await PoseLandmarker.createFromOptions(fs,opt("CPU"));}
  $("#ai").textContent="站進畫面，讓全身入鏡";
 }catch(e){$("#ai").textContent="姿勢偵測載入失敗，先用固定線框";}
}

/* 影像座標 → 螢幕座標（object-fit:cover，前鏡頭左右鏡像） */
function mapper(){const W=innerWidth,H=innerHeight,vw=V.videoWidth||W,vh=V.videoHeight||H,s=Math.max(W/vw,H/vh),ox=(W-vw*s)/2,oy=(H-vh*s)/2,m=facing==="user";
 return (x,y)=>{let X=ox+x*vw*s,Y=oy+y*vh*s;if(m)X=W-X;return[X,Y];};}
const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
const ang=(a,b)=>Math.atan2(b[1]-a[1],b[0]-a[0]);
function angDiff(a,b){let d=Math.abs(a-b)%(2*Math.PI);return d>Math.PI?2*Math.PI-d:d;}

function frame(){
 requestAnimationFrame(frame);
 const W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio,2);
 if(cv.width!==W*dpr){cv.width=W*dpr;cv.height=H*dpr;}
 g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
 const T=POSES[pose];let me=null;
 if(landmarker&&V.readyState>=2&&!busy){
  try{const r=landmarker.detectForVideo(V,performance.now());const L=r.landmarks&&r.landmarks[0];
   if(L){const M=mapper();me={};for(const k in IDX){const p=L[IDX[k]];me[k]=M(p.x,p.y);me[k].v=p.visibility??1;}}}catch(e){}
 }
 // 自己的骨架（細線）
 if(me){g.strokeStyle="rgba(255,255,255,.55)";g.lineWidth=2;g.beginPath();BONES.forEach(([a,b])=>{if(me[a].v>.4&&me[b].v>.4){g.moveTo(...me[a]);g.lineTo(...me[b]);}});g.stroke();
  g.fillStyle="#fff";for(const k in me)if(me[k].v>.4){g.beginPath();g.arc(me[k][0],me[k][1],3,0,7);g.fill();}}
 if(!T){$("#score").hidden=true;$("#hint").style.display="none";return;}
 // 目標姿勢：照片空間；螢幕上如果是前鏡頭就左右翻，跟鏡子一樣
 const flip=facing==="user";
 const tp={};for(const k in T)tp[k]=[flip?100-T[k][0]:T[k][0],T[k][1]];
 // 對齊：骨盆中心對到你的骨盆中心，比例用軀幹長度
 let s,ox,oy;const tH=mid(tp.rh,tp.lh),tS=mid(tp.rs,tp.ls),tLen=Math.hypot(tS[0]-tH[0],tS[1]-tH[1]);
 const shouldersOk=me&&me.rs.v>.5&&me.ls.v>.5&&me.rh.v>.5&&me.lh.v>.5;
 if(shouldersOk){const mH=mid(me.rh,me.lh),mS=mid(me.rs,me.ls);s=Math.hypot(mS[0]-mH[0],mS[1]-mH[1])/tLen;ox=mH[0]-tH[0]*s;oy=mH[1]-tH[1]*s;}
 else{s=H*.62/200;ox=W/2-50*s;oy=H*.16;}
 const P={};for(const k in tp)P[k]=[ox+tp[k][0]*s,oy+tp[k][1]*s];
 // 比對每一節手腳的方向
 let sum=0,n=0,worst=null;const ok={};
 if(shouldersOk){LIMBS.forEach(([a,b,name])=>{if(me[a].v<.5||me[b].v<.5)return;const d=angDiff(ang(P[a],P[b]),ang(me[a],me[b]));const sim=Math.max(0,1-d/(Math.PI/3));sum+=sim;n++;ok[a+b]=d<.35;
   if(!worst||d>worst.d)worst={d,name,dx:P[b][0]-me[b][0],dy:P[b][1]-me[b][1]};});}
 // 畫目標框
 g.lineCap="round";g.lineJoin="round";
 const r0=11*s;g.lineWidth=Math.min(7,Math.max(3,2.2*s));g.strokeStyle="rgba(232,196,106,.9)";g.beginPath();g.arc(P.n[0],P.n[1],r0,0,7);g.stroke();
 BONES.forEach(([a,b])=>{g.strokeStyle=ok[a+b]?"rgba(127,224,160,.95)":"rgba(232,196,106,.85)";g.setLineDash(ok[a+b]?[]:[10,8]);g.beginPath();g.moveTo(...P[a]);g.lineTo(...P[b]);g.stroke();});
 g.setLineDash([]);g.strokeStyle="rgba(232,196,106,.85)";g.beginPath();g.moveTo(...mid(P.rs,P.ls));g.lineTo(P.n[0],P.n[1]+r0);g.stroke();
 // 分數與提示
 const sc=$("#score"),hi=$("#hint"),ai=$("#ai");
 if(!landmarker){sc.hidden=true;hi.style.display="none";return;}
 if(!me){ai.textContent="還沒看到你，站進畫面";sc.hidden=true;hi.style.display="none";goodSince=0;return;}
 const legsNeeded=me.ra.v<.5&&me.la.v<.5;
 ai.textContent=legsNeeded?"往後退一點，讓腳也入鏡":"偵測到你了";
 if(!n){sc.hidden=true;return;}
 const pct=Math.round(sum/n*100);sc.hidden=false;sc.textContent=`吻合 ${pct}%`;sc.classList.toggle("good",pct>=85);
 if(pct>=85){hi.style.display="block";hi.textContent="很好，就是這樣！保持";if(!goodSince)goodSince=performance.now();
  if(autoOn&&!busy&&performance.now()-goodSince>900&&performance.now()-lastShot>4000)shoot(true);}
 else{goodSince=0;if(worst){const big=Math.abs(worst.dy)>Math.abs(worst.dx);const dir=big?(worst.dy<0?"抬高一點":"放低一點"):(worst.dx<0?"往左一點":"往右一點");hi.style.display="block";hi.textContent=`${worst.name}${dir}`;}}
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function shoot(auto){
 if(busy)return;busy=true;
 try{
  if(warmOn&&!auto){const w=$("#warm");w.textContent=WARM[Math.floor(Math.random()*WARM.length)];w.style.display="block";await sleep(1600);w.style.display="none";}
  const c=$("#count");c.style.display="grid";for(const n of (auto?[2,1]:warmOn?[3,2,1]:[])){c.textContent=n;await sleep(700);}c.style.display="none";
  if(!V.videoWidth)return;
  const k=document.createElement("canvas");k.width=V.videoWidth;k.height=V.videoHeight;const x=k.getContext("2d");
  if(facing==="user"){x.translate(k.width,0);x.scale(-1,1);}x.drawImage(V,0,0);
  const f=$("#flash");f.style.opacity=.8;setTimeout(()=>f.style.opacity=0,120);
  await new Promise(res=>k.toBlob(b=>{lastBlob=b;const u=URL.createObjectURL(b);$("#thumb").innerHTML=`<img src="${u}" alt="">`;$("#rImg").src=u;res();},"image/jpeg",.92));
  lastShot=performance.now();goodSince=0;
 }finally{busy=false;}
}
$("#shot").onclick=()=>shoot(false);
$("#thumb").onclick=()=>{if(lastBlob)$("#review").style.display="flex";};
$("#rBack").onclick=()=>$("#review").style.display="none";
/* 存到記錄之流：放進同網站共用的 IndexedDB「origina-inbox」，記錄之流打開時會自動收成一則照片紀錄 */
function inbox(){return new Promise((ok,no)=>{const r=indexedDB.open("origina-inbox",1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains("photos"))db.createObjectStore("photos",{keyPath:"id"});};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});}
$("#rRec").onclick=async()=>{if(!lastBlob)return;try{const db=await inbox();await new Promise((ok,no)=>{const t=db.transaction("photos","readwrite");t.objectStore("photos").put({id:"p"+Date.now(),blob:lastBlob,takenAt:new Date().toISOString(),scene,pose,source:"coach"});t.oncomplete=ok;t.onerror=()=>no(t.error);});
  const b=$("#rRec");b.textContent="已存 ✓";setTimeout(()=>b.textContent="存到記錄之流",1500);
  const ret=new URLSearchParams(location.search).get("return");if(ret&&/^https:\/\/fuwei0618-cmd\.github\.io\//.test(ret))setTimeout(()=>location.href=ret,600);
 }catch(e){alert("存不進去："+e.message);}};
$("#rSave").onclick=async()=>{if(!lastBlob)return;const file=new File([lastBlob],"photo-"+Date.now()+".jpg",{type:"image/jpeg"});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return;}catch(e){if(e.name==="AbortError")return;}}
 const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;a.click();};
$("#go").onclick=async()=>{$("#start").style.display="none";chips();showTip();loadAI();await cam();requestAnimationFrame(frame);};
</script>
