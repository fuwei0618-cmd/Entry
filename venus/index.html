button{font:inherit;cursor:pointer}
.serif{font-family:"Songti TC","Noto Serif TC",serif;font-weight:700}
.hot{position:absolute;border:0;background:none;padding:0;display:flex;align-items:center;gap:8px;transform:translate(0,-50%)}
.hot.L{flex-direction:row-reverse;transform:translate(-100%,-50%)}
.hot .b{width:52px;height:52px;border-radius:50%;background:#FFFAF4;border:2px solid #B98F66;display:grid;place-items:center;box-shadow:0 3px 10px rgba(40,20,10,.22);transition:transform .2s}
.hot .w{background:rgba(255,250,244,.93);border-radius:999px;padding:5px 14px;font:700 17px "Songti TC","Noto Serif TC",serif;color:#3A2A24;box-shadow:0 2px 6px rgba(40,20,10,.15)}
.hot.on .b{background:#3A2A24;border-color:#E2B867;transform:scale(1.1)}
.hot.on .w{background:#3A2A24;color:#FFE7C2}
.hot.dim{opacity:.45}
.left{position:absolute;left:60px;top:150px;width:330px;color:#3A2A24}
.f{display:flex;align-items:baseline;gap:8px;font:700 30px "Songti TC","Noto Serif TC",serif;letter-spacing:.06em}
.f small{font-size:15px;color:#8A6E4B;font-weight:400}
.g{margin-top:18px;display:grid;gap:10px;font-size:14px;line-height:1.7;color:#5A4228}
.g b{color:#3A2A24}
.panel{position:absolute;left:1030px;top:40px;width:620px;bottom:90px;display:flex;flex-direction:column;gap:12px}
.ph{display:flex;align-items:center;gap:12px}
.ph .t{font:700 34px "Songti TC","Noto Serif TC",serif;color:#3A2A24}

.grid{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:stretch}

.ax.v{writing-mode:vertical-rl;padding:0 4px}
.cell{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:150px;position:relative}
.cell.yn{background:rgba(255,250,244,.85);border:2px dashed #9A5444}
.cell.yt{background:rgba(255,250,244,.85);border:2px solid #9A5444}
.cell.xn{background:rgba(255,250,244,.85);border:2px dashed #B5894F}
.cell.xt{background:rgba(255,250,244,.85);border:2px solid #B5894F}
.cell .h{display:flex;align-items:center;gap:6px;font-size:13px;color:#8A6E4B;letter-spacing:.1em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #E2D3C2;background:#fff;border-radius:999px;padding:5px 12px;font-size:15px;color:#3A2A24}
.chip.on{background:#3A2A24;color:#FFE7C2;border-color:#3A2A24}
.cell .go{margin-top:auto;align-self:flex-start;font-size:13px;color:#7A5A40;text-decoration:none;border-bottom:1px solid #CDB8A4}
.empty{color:#B0A090;font-size:14px}
.soft{font-size:14px;color:#5A4228;background:rgba(244,235,223,.9);border-radius:12px;padding:8px 12px}.soft b{color:#8E2B2B;margin-right:6px}
.note{font-size:13px;color:#8A6E4B}
textarea{font:inherit;font-size:15px;min-height:70px;border-radius:12px;border:1px solid #E2D3C2;padding:10px 12px;background:#fff;resize:vertical}
.chk{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid #EADCCB;background:#fff;color:#2E2420;text-align:left;width:100%;font-size:14px}
.chk.on{border-color:#C98E80;background:#F7ECE4;color:#7A5A48;text-decoration:line-through}
.chk i{width:17px;height:17px;border-radius:5px;border:2px solid #C9B6A4;flex-shrink:0}
.chk.on i{background:#8E2B2B;border-color:#8E2B2B}
.chk em{margin-left:auto;font-style:normal;font-size:11px;color:#8A6E4B;background:#F3EADF;border-radius:999px;padding:1px 8px;text-decoration:none}
.lnk{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid #CDB8A4;background:#fff;color:#3A2A24;text-decoration:none;font-size:14px}
.fbtn{border:0;border-radius:999px;padding:8px 16px;font-size:13px}
.strip{position:absolute;left:60px;bottom:30px;border-radius:999px;background:rgba(40,28,22,.86);color:#FFF6EC;padding:9px 20px;display:flex;gap:16px;white-space:nowrap;font-size:13px}
.back{position:fixed;left:14px;top:calc(env(safe-area-inset-top) + 12px);z-index:5;border:1px solid rgba(244,238,230,.3);background:rgba(28,24,20,.72);color:#F4EEE6;border-radius:999px;padding:8px 14px;font-size:13px}
@keyframes beat{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 3.2s ease-in-out infinite}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.panel.anim>*{animation:pop .3s ease-out both}
@media (prefers-reduced-motion:reduce){.beat,.panel>*{animation:none}}

const today=()=>new Date().toLocaleDateString("sv");
function period(p){const d=new Date();const y=d.getFullYear(),m=d.getMonth()+1;
  if(p==="每天")return today();
  if(p==="每週"){const t=new Date(d);t.setDate(d.getDate()-((d.getDay()+6)%7));return "W"+t.toLocaleDateString("sv");}
  if(p==="每月")return y+"-"+m;return y+"-Q"+Math.ceil(m/3);}
