<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>富偉・金庫願景</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
:root{--bg:#F3EFE6;--card:#FBF8F2;--ink:#2F2A22;--muted:#857B6C;--line:#E4DCCB;--gold:#B8913E;--gold2:#EAD9AE;--soft:#EEE7D8;--ok:#5E8A5A;
  --serif:"Noto Serif TC","Songti TC",serif;--f:"PingFang TC","Noto Sans TC",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C1A16;--card:#25221D;--ink:#EDE6D8;--muted:#A89E8C;--line:#3A352C;--gold:#D6B261;--gold2:#4A3F27;--soft:#2E2A23;--ok:#8DB889}}
:root[data-theme="dark"]{--bg:#1C1A16;--card:#25221D;--ink:#EDE6D8;--muted:#A89E8C;--line:#3A352C;--gold:#D6B261;--gold2:#4A3F27;--soft:#2E2A23;--ok:#8DB889}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);line-height:1.6}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom));display:grid;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{margin:0;font-family:var(--serif);font-size:20px;letter-spacing:.14em}
.lk{border:0;background:none;padding:0;color:var(--gold);font-size:13px;text-decoration:none;cursor:pointer}
.stat{font-size:12.5px;color:var(--muted)}
.vt{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px 10px;font-size:15px;line-height:1.55;resize:vertical;min-width:0}.vt.sm{padding:6px 10px;font-size:14px}
/* 故事 */
.story{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.story>summary{list-style:none;cursor:pointer;display:grid;gap:2px}.story>summary::-webkit-details-marker{display:none}
.eb{font-size:11px;letter-spacing:.2em;color:var(--gold);font-weight:700}
.story>summary b{font-family:var(--serif);font-size:17px;font-weight:700}
.steps{display:grid;gap:0;margin-top:10px}
.st{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.st i{font-style:normal;font-size:20px;text-align:center;line-height:1.4}
.st b{font-family:var(--serif);font-size:15px}.st p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.st.end p{color:var(--ink)}
/* 出發前讀這段 */
.vnote{background:linear-gradient(135deg,var(--card),var(--gold2));border-radius:14px;padding:12px 14px}
.vnote summary{list-style:none;cursor:pointer;display:grid;gap:2px}.vnote summary::-webkit-details-marker{display:none}
.vnote p{margin:0;font-family:var(--serif);font-size:16px;line-height:1.6}.vnote .vt{margin-top:8px}
/* 摺疊清單 */
.vlist{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.vs{border-top:1px solid var(--line)}.vs:first-child{border-top:0}
.vs>summary{display:flex;align-items:baseline;gap:10px;padding:12px 14px;cursor:pointer;list-style:none}.vs>summary::-webkit-details-marker{display:none}
.vs>summary::before{content:'›';color:var(--muted);transition:transform .15s;display:inline-block}.vs[open]>summary::before{transform:rotate(90deg)}
.vs>summary b{font-size:15px;white-space:nowrap}.pv{margin-left:auto;color:var(--muted);font-size:13px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.pv i{font-style:normal;opacity:.7}
.vb{display:grid;gap:8px;padding:0 14px 14px}
.hint{font-size:13px;color:var(--muted);margin:0;line-height:1.6}
.rf{border-top:1px dashed var(--line);padding:6px 0}.rf>summary{display:flex;gap:8px;align-items:baseline;cursor:pointer;list-style:none;font-size:14px;line-height:1.5}.rf>summary::-webkit-details-marker{display:none}
.rf>summary span{flex:1}.rf>summary em{font-style:normal;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:0 7px;white-space:nowrap}.rf>summary em.ok{color:var(--ok);border-color:var(--ok)}
.rf[open]{display:grid;gap:6px;padding-bottom:10px}
.vrow{display:flex;gap:8px;align-items:center;justify-content:space-between}.vrow .vt{flex:1}
.btn{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:5px 14px;font-size:13px;white-space:nowrap}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:3px 11px;font-size:13px}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:4px 6px}
.win{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:2px 0;font-size:14px}.win span:nth-child(2){flex:1}
/* 需求之樹 */
.need{border-top:1px dashed var(--line);padding:6px 0}
.need>summary{display:flex;gap:10px;align-items:baseline;cursor:pointer;list-style:none}.need>summary::-webkit-details-marker{display:none}
.need>summary i{font-style:normal;width:24px;text-align:center}
.need>summary b{font-size:14.5px}.need>summary small{color:var(--muted);font-size:12px;flex:1}.need>summary em{font-style:normal;font-size:12px;color:var(--gold)}
.need[open]{display:grid;gap:6px;padding-bottom:10px}
.ind{font-size:12.5px;color:var(--muted)}
.ent{display:grid;grid-template-columns:1fr 1fr auto;gap:4px;align-items:center}
.ent .why{grid-column:1/3}
.foot{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;padding:6px 0}

/* 一目了然版 */
.vg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px 12px;display:grid;gap:2px}
.vnote2{background:linear-gradient(135deg,var(--card),var(--gold2))}
.vl{font-size:11.5px;letter-spacing:.12em;color:var(--gold);font-weight:700;margin-top:6px;display:flex;align-items:center;gap:8px}.vl:first-child{margin-top:0}
.vl em{font-style:normal;color:var(--muted);font-weight:500;letter-spacing:0}.plus{font-size:16px;line-height:1}
.bl{width:100%;border:0;border-bottom:1px dashed transparent;background:none;color:var(--ink);padding:2px 0;font-size:15px;line-height:1.55;resize:none;overflow:hidden;outline:none;min-width:0}
.bl:focus{border-bottom-color:var(--gold)}.bl::placeholder{color:var(--muted);opacity:.8}
.bl.serif{font-family:var(--serif);font-size:16.5px}
.bl.box{border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;flex:1;width:auto}
.blist .bl{padding-left:14px;background:radial-gradient(circle at 4px 50%,var(--gold) 2.5px,transparent 3px) no-repeat}
.story4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.story4>div{display:grid;gap:1px;align-content:start}.story4 i{font-style:normal;font-size:18px}.story4 b{font-family:var(--serif);font-size:14px}.story4 p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}.story4 .end p{color:var(--ink)}
@media (max-width:520px){.story4{grid-template-columns:1fr 1fr}}
.need2{border-top:1px dashed var(--line);padding:4px 0}
.nh{display:flex;align-items:baseline;gap:8px}.nh i{font-style:normal;width:22px;text-align:center}.nh b{font-size:14.5px;white-space:nowrap}.nh small{flex:1;color:var(--muted);font-size:12px}
.ent2{margin:2px 0 4px 30px;padding-left:8px;border-left:2px solid var(--gold2)}
.er{display:flex;gap:6px;align-items:center}.bl.b{font-weight:600;font-size:14px}.bl.c{font-size:13px;color:var(--muted)}.bl.w{font-size:13.5px}
.rf2{border-top:1px dashed var(--line);padding:4px 0 2px}.rf2:first-of-type{border-top:0}
.rfh{display:flex;align-items:center;gap:6px}.rfh .lk{font-size:12px;white-space:nowrap}
.bl.q{font-size:13.5px;color:var(--muted);font-weight:600}.bl.a{padding-left:16px;background:linear-gradient(var(--gold),var(--gold)) no-repeat 3px 6px/2px 1.1em}
.vg .vrow{display:flex;gap:8px;margin-top:4px}
.chips{margin-top:6px}
.wins2{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.wins2 .w{display:inline-flex;align-items:center;gap:5px;background:var(--soft);border-radius:99px;padding:2px 4px 2px 10px;font-size:13px}.wins2 small{color:var(--muted)}.wins2 .x{font-size:15px;padding:0 4px}
</style></head><body>
<div class="wrap" id="app"></div>
<script>
const KEY='origina.vault.v1',OPEN='origina.vault.open';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE');
const NEEDS=[
 ['eat','🍚','吃・喝','餐飲、食品、農業、飲料'],
 ['home','🏠','住','營建、家具、家電、房地產'],
 ['move','🚲','行・去遠方','交通、汽車、航空、旅遊'],
 ['beauty','🪞','美','美妝、服飾、保養'],
 ['health','🌿','健康','醫療、藥品、運動'],
 ['love','🤝','愛與連結','通訊、社群、寵物'],
 ['learn','📖','學','教育、出版、工具'],
 ['play','🎵','玩與故事','音樂、影視、遊戲'],
 ['safe','🛡️','安心','金融、保險']];
const TPL={
 '我沒什麼錢，談投資太早了':'投資最早的樣子，是把一顆種子留下來不吃。一百塊也是種子；先學會看，錢會慢慢跟上。',
 '投資好可怕，會賠光':'怕是因為不懂。從我每天在用、在排隊的東西開始看，就不是在賭陌生的東西。而且永遠只放賠了也睡得著的錢。',
 '我看不懂產業、看不懂財報':'產業就是人的需求。先問：為什麼有人排隊？十年後大家還需要它嗎？財報是之後才學的工具。',
 '想要很多錢好像很俗氣':'錢是被存起來的謝謝。想要很多錢，就是想被很多人需要，也想有餘力去謝謝別人。',
 '沒錢，所以夢想只能先放著':'夢想也需要金庫。唱歌、旅行、老宅都寫進金庫，每個月替它們放一點，夢想就不是放著，是在存。',
 '我總是存不住錢':'先付錢給自己：薪水一進來，先轉一筆進金庫，剩下的才是能花的。'};
const NOTE='錢是被存起來的謝謝。今天花的每一塊，都在謝謝某個人；今天存的每一塊，是在謝謝未來的自己。';
function load(){let v;try{v=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){v={}}
  v.at80=v.at80||'';v.why=v.why||'';v.note=v.note||'';v.become=v.become&&v.become.length?v.become:['','',''];
  v.reframes=v.reframes||Object.keys(TPL).map(q=>({q,a:''}));v.wins=v.wins||[];v.needs=v.needs||{};return v;}
function save(v){localStorage.setItem(KEY,JSON.stringify(v));}
const open=new Set((()=>{try{return JSON.parse(localStorage.getItem(OPEN)||'[]')}catch(e){return[]}})());
const isO=k=>open.has(k)?' open':'';
const sec=(k,t,pv,body)=>`<details class="vs" data-vk="${k}"${isO(k)}><summary><b>${t}</b><span class="pv">${pv}</span></summary><div class="vb">${body}</div></details>`;
const cut=(t,n=22)=>t?esc(t.length>n?t.slice(0,n)+'…':t):'<i>還沒寫</i>';
function render(){const v=load(),ans=v.reframes.filter(r=>r.a).length;
  const nEnt=Object.values(v.needs).reduce((a,l)=>a+l.length,0);
  const ta=(k,val,ph,cls='')=>`<textarea class="bl ${cls}" data-v="${k}" rows="1" placeholder="${esc(ph)}">${esc(val)}</textarea>`;
  document.getElementById('app').innerHTML=`
  <div class="top"><a class="lk" id="back" href="../?go=forest,vault" target="_top">← 金庫</a><h1>富偉</h1><span class="stat">${nEnt} 個看見・${v.wins.length} 個小勝利</span></div>
  <div class="vg"><span class="vl">錢的故事・錢，是被存起來的謝謝</span>
    <div class="story4">
      <div><i>🐟</i><b>以物易物</b><p>我有魚、你有米，交換的那一刻，兩個人都說了謝謝。</p></div>
      <div><i>🐚</i><b>貝殼</b><p>你今天不需要魚，就用一枚貝殼約定：我欠你一個謝謝。</p></div>
      <div><i>🪙</i><b>錢</b><p>被存起來、可以帶著走的謝謝。賺到的每一塊，都是有人在謝謝你。</p></div>
      <div class="end"><i>🌱</i><b>投資</b><p>把存下來的謝謝，交給你相信、正在照顧別人需要的那群人。</p></div>
    </div></div>
  <div class="vg vnote2"><span class="vl">花錢、存錢之前讀這段</span>${ta('note',v.note,'範本：'+NOTE,'serif')}</div>
  <div class="vg"><span class="vl">80 歲的我</span>${ta('at80',v.at80,'範本：80 歲的我不用再為錢緊張。住在自己的房子裡，想唱就唱、想去哪就去哪，還有餘力請朋友吃飯、捐錢給在乎的事。')}
    <span class="vl">我想用錢換到什麼</span>${ta('why',v.why,'範本：我想要的不是數字，是自由：不用看別人臉色選工作，可以養 Lucky、去旅行、繼續唱歌。')}
    <span class="vl">想成為的樣子 <button class="lk plus" data-a="vb-add">＋</button></span>
    <div class="blist">${v.become.map((b,i)=>`<input class="bl" data-vb="${i}" value="${esc(b)}" placeholder="${['每個月先存再花','看得懂我投資的每一家公司在做什麼','有一筆夢想基金，唱歌、旅行都從這裡出'][i]||'再寫一個'}">`).join('')}</div></div>
  <div class="vg"><span class="vl">生活投資學・需求之樹 <em>${nEnt} 個看見</em></span>
    <p class="hint">每一個產業，都是一群人在回答同一個人類需求。你天天在用、會排隊、會推薦給朋友的，記在對應的需求下。這是看世界的方式，不是買賣訊號；真的要投資前，再看財報、問專業的人。</p>
    ${NEEDS.map(([k,ic,n,ind])=>{const L=v.needs[k]||[];return `<div class="need2"><div class="nh"><i>${ic}</i><b>${n}</b><small>${ind}</small><button class="lk plus" data-a="ne-add" data-k="${k}" aria-label="在${n}加一個">＋</button></div>
      ${L.map((e,i)=>`<div class="ent2"><div class="er"><input class="bl b" data-ne="${k}:${i}:b" value="${esc(e.b)}" placeholder="${k==='eat'&&i===0?'例如：天天排隊的那家咖啡':'品牌／店'}"><input class="bl c" data-ne="${k}:${i}:c" value="${esc(e.c)}" placeholder="背後的公司"><button class="x" data-a="ne-del" data-k="${k}" data-i="${i}" aria-label="刪除">×</button></div><input class="bl w" data-ne="${k}:${i}:w" value="${esc(e.w)}" placeholder="我為什麼愛它／為什麼有人排隊"></div>`).join('')}</div>`}).join('')}</div>
  <div class="vg"><span class="vl">腦中的那句話 → 我的回答 <em>${ans}/${v.reframes.length}</em> <button class="lk plus" data-a="rf-add">＋</button></span>
    ${v.reframes.map((r,i)=>`<div class="rf2"><div class="rfh"><input class="bl q" data-rq="${i}" value="${esc(r.q)}" placeholder="腦中的那句話">${!r.a&&TPL[r.q]?`<button class="lk" data-a="tpl" data-i="${i}">用範本</button>`:''}<button class="x" data-a="rf-del" data-i="${i}" aria-label="刪除">×</button></div>
      <textarea class="bl a" data-ra="${i}" rows="1" placeholder="${esc(TPL[r.q]?'範本：'+TPL[r.q]:'我的回答')}">${esc(r.a)}</textarea></div>`).join('')}
    <a class="lk" href="../mission/" target="_top">想拆深一點：去拆解室 →</a></div>
  <div class="vg"><span class="vl">小勝利罐子 <em>${v.wins.length} 顆</em></span>
    <div class="vrow"><input class="bl box" id="w-in" placeholder="今天的小勝利…"><button class="btn pri" data-a="w-add">放進去</button></div>
    <div class="chips">${['記了一天的帳','先轉了一筆進金庫','忍住一次衝動購物','看懂一家公司在做什麼','檢查了一張保單','多賺了一筆'].map(t=>`<button class="chip" data-a="w-q" data-t="${esc(t)}">＋${esc(t)}</button>`).join('')}</div>
    ${v.wins.length?`<div class="wins2">${v.wins.map((w,i)=>[w,i]).reverse().map(([w,i])=>`<span class="w"><small>${esc(w.d.slice(5).replace('-','/'))}</small>${esc(w.t)}<button class="x" data-a="w-del" data-i="${i}" aria-label="刪除">×</button></span>`).join('')}</div>`:''}</div>
  <div class="foot"><a class="lk" href="https://fuwei0618-cmd.github.io/Wealth-mgm/" target="_top">財富管理 →</a><a class="lk" href="https://investment-beige-iota.vercel.app/" target="_top">投資 →</a><a class="lk" href="https://fuwei0618-cmd.github.io/Insurance/" target="_top">保險手冊 →</a></div>`;
  fit(document);}
function fitOne(t){const e=!t.value;if(e)t.value=t.placeholder;t.style.height='auto';t.style.height=t.scrollHeight+'px';if(e)t.value='';}
function fit(r){r.querySelectorAll('textarea.bl').forEach(fitOne)}
document.addEventListener('toggle',e=>{const d=e.target;if(!d.dataset||!d.dataset.vk)return;d.open?open.add(d.dataset.vk):open.delete(d.dataset.vk);localStorage.setItem(OPEN,JSON.stringify([...open]));if(d.open)fit(d);},true);
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.v==null&&d.vb==null&&d.rq==null&&d.ra==null&&d.ne==null)return;const v=load();
  if(d.v!=null)v[d.v]=t.value;else if(d.vb!=null)v.become[+d.vb]=t.value;else if(d.rq!=null)v.reframes[+d.rq].q=t.value;else if(d.ra!=null)v.reframes[+d.ra].a=t.value;
  else{const[k,i,f]=d.ne.split(':');v.needs[k][+i][f]=t.value;}
  save(v);if(t.tagName==='TEXTAREA')fitOne(t);});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const v=load(),i=+b.dataset.i,k=b.dataset.k;
  switch(b.dataset.a){
    case 'vb-add':v.become.push('');break;
    case 'ne-add':(v.needs[k]=v.needs[k]||[]).push({b:'',c:'',w:''});break;
    case 'ne-del':v.needs[k].splice(i,1);break;
    case 'rf-add':v.reframes.push({q:'',a:''});open.add('rf'+(v.reframes.length-1));break;
    case 'rf-del':v.reframes.splice(i,1);break;
    case 'tpl':v.reframes[i].a=TPL[v.reframes[i].q]||'';break;
    case 'w-add':{const t=(document.getElementById('w-in').value||'').trim();if(!t)return;v.wins.push({d:today(),t});break}
    case 'w-q':v.wins.push({d:today(),t:b.dataset.t});break;
    case 'w-del':v.wins.splice(i,1);break;
    default:return;}
  save(v);const y=scrollY;render();scrollTo(0,y);});
document.addEventListener('click',e=>{if(e.target.id==='back'&&window.top!==window.self){e.preventDefault();parent.postMessage({origina:'close-app'},'*');}},true);
window.addEventListener('storage',e=>{if(e.key===KEY)render();});
render();
</script>
<script src="../sync/origina-sync.js" data-app="vault" data-folder="Vault" data-keys="origina.vault.v1" data-pos="br" data-offset="16"></script>
</body></html>
