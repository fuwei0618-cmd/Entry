<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#111">
<title>拍照教練</title>
<style>
:root{--ink:#fff;--glass:rgba(20,18,16,.55);--gold:#E8C46A;--line:rgba(255,255,255,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#111;color:var(--ink);font-family:"PingFang TC","Noto Sans TC",system-ui,sans-serif;overflow:hidden}
#v{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#v.mirror{transform:scaleX(-1)}
#tpl{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;opacity:.35;display:none}
#pose{position:fixed;left:50%;bottom:16%;height:62%;transform:translateX(-50%);pointer-events:none;opacity:.9;filter:drop-shadow(0 0 3px rgba(0,0,0,.6))}
#grid{position:fixed;inset:0;pointer-events:none;display:none;background:
 linear-gradient(to right,transparent 33.2%,var(--line) 33.3%,var(--line) 33.5%,transparent 33.6%,transparent 66.5%,var(--line) 66.6%,var(--line) 66.8%,transparent 66.9%),
 linear-gradient(to bottom,transparent 33.2%,var(--line) 33.3%,var(--line) 33.5%,transparent 33.6%,transparent 66.5%,var(--line) 66.6%,var(--line) 66.8%,transparent 66.9%)}
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.top::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--glass);color:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip.on{background:#fff;color:#111;border-color:#fff}
#tip{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 178px);text-align:center;pointer-events:none}
#tip span{display:inline-block;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:16px;padding:10px 16px;font-size:17px;line-height:1.5;transition:opacity .35s;max-width:520px}
#tip small{display:block;font-size:12px;opacity:.7}
.poses{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 104px);display:flex;gap:8px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.poses::-webkit-scrollbar{display:none}
.poses button{flex:none;width:58px;height:66px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:#fff;font:inherit;font-size:11px;display:grid;place-items:center;padding:4px 2px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.poses button.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.poses svg{height:36px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 20px calc(env(safe-area-inset-bottom) + 16px);display:flex;align-items:center;justify-content:space-between}
.round{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:#fff;font:inherit;font-size:12px;display:grid;place-items:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow:hidden;padding:0}
.round img{width:100%;height:100%;object-fit:cover}
#shot{width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.25)}
#shot:active{background:#fff}
.side{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 64px);display:flex;flex-direction:column;gap:8px}
.side .round{width:46px;height:46px;font-size:11px;line-height:1.2;text-align:center}
.side .round.on{border-color:var(--gold);color:var(--gold)}
#count{position:fixed;inset:0;display:none;place-items:center;font-size:120px;font-weight:700;text-shadow:0 2px 20px rgba(0,0,0,.5);pointer-events:none}
#warm{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:22px;text-align:center;background:var(--glass);padding:14px 20px;border-radius:18px;display:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#start{position:fixed;inset:0;display:grid;place-items:center;background:#15120F;padding:24px;text-align:center}
#start h1{font-size:26px;margin:0 0 8px;letter-spacing:.08em}
#start p{color:#C9C0B5;line-height:1.7;font-size:15px;margin:0 0 22px}
#start button{background:#fff;color:#111;border:0;border-radius:999px;padding:14px 28px;font:inherit;font-size:16px;font-weight:600}
#opa{position:fixed;left:24px;right:84px;top:calc(env(safe-area-inset-top) + 70px);display:none;accent-color:var(--gold)}
#review{position:fixed;inset:0;background:#000;display:none;flex-direction:column}
#review img{flex:1;min-height:0;object-fit:contain;width:100%}
#review .rb{display:flex;gap:10px;justify-content:center;padding:14px 14px calc(env(safe-area-inset-bottom) + 18px)}
#review .rb button{background:var(--glass);border:1px solid var(--line);color:#fff;border-radius:999px;padding:12px 20px;font:inherit;font-size:15px}
#review .rb button.pri{background:#fff;color:#111}
</style></head><body>
<video id="v" playsinline muted autoplay></video>
<img id="tpl" alt="">
<div id="grid"></div>
<svg id="pose" viewBox="0 0 100 200" aria-hidden="true"></svg>
<div class="top" id="scenes"></div>
<input type="range" id="opa" min="10" max="70" value="35" aria-label="模板透明度">
<div class="side">
  <button class="round" id="bGrid">九宮格</button>
  <button class="round on" id="bWarm">暖身<br>倒數</button>
  <button class="round" id="bTpl">我的<br>模板</button>
  <button class="round" id="bFlip">前後<br>鏡頭</button>
</div>
<div id="tip"><span id="tipT"></span></div>
<div class="poses" id="poses"></div>
<div class="bar">
  <button class="round" id="thumb" aria-label="剛拍的照片">相片</button>
  <button id="shot" aria-label="拍照"></button>
  <button class="round" id="bNext" aria-label="下一個提醒">下一句</button>
</div>
<div id="warm"></div><div id="count"></div><div id="flash"></div>
<input type="file" id="file" accept="image/*" hidden>
<div id="review"><img id="rImg" alt="剛拍的照片"><div class="rb"><button id="rBack">繼續拍</button><button class="pri" id="rSave">存下來</button></div></div>
<div id="start"><div><h1>拍照教練</h1><p>選場景和姿勢，畫面會疊上姿勢線框，<br>邊邊會輪流提醒鏡頭感和表情。<br>也可以放一張喜歡的照片當模板對位。</p><button id="go">打開相機</button></div></div>

<script>
const $=s=>document.querySelector(s);
/* 場景提醒：之後會換成你從小喵課整理的重點 */
const SCENES={
 "隨手":["下巴微微往前、往下一點，脖子會變長","眼睛看鏡頭上方一點點，眼神比較柔","肩膀放鬆往下，不要聳肩","重心放在一隻腳，另一隻腳輕點地","手找事情做：摸頭髮、拉衣角、拿包包"],
 "咖啡廳":["手扶杯子，不要緊握，手指放鬆","坐椅子前三分之一，背打直","看窗外、低頭看飲料都比直視鏡頭自然","身體側 45 度，臉轉回來看鏡頭","拿起杯子到下巴高度，假裝要喝"],
 "戶外花海":["走進花裡，讓前景的花擋到一點畫面","閉眼抬頭感受陽光，不用看鏡頭","手輕碰花，指尖就好","逆光站，頭髮會有一圈光","邊走邊回頭，拍很多張挑一張"],
 "街拍":["走路抓拍：自然往前走，拍的人連拍","過馬路線、轉角都是好位置","靠牆時只靠一邊肩膀，不要整個背貼上去","手插口袋只插一半，比較不僵","低頭看地上再慢慢抬頭"],
 "海邊":["裙擺、頭髮被風吹就是動態","踢水、踩浪讓動作自然","人放在畫面下三分之一，留天空","背對鏡頭看海，也是一種故事","光腳、拎著鞋，畫面更放鬆"],
 "室內民宿":["坐在窗邊，用窗光照臉","抱枕、棉被、書都可以當道具","躺著拍時，手機從上往下","側躺時手臂撐頭，身體拉長","鏡子自拍：手機擋住半張臉也可以"],
 "夜拍":["站到招牌或路燈的光下","停 1 秒不動，夜拍容易糊","手機打光從側面，不要正面","背景的燈越多越好看","眼睛找光源，眼神會亮"]
};
const WARM=["想一件剛剛很好笑的事","輕輕吐一口氣，肩膀放下","嘴巴發「一」的音再放鬆","想像對面是你最喜歡的人"];
/* 姿勢線框（簡單的人形輪廓） */
const P={
 "重心一腳":"M50 13a9 9 0 1 0 .1 0 M50 31 L49 60 L48 92 M34 38 L66 38 M34 38 L28 62 L38 80 M66 38 L70 62 L62 82 M48 92 L42 92 L58 92 M44 92 L46 140 L48 190 M56 92 L50 140 L40 186",
 "手扶腰":"M50 13a9 9 0 1 0 .1 0 M50 31 L50 92 M34 38 L66 38 M34 38 L24 60 L38 74 M66 38 L72 62 L74 88 M43 92 L57 92 M45 92 L44 140 L42 190 M55 92 L58 140 L62 190",
 "側身回頭":"M58 14a9 9 0 1 0 .1 0 M54 32 L50 62 L52 94 M42 40 L60 37 M42 40 L40 66 L46 86 M60 37 L62 64 L58 84 M46 94 L58 94 M48 94 L46 142 L44 190 M56 94 L60 140 L64 188",
 "撥頭髮":"M50 13a9 9 0 1 0 .1 0 M50 31 L50 92 M34 38 L66 38 M34 38 L30 22 L40 12 M66 38 L70 62 L66 84 M43 92 L57 92 M46 92 L48 140 L50 190 M54 92 L50 140 L42 188",
 "坐姿":"M50 33a9 9 0 1 0 .1 0 M50 51 L50 108 M34 58 L66 58 M34 58 L30 82 L46 102 M66 58 L70 82 L56 104 M44 108 L56 108 M46 108 L76 112 L74 176 M54 108 L82 116 L84 178 M20 112 L96 112",
 "走路":"M50 13a9 9 0 1 0 .1 0 M50 31 L52 92 M36 38 L64 38 M36 38 L26 62 L28 84 M64 38 L72 60 L80 78 M45 92 L59 92 M47 92 L38 140 L28 184 M57 92 L62 140 L66 190",
 "靠牆":"M44 13a9 9 0 1 0 .1 0 M45 31 L48 92 M30 38 L60 36 M30 38 L26 64 L34 84 M60 36 L66 60 L58 80 M42 92 L56 92 M44 92 L46 140 L46 190 M54 92 L66 136 L52 176 M80 0 L80 200",
 "不用線框":""
};
let scene="隨手",pose="重心一腳",tipI=0,tipTimer,facing="environment",stream,warmOn=true,lastBlob=null;
function drawPose(){$("#pose").innerHTML=P[pose]?`<path d="${P[pose]}" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0" opacity=".85"/>`:"";}
function chips(){
 $("#scenes").innerHTML=Object.keys(SCENES).map(k=>`<button class="chip${k===scene?" on":""}" data-s="${k}">${k}</button>`).join("");
 $("#poses").innerHTML=Object.keys(P).map(k=>`<button class="${k===pose?"on":""}" data-p="${k}">${P[k]?`<svg viewBox="0 0 100 200"><path d="${P[k]}" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>`:"<b style='font-size:20px'>×</b>"}${k}</button>`).join("");
}
function showTip(next){const L=SCENES[scene];if(next)tipI=(tipI+1)%L.length;const t=$("#tipT");t.style.opacity=0;
 setTimeout(()=>{t.innerHTML=`<small>${scene}・${tipI+1}/${L.length}</small>${L[tipI]}`;t.style.opacity=1;},200);
 clearInterval(tipTimer);tipTimer=setInterval(()=>showTip(true),5000);}
$("#scenes").onclick=e=>{const b=e.target.closest("[data-s]");if(!b)return;scene=b.dataset.s;tipI=0;chips();showTip();};
$("#poses").onclick=e=>{const b=e.target.closest("[data-p]");if(!b)return;pose=b.dataset.p;chips();drawPose();};
$("#bNext").onclick=()=>showTip(true);
$("#bGrid").onclick=e=>{const g=$("#grid"),on=g.style.display!=="block";g.style.display=on?"block":"none";e.currentTarget.classList.toggle("on",on);};
$("#bWarm").onclick=e=>{warmOn=!warmOn;e.currentTarget.classList.toggle("on",warmOn);};
$("#bTpl").onclick=()=>{if($("#tpl").style.display==="block"){$("#tpl").style.display="none";$("#opa").style.display="none";$("#bTpl").classList.remove("on");}else $("#file").click();};
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;$("#tpl").src=URL.createObjectURL(f);$("#tpl").style.display="block";$("#opa").style.display="block";$("#bTpl").classList.add("on");e.target.value="";};
$("#opa").oninput=e=>$("#tpl").style.opacity=e.target.value/100;
async function cam(){
 try{if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}},audio:false});
  const v=$("#v");v.srcObject=stream;v.classList.toggle("mirror",facing==="user");await v.play();
 }catch(e){$("#start").style.display="grid";$("#start p").innerHTML="打不開相機。<br>請在 iPhone「設定 → Safari → 相機」選「允許」，<br>或用 Safari 打開這個網址再試一次。";}
}
$("#bFlip").onclick=()=>{facing=facing==="user"?"environment":"user";cam();};
$("#go").onclick=async()=>{$("#start").style.display="none";await cam();chips();drawPose();showTip();};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
$("#shot").onclick=async()=>{
 if(warmOn){const w=$("#warm");w.textContent=WARM[Math.floor(Math.random()*WARM.length)];w.style.display="block";await sleep(1600);w.style.display="none";
  const c=$("#count");c.style.display="grid";for(const n of [3,2,1]){c.textContent=n;await sleep(800);}c.style.display="none";}
 const v=$("#v");if(!v.videoWidth)return;
 const cv=document.createElement("canvas");cv.width=v.videoWidth;cv.height=v.videoHeight;const g=cv.getContext("2d");
 if(facing==="user"){g.translate(cv.width,0);g.scale(-1,1);}g.drawImage(v,0,0);
 const f=$("#flash");f.style.opacity=.8;setTimeout(()=>f.style.opacity=0,120);
 cv.toBlob(b=>{lastBlob=b;const u=URL.createObjectURL(b);$("#thumb").innerHTML=`<img src="${u}" alt="">`;$("#rImg").src=u;},"image/jpeg",.92);
};
$("#thumb").onclick=()=>{if(lastBlob)$("#review").style.display="flex";};
$("#rBack").onclick=()=>$("#review").style.display="none";
$("#rSave").onclick=async()=>{if(!lastBlob)return;const file=new File([lastBlob],"photo-"+Date.now()+".jpg",{type:"image/jpeg"});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return;}catch(e){if(e.name==="AbortError")return;}}
 const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;a.click();};
</script>
</body></html>
