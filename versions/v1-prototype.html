<title>Minion 森林之家</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&display=swap">
<style>
/* Layout: 全螢幕 3D 場景 + 紙片風浮層 UI（左上地點、右上視角/地點選單、底部互動鈕、左下搖桿）。單一淺色紙模型風格。 */
:root{
  --paper:#FFF8EC; --ink:#3E2E24; --muted:#7A6555; --accent:#D9583F; --water:#7DB7C4;
  --shadow:0 2px 0 rgba(62,46,36,.12),0 8px 18px rgba(62,46,36,.18);
  --f:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:#CFE3D6}
body{font-family:var(--f);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.chip{background:var(--paper);border:0;border-radius:12px;box-shadow:var(--shadow);padding:10px 14px}
.hud-tl{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:2px;pointer-events:none}
.hud-tl b{font-size:16px;letter-spacing:.04em}
.hud-tl span{font-size:13px;color:var(--muted)}
.hud-tr{position:fixed;right:16px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:8px}
.hud-tr button{min-height:44px;font-weight:700;font-size:14px}
.prompt{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);min-height:52px;padding:12px 22px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);border-radius:14px;box-shadow:var(--shadow);border:0}
.prompt small{font-weight:500;opacity:.75;font-size:13px}
.hint{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:13px;color:var(--muted);transition:opacity .6s;text-align:center;max-width:calc(100% - 32px)}
.joy{position:fixed;left:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,248,236,.45);box-shadow:inset 0 0 0 2px rgba(255,248,236,.85);touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--paper);box-shadow:var(--shadow)}
.fade{position:fixed;inset:0;background:#2A211B;opacity:0;pointer-events:none;transition:opacity .28s}
.fade.on{opacity:1}
.sheet-bg{position:fixed;inset:0;background:rgba(42,33,27,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{width:min(440px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:22px 22px 18px;display:flex;flex-direction:column;gap:12px}
.sheet .tag{font-size:12px;letter-spacing:.14em;color:var(--muted)}
.sheet h2{margin:0;font-size:22px}
.sheet p{margin:0;line-height:1.7;font-size:15px}
.sheet ul{margin:0;padding-left:20px;line-height:1.8;font-size:14px}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;border:0;font-weight:700;font-size:14px;text-decoration:none}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.light{background:#EFE3D0;color:var(--ink)}
.btn.off{background:#EFE3D0;color:var(--muted);cursor:default}
.places{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.places button{text-align:left;padding:10px 12px;border-radius:12px;border:0;background:#F3E8D6;min-height:52px}
.places button b{display:block;font-size:14px}
.places button span{font-size:12px;color:var(--muted)}
.places h3{grid-column:1/-1;margin:6px 0 0;font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.prompt[hidden],.joy[hidden]{display:none}
.err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#CFE3D6}
@media (prefers-reduced-motion:reduce){.fade,.hint{transition:none}}
</style>

<canvas id="c" tabindex="0" aria-label="森林之家 3D 場景。點地面行走，拖曳轉動視角。"></canvas>
<div class="hud-tl chip"><b>Minion 森林之家</b><span id="where">森林</span></div>
<div class="hud-tr">
  <button class="chip" id="viewBtn" aria-label="切換視角">第三人稱</button>
  <button class="chip" id="menuBtn" aria-label="打開地點選單">地點</button>
</div>
<div class="hint chip" id="hint">點地面走過去 · 拖曳轉動視角 · 電腦可用 WASD 或方向鍵</div>
<button class="prompt" id="prompt" hidden></button>
<div class="joy" id="joy" hidden><i id="knob"></i></div>
<div class="fade" id="fade"></div>
<div id="sheetRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<div class="err">3D 元件沒有載入成功，請重新整理頁面。</div>');return;}
const R=THREE;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand=rng(20261006);
const sm=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- renderer ---------- */
const canvas=$('#c');
let renderer;
try{renderer=new R.WebGLRenderer({canvas,antialias:true});}
catch(e){document.body.insertAdjacentHTML('beforeend','<div class="err">這台裝置的瀏覽器沒有開啟 3D（WebGL），所以無法顯示森林之家。</div>');return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=R.PCFSoftShadowMap;
const camera=new R.PerspectiveCamera(58,1,0.08,420);
camera.rotation.order='YXZ';
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

const mat=(color,o)=>new R.MeshStandardMaterial(Object.assign({color,roughness:.88,metalness:0,flatShading:true},o||{}));
function mesh(geo,m,x,y,z,parent,cast=true,recv=true){const o=new R.Mesh(geo,m);o.position.set(x||0,y||0,z||0);o.castShadow=cast;o.receiveShadow=recv;if(parent)parent.add(o);return o;}

/* ---------- labels ---------- */
function makeLabel(text,sub){
  const c=document.createElement('canvas');c.width=512;c.height=sub?168:128;const g=c.getContext('2d');
  const w=512,h=c.height;g.fillStyle='rgba(62,46,36,.18)';rr(g,10,14,w-20,h-20,26);g.fill();
  g.fillStyle='#FFF8EC';rr(g,8,6,w-16,h-20,26);g.fill();
  g.fillStyle='#3E2E24';g.textAlign='center';g.textBaseline='middle';
  g.font='700 54px "Noto Sans TC","PingFang TC",sans-serif';g.fillText(text,w/2,sub?60:58);
  if(sub){g.fillStyle='#7A6555';g.font='500 34px "Noto Sans TC","PingFang TC",sans-serif';g.fillText(sub,w/2,118);}
  const t=new R.CanvasTexture(c);t.anisotropy=4;
  const s=new R.Sprite(new R.SpriteMaterial({map:t,depthWrite:false,transparent:true}));
  s.scale.set(3.2,3.2*h/512,1);s.renderOrder=5;return s;
}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

/* =========================================================
   OUTDOOR · 森林
   ========================================================= */
const out=new R.Scene();
out.fog=new R.Fog(0xCFE3D6,28,105);
const sky=new R.Mesh(new R.SphereGeometry(200,24,12),new R.ShaderMaterial({side:R.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:new R.Color(0x8EC3DB)},bot:{value:new R.Color(0xE7F1E3)}},
  vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top;uniform vec3 bot;varying vec3 vP;void main(){float h=normalize(vP).y;gl_FragColor=vec4(mix(bot,top,smoothstep(-.02,.55,h)),1.);}'}));
out.add(sky);
const hemi=new R.HemisphereLight(0xDDEBF5,0x4E6B3A,.5);out.add(hemi);
const sun=new R.DirectionalLight(0xFFEAC8,.78);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-38,right:38,top:38,bottom:-38,near:1,far:140});sun.shadow.bias=-.0006;
out.add(sun);out.add(sun.target);
const SUN_OFF=new R.Vector3(28,46,18);

function riverX(z){return -20+4*Math.sin(z*.07)+2*Math.sin(z*.17+1.3);}
function heightAt(x,z){
  const r=Math.hypot(x,z);
  let h=.7*Math.sin(x*.11)*Math.cos(z*.09)+.4*Math.sin(x*.23+z*.17);
  h*=sm(12,28,Math.hypot(x-2,z+4));
  h+=Math.pow(Math.max(0,r-44),1.35)*.13;
  const d=Math.abs(x-riverX(z));
  h-=1.15*(1-sm(2.6,5,d));
  return h;
}
const hx=0,hz=-8; // 房子中心
const mz=10,mx=riverX(10)+8; // 蘑菇
const sx=15,sz=-22; // 舞台
const gx=-8,gz=-25; // 世界之門
const PATHS=[[0,26,0,-3.5],[0,14,mx+3,mz],[0,12,12.5,6],[0,-3.2,6.3,-3.2],[0,-3.2,-6.3,-3.2],[6.3,-3.2,6.3,-13],[6.3,-13,sx,sz+5],[-6.3,-3.2,-6.3,-14],[-6.3,-14,gx,gz+3.5],[0,4,riverX(2)+5,2]];
function segD(px,pz,a){const[x1,z1,x2,z2]=a,dx=x2-x1,dz=z2-z1,L=dx*dx+dz*dz;let t=L?((px-x1)*dx+(pz-z1)*dz)/L:0;t=clamp(t,0,1);return Math.hypot(px-(x1+t*dx),pz-(z1+t*dz));}
const pathD=(x,z)=>Math.min(...PATHS.map(p=>segD(x,z,p)));

// ground
{
  const g=new R.PlaneGeometry(170,170,150,150);g.rotateX(-Math.PI/2);
  const p=g.attributes.position,cols=[];
  const cG=new R.Color(0x7FA35F),cM=new R.Color(0x6B9653),cD=new R.Color(0xD2B98E),cB=new R.Color(0x9A9886),tmp=new R.Color();
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),z=p.getZ(i);p.setY(i,heightAt(x,z));
    const d=Math.abs(x-riverX(z));
    tmp.copy(cG).lerp(cM,(1-sm(4,11,d))*.85);
    if(d<4.6)tmp.lerp(cB,1-sm(3,4.6,d));
    tmp.lerp(cD,(1-sm(.9,1.8,pathD(x,z)))*.9);
    tmp.offsetHSL(0,0,(rand()-.5)*.05);
    cols.push(tmp.r,tmp.g,tmp.b);
  }
  g.setAttribute('color',new R.Float32BufferAttribute(cols,3));g.computeVertexNormals();
  const ground=new R.Mesh(g,new R.MeshStandardMaterial({vertexColors:true,roughness:.95,flatShading:true}));
  ground.receiveShadow=true;ground.name='ground';out.add(ground);
  out.userData.ground=ground;
}

// river · 記錄之河
const waterMat=new R.ShaderMaterial({transparent:true,depthWrite:false,
  uniforms:{t:{value:0},deep:{value:new R.Color(0x4F8E8F)},shallow:{value:new R.Color(0x9CC9B4)},skyc:{value:new R.Color(0xD5EAF0)},fogc:{value:new R.Color(0xCFE3D6)}},
  vertexShader:'uniform float t;varying vec2 vUv;varying vec3 vW;void main(){vUv=uv;vec3 p=position;p.y+=sin(p.z*.9+t*1.4)*.025+sin(p.x*1.7-t)*.02;vec4 w=modelMatrix*vec4(p,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}',
  fragmentShader:`uniform float t;uniform vec3 deep;uniform vec3 shallow;uniform vec3 skyc;uniform vec3 fogc;varying vec2 vUv;varying vec3 vW;
  void main(){float e=abs(vUv.x-.5)*2.;vec3 col=mix(deep,shallow,smoothstep(.15,1.,e));
  float f=vUv.y*3.-t*.55;float a=sin(f*6.+sin(vUv.x*9.+t)*1.6)*.5+.5;float b=sin(f*13.+vUv.x*23.-t*1.3)*.5+.5;float c=sin(f*4.-vUv.x*15.+t*.7)*.5+.5;
  float sp=pow(a*b*c,6.);vec3 V=normalize(cameraPosition-vW);float fr=pow(1.-max(V.y,0.),2.5);
  col=mix(col,skyc,fr*.55+(a-.5)*.08);col+=sp*.6;col+=(1.-smoothstep(.85,1.,e))*0.;
  float d=length(cameraPosition-vW);col=mix(col,fogc,smoothstep(28.,105.,d));
  gl_FragColor=vec4(col,mix(.74,.93,fr)*(1.-smoothstep(.93,1.,e)*.6));}`});
{
  const segs=220,z0=-85,z1=85,hw=4.2,pos=[],uv=[],idx=[];
  for(let i=0;i<=segs;i++){const z=z0+(z1-z0)*i/segs,cx=riverX(z),v=i/segs*28;pos.push(cx-hw,-.55,z,cx+hw,-.55,z);uv.push(0,v,1,v);
    if(i<segs){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3);}}
  const g=new R.BufferGeometry();g.setAttribute('position',new R.Float32BufferAttribute(pos,3));g.setAttribute('uv',new R.Float32BufferAttribute(uv,2));g.setIndex(idx);
  const w=new R.Mesh(g,waterMat);w.renderOrder=2;out.add(w);
}
// rocks
{
  const n=70,im=new R.InstancedMesh(new R.DodecahedronGeometry(1,0),mat(0xffffff),n),m=new R.Matrix4(),q=new R.Quaternion(),e=new R.Euler(),c=new R.Color();
  for(let i=0;i<n;i++){const z=-70+rand()*140,side=rand()<.5?-1:1,off=rand()<.3?rand()*2.5:3+rand()*2.6,x=riverX(z)+side*off,s=.25+rand()*.9;
    e.set(rand()*3,rand()*3,rand()*3);q.setFromEuler(e);m.compose(new R.Vector3(x,heightAt(x,z)+s*.25,z),q,new R.Vector3(s*1.3,s*.75,s));im.setMatrixAt(i,m);
    c.set(rand()<.45?0x7E9A62:0xB8B6A8).offsetHSL(0,0,(rand()-.5)*.08);im.setColorAt(i,c);}
  im.castShadow=true;im.receiveShadow=true;out.add(im);
}

// colliders & hotspots
const colOut=[],colIn=[];
// trees (instanced)
{
  const spots=[];let tries=0;
  while(spots.length<190&&tries<9000){tries++;
    const x=-62+rand()*124,z=-62+rand()*124,r=Math.hypot(x,z);if(r>64)continue;
    const d=Math.abs(x-riverX(z));if(d<5.2)continue;
    if(Math.hypot(x-hx,z-(hz+3))<15.5)continue;
    if(Math.hypot(x-16,z-4)<10||Math.hypot(x-sx,z-sz)<10||Math.hypot(x-gx,z-gz)<6.5||Math.hypot(x-mx,z-mz)<6.5)continue;
    if(pathD(x,z)<2.4)continue;
    if(spots.some(s=>Math.hypot(s[0]-x,s[1]-z)<2.6))continue;
    spots.push([x,z,d<10?1.35+rand()*.5:.85+rand()*.6,rand()<.42]);
  }
  const broad=spots.filter(s=>!s[3]),conif=spots.filter(s=>s[3]);
  const trunks=new R.InstancedMesh(new R.CylinderGeometry(.18,.3,1,6),mat(0x8C6646),spots.length);
  const canA=new R.InstancedMesh(new R.IcosahedronGeometry(1,0),mat(0xffffff),broad.length);
  const canB=new R.InstancedMesh(new R.IcosahedronGeometry(1,0),mat(0xffffff),broad.length);
  const cones=new R.InstancedMesh(new R.ConeGeometry(1,1,7),mat(0xffffff),conif.length*2);
  const m=new R.Matrix4(),q=new R.Quaternion(),e=new R.Euler(),c=new R.Color(),v=new R.Vector3(),sv=new R.Vector3();
  spots.forEach((s,i)=>{const[x,z,k]=s,y=heightAt(x,z),th=2.6*k;m.compose(v.set(x,y+th/2,z),q.identity(),sv.set(k,th,k));trunks.setMatrixAt(i,m);colOut.push({x,z,r:.35*k+.1});});
  broad.forEach((s,i)=>{const[x,z,k]=s,y=heightAt(x,z);
    e.set(rand(),rand()*3,rand());q.setFromEuler(e);m.compose(v.set(x,y+2.6*k+1.0*k,z),q,sv.set(1.8*k,1.6*k,1.8*k));canA.setMatrixAt(i,m);
    c.set(0x6E9A5B).offsetHSL((rand()-.5)*.04,0,(rand()-.5)*.08);canA.setColorAt(i,c);
    e.set(rand(),rand()*3,rand());q.setFromEuler(e);m.compose(v.set(x+.6*k,y+2.6*k+2.1*k,z-.3*k),q,sv.set(1.25*k,1.15*k,1.25*k));canB.setMatrixAt(i,m);
    c.set(0x8DB86C).offsetHSL((rand()-.5)*.04,0,(rand()-.5)*.08);canB.setColorAt(i,c);});
  conif.forEach((s,i)=>{const[x,z,k]=s,y=heightAt(x,z);
    m.compose(v.set(x,y+2.3*k+1.4*k,z),q.identity(),sv.set(1.7*k,3.2*k,1.7*k));cones.setMatrixAt(i*2,m);c.set(0x4F7E4E).offsetHSL(0,0,(rand()-.5)*.06);cones.setColorAt(i*2,c);
    m.compose(v.set(x,y+2.3*k+3.1*k,z),q.identity(),sv.set(1.2*k,2.4*k,1.2*k));cones.setMatrixAt(i*2+1,m);c.set(0x5E8F57).offsetHSL(0,0,(rand()-.5)*.06);cones.setColorAt(i*2+1,c);});
  [trunks,canA,canB,cones].forEach(o=>{o.castShadow=true;o.receiveShadow=true;out.add(o);});
}

// 房子外觀
{
  const H=new R.Group(),y0=heightAt(hx,hz);H.position.set(hx,y0,hz);out.add(H);
  mesh(new R.BoxGeometry(10.6,.5,8.6),mat(0xC7B39A),0,.25,0,H);
  mesh(new R.BoxGeometry(10,6.4,8),mat(0xFFF6E8),0,3.7,0,H);
  mesh(new R.BoxGeometry(10.2,.25,8.2),mat(0xD9C3A5),0,3.55,0,H);
  const sh=new R.Shape();sh.moveTo(-5.7,0);sh.lineTo(5.7,0);sh.lineTo(0,3.4);sh.lineTo(-5.7,0);
  const rg=new R.ExtrudeGeometry(sh,{depth:9,bevelEnabled:false});rg.translate(0,0,-4.5);
  mesh(rg,mat(0xD9724F),0,6.9,0,H);
  mesh(new R.BoxGeometry(.9,2,.9),mat(0xB8A48C),3,9.2,-1.5,H);
  const glow=new R.MeshBasicMaterial({color:0xFFE0A6}),frame=mat(0xA97C55);
  [[-3,2.3],[3,2.3],[-3,5.2],[0,5.2],[3,5.2]].forEach(([x,y])=>{mesh(new R.BoxGeometry(1.6,1.4,.12),frame,x,y,4.02,H,false);mesh(new R.PlaneGeometry(1.3,1.1),glow,x,y,4.1,H,false,false);});
  mesh(new R.PlaneGeometry(1.1,1.1),glow,0,8.3,4.6,H,false,false);
  mesh(new R.BoxGeometry(1.6,2.5,.2),mat(0x9C6B45),0,1.75,4.05,H);
  mesh(new R.SphereGeometry(.08,8,6),mat(0xF2C04E,{metalness:.4}),.5,1.7,4.2,H,false);
  mesh(new R.BoxGeometry(2.6,.15,1.4),mat(0xA97C55),0,3.25,4.6,H);
  mesh(new R.BoxGeometry(2.4,.3,1.2),mat(0xC7B39A),0,.15,4.9,H);
  mesh(new R.BoxGeometry(1.4,2.3,.2),mat(0xB8402F),4.2,1.65,-4.05,H);
  const lamp=new R.PointLight(0xFFC77A,.6,9);lamp.position.set(0,3,5.4);H.add(lamp);
  colOut.push({x0:hx-5.3,x1:hx+5.3,z0:hz-4.3,z1:hz+4.3});
  const lb=makeLabel('家','點門進去');lb.position.set(hx,y0+10.4,hz+4.4);out.add(lb);
}
// 蘑菇攝影棚
{

/* =========================================================
   PLAYER
   ========================================================= */
const player=new R.Group();
const body={};
{const skin=mat(0xF2CDB3),hair=mat(0x3E2E24),dress=mat(0x7DB7C4),dark=mat(0x4A3A30);
  body.legL=mesh(new R.BoxGeometry(.13,.55,.13),dark,-.1,.28,0,player);body.legR=mesh(new R.BoxGeometry(.13,.55,.13),dark,.1,.28,0,player);
  mesh(new R.ConeGeometry(.42,.85,8),dress,0,.86,0,player);
  mesh(new R.CylinderGeometry(.17,.22,.35,8),dress,0,1.24,0,player);
  body.armL=mesh(new R.BoxGeometry(.1,.5,.1),skin,-.27,1.12,0,player);body.armR=mesh(new R.BoxGeometry(.1,.5,.1),skin,.27,1.12,0,player);
  [body.armL,body.armR].forEach(a=>{a.geometry.translate(0,-.2,0);a.position.y=1.32;});
  mesh(new R.SphereGeometry(.22,12,10),skin,0,1.56,0,player);
  const h=mesh(new R.SphereGeometry(.245,12,10,0,Math.PI*2,0,Math.PI*.62),hair,0,1.58,-.02,player);h.rotation.x=-.25;
  mesh(new R.SphereGeometry(.11,8,6),hair,0,1.76,-.17,player);
  mesh(new R.BoxGeometry(.36,.42,.08),hair,0,1.42,-.2,player);
}
const P={x:0,z:15,y:0,face:Math.PI,yaw:0,pitch:-.08,orbit:.42,speed:6.2,walkT:0,moving:false};
let scene=out,colliders=colOut,hots=HOT_OUT,place='forest',view='third';
out.add(player);

/* ---------- input ---------- */
const keys={};
addEventListener('keydown',e=>{if(sheetOpen())return;const k=e.key.toLowerCase();keys[k]=true;if(k==='e'||k==='enter'){if(curHot){e.preventDefault();act(curHot);}}if(k==='v')toggleView();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
let target=null,lastProg=0,stuckT=0;
const ray=new R.Raycaster(),ndc=new R.Vector2();
let drag=null;
canvas.addEventListener('pointerdown',e=>{canvas.focus({preventScroll:true});drag={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now(),moved:false};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
  if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8)drag.moved=true;
  if(drag.moved){P.yaw-=dx*.0055;if(view==='first')P.pitch=clamp(P.pitch-dy*.004,-1.1,1.0);else P.orbit=clamp(P.orbit+dy*.004,.12,1.2);}});
canvas.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;
  if(!d.moved&&performance.now()-d.t<450){const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
    ray.setFromCamera(ndc,camera);const hit=ray.intersectObject(scene.userData.ground,false)[0];
    if(hit){target={x:hit.point.x,z:hit.point.z};lastProg=1e9;stuckT=0;showMarker(hit.point);}}});
canvas.addEventListener('pointercancel',()=>{drag=null;});
// joystick
const coarse=matchMedia('(pointer:coarse)').matches;const joy=$('#joy'),knob=$('#knob');joy.hidden=!coarse;
const J={x:0,y:0,id:null};
joy.addEventListener('pointerdown',e=>{J.id=e.pointerId;joy.setPointerCapture(e.pointerId);jmove(e);});
joy.addEventListener('pointermove',e=>{if(e.pointerId===J.id)jmove(e);});
const jend=e=>{if(e.pointerId!==J.id)return;J.id=null;J.x=J.y=0;knob.style.transform='';};
joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
function jmove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const L=Math.hypot(dx,dy),M=42;if(L>M){dx*=M/L;dy*=M/L;}
  J.x=dx/M;J.y=dy/M;knob.style.transform=`translate(${dx}px,${dy}px)`;target=null;}
// marker
const marker=new R.Mesh(new R.RingGeometry(.35,.5,24),new R.MeshBasicMaterial({color:0xFFF8EC,transparent:true,opacity:0,depthWrite:false}));marker.rotation.x=-Math.PI/2;marker.renderOrder=3;
function showMarker(p){marker.position.set(p.x,p.y+.06,p.z);marker.material.opacity=.9;marker.scale.setScalar(1);if(marker.parent!==scene)scene.add(marker);}

/* ---------- movement ---------- */
function floorAt(x,z){
  if(scene===home)return 0;
  let y=Math.max(heightAt(x,z),-.95);
  const dx=x-sx,dz=z-sz;if(dz>-.2&&Math.hypot(dx,dz)<6)y=Math.max(y,stageY+.6);
  return y;
}
function resolve(p){
  for(const c of colliders){
    if(c.r!==undefined){const dx=p.x-c.x,dz=p.z-c.z,d=Math.hypot(dx,dz),m=c.r+.32;if(d<m&&d>1e-4){p.x=c.x+dx/d*m;p.z=c.z+dz/d*m;}}
    else{const m=.32;if(p.x>c.x0-m&&p.x<c.x1+m&&p.z>c.z0-m&&p.z<c.z1+m){const pen=[p.x-(c.x0-m),(c.x1+m)-p.x,p.z-(c.z0-m),(c.z1+m)-p.z];const i=pen.indexOf(Math.min(...pen));
      if(i===0)p.x=c.x0-m;else if(i===1)p.x=c.x1+m;else if(i===2)p.z=c.z0-m;else p.z=c.z1+m;}}
  }
  if(scene===home){p.x=clamp(p.x,-W/2+.45,W/2-.45);p.z=clamp(p.z,-D/2+.45,D/2-.45);}
  else{const r=Math.hypot(p.x,p.z);if(r>58){p.x*=58/r;p.z*=58/r;}}
}
const fwd=new R.Vector3();
function step(dt){
  let ix=0,iy=0;
  if(keys['w']||keys['arrowup'])iy+=1;if(keys['s']||keys['arrowdown'])iy-=1;if(keys['a']||keys['arrowleft'])ix-=1;if(keys['d']||keys['arrowright'])ix+=1;
  ix+=J.x;iy-=J.y;
  let mx_=0,mz_=0;
  if(Math.hypot(ix,iy)>.08){target=null;const s=Math.min(1,Math.hypot(ix,iy));const L=Math.hypot(ix,iy);ix/=L;iy/=L;
    const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);mx_=(fx*iy+rx*ix)*s;mz_=(fz*iy+rz*ix)*s;}
  else if(target){const dx=target.x-P.x,dz=target.z-P.z,d=Math.hypot(dx,dz);
    if(d<.18){target=null;}else{mx_=dx/d*Math.min(1,d/.6);mz_=dz/d*Math.min(1,d/.6);
      if(d<lastProg-.01){lastProg=d;stuckT=0;}else{stuckT+=dt;if(stuckT>.5)target=null;}}}
  const sp=P.speed*(scene===home?.62:1);
  P.moving=Math.hypot(mx_,mz_)>.05;
  if(P.moving){const p={x:P.x+mx_*sp*dt,z:P.z+mz_*sp*dt};resolve(p);P.x=p.x;P.z=p.z;
    const want=Math.atan2(mx_,mz_);let df=want-P.face;df=Math.atan2(Math.sin(df),Math.cos(df));P.face+=df*Math.min(1,dt*12);P.walkT+=dt*sp*1.6;}
  P.y+=(floorAt(P.x,P.z)-P.y)*Math.min(1,dt*14);
  player.position.set(P.x,P.y,P.z);player.rotation.y=P.face;
  const sw=P.moving?Math.sin(P.walkT):0;body.legL.rotation.x=sw*.6;body.legR.rotation.x=-sw*.6;body.armL.rotation.x=-sw*.5;body.armR.rotation.x=sw*.5;
  player.position.y+=P.moving?Math.abs(Math.cos(P.walkT))*.05:0;
}
const camPos=new R.Vector3(),look=new R.Vector3();let camInit=true;
function updateCamera(dt){
  ceil.visible=view==='first';
  if(view==='first'){player.visible=false;camera.position.set(P.x,P.y+1.5,P.z);camera.rotation.set(P.pitch,P.yaw,0);camInit=true;return;}
  player.visible=true;
  const dist=scene===home?5.6:7.2,ph=scene===home?Math.max(P.orbit,.78):P.orbit;
  const want=new R.Vector3(P.x+Math.sin(P.yaw)*Math.cos(ph)*dist,P.y+1.4+Math.sin(ph)*dist,P.z+Math.cos(P.yaw)*Math.cos(ph)*dist);
  if(scene!==home)want.y=Math.max(want.y,heightAt(want.x,want.z)+.8);
  if(camInit){camPos.copy(want);camInit=false;}else camPos.lerp(want,Math.min(1,dt*7));
  camera.position.copy(camPos);look.set(P.x,P.y+1.25,P.z);camera.lookAt(look);
}

/* ---------- hotspots ---------- */
let curHot=null;const prompt=$('#prompt');
function checkHot(){
  let best=null,bd=1e9;
  for(const h of hots){const hx_=h.dyn?dog.position.x:h.x,hz_=h.dyn?dog.position.z:h.z,d=Math.hypot(P.x-hx_,P.z-hz_);if(d<h.r&&d<bd){bd=d;best=h;}}
  if(best!==curHot){curHot=best;if(best){prompt.innerHTML=`${esc(best.verb)} · ${esc(best.name)} <small>${coarse?'':'E'}</small>`;prompt.hidden=false;}else prompt.hidden=true;}
}
prompt.addEventListener('click',()=>{if(curHot)act(curHot);});
function act(h){if(h.go)h.go();else openInfo(h.id);}

/* ---------- scene switching ---------- */
const fade=$('#fade');
function transition(fn){fade.classList.add('on');setTimeout(()=>{fn();camInit=true;setTimeout(()=>fade.classList.remove('on'),60);},280);}
function setScene(s){scene.remove(player);scene=s;scene.add(player);colliders=s===home?colIn:colOut;hots=s===home?HOT_IN:HOT_OUT;curHot=null;prompt.hidden=true;target=null;if(marker.parent)marker.parent.remove(marker);}
function enterHome(){transition(()=>{setScene(home);P.x=0;P.z=D/2-2.4;P.face=Math.PI;P.yaw=0;P.y=0;setWhere('家 · 1F');});}
function leaveHome(where){transition(()=>{setScene(out);
  if(where==='stage'){P.x=sx;P.z=sz+6.5;P.face=Math.PI;P.yaw=0;setWhere('舞台');}
  else if(where==='world'){P.x=gx;P.z=gz+4.5;P.face=Math.PI;P.yaw=0;setWhere('世界之門');}
  else{P.x=hx;P.z=hz+6.6;P.face=0;P.yaw=Math.PI;setWhere('森林');}
  P.y=floorAt(P.x,P.z);});}
function setWhere(t){$('#where').textContent=t;place=t;}

/* ---------- sheets ---------- */
const root=$('#sheetRoot');
const sheetOpen=()=>!!root.firstChild;
function closeSheet(){root.innerHTML='';canvas.focus({preventScroll:true});}
function openSheet(html){root.innerHTML=`<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#sbg').addEventListener('click',e=>{if(e.target.id==='sbg'||e.target.closest('[data-close]'))closeSheet();});
  const f=root.querySelector('button,a');if(f)f.focus();}
addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetOpen())closeSheet();});
function openInfo(id){const x=INFO[id];if(!x)return;
  const links=(x.links||[]).map(([t,u])=>u?`<a class="btn dark" href="${u}" target="_blank" rel="noopener">${esc(t)} ↗</a>`:`<span class="btn off">${esc(t)}</span>`).join('');
  openSheet(`<div class="tag">${esc(x.tag)}</div><h2>${esc(x.title)}</h2><p>${esc(x.body)}</p>${x.list?`<ul>${x.list.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:''}
    ${x.soon?`<p style="font-size:13px;color:var(--muted)">${esc(x.note||'這個房間的工具會在之後接上。')}</p>`:''}
    <div class="row">${links}<button class="btn light" data-close>回到場景</button></div>`);}
const PLACES=[
  ['森林',[['森林入口','起點',()=>goOut(0,15,Math.PI,0)],['記錄之河','河邊',()=>goOut(riverX(2)+5.6,2,-Math.PI/2,Math.PI/2)],['蘑菇攝影棚','自媒體',()=>goOut(mx+4,mz+.5,-Math.PI/2,Math.PI/2)],['七個小屋','人際',()=>goOut(16,9,Math.PI,0)],['舞台','主唱 · 合唱 · Podcast',()=>goOut(sx,sz+6.5,Math.PI,0)],['世界之門','旅遊',()=>goOut(gx,gz+4.5,Math.PI,0)]]],
  ['家',[['玄關','1F',()=>goIn(0,D/2-2.4)],['日曆牆','每日 · 每週',()=>goIn(-W/2+2,.4,-Math.PI/2,Math.PI/2)],['廚房餐廳','飲食',()=>goIn(-5,-1.6)],['衣帽間','穿搭 · 外型',()=>goIn(W/2-2.6,3.6,Math.PI/2,-Math.PI/2)],['健身房','身體',()=>goIn(5.6,1)],['金庫','理財 · 保險',()=>goIn(5.8,-4.4)],['樓梯','臥室 · 閣樓',()=>goIn(-6.2,4.2)]]]
];
function goOut(x,z,face,yaw){closeSheet();transition(()=>{setScene(out);P.x=x;P.z=z;P.face=face;P.yaw=yaw;P.y=floorAt(x,z);setWhere('森林');});}
function goIn(x,z,face=Math.PI,yaw=0){closeSheet();transition(()=>{setScene(home);P.x=x;P.z=z;P.face=face;P.yaw=yaw;P.y=0;setWhere('家 · 1F');});}
$('#menuBtn').addEventListener('click',()=>{
  openSheet(`<div class="tag">快速移動</div><h2>想去哪裡？</h2><div class="places">${PLACES.map(([g,items],gi)=>`<h3>${g}</h3>${items.map(([n,s],i)=>`<button data-p="${gi}-${i}"><b>${n}</b><span>${s}</span></button>`).join('')}`).join('')}</div><div class="row"><button class="btn light" data-close>關閉</button></div>`);
  root.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>{const[g,i]=b.dataset.p.split('-').map(Number);PLACES[g][1][i][2]();}));
});
function toggleView(){view=view==='third'?'first':'third';$('#viewBtn').textContent=view==='third'?'第三人稱':'第一人稱';if(view==='first')P.pitch=-.05;camInit=true;}
$('#viewBtn').addEventListener('click',toggleView);
setTimeout(()=>{$('#hint').style.opacity='0';},7000);

/* ---------- loop ---------- */
const clock=new R.Clock();
function frame(){
  const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
  if(!sheetOpen())step(dt);
  updateCamera(dt);
  checkHot();
  waterMat.uniforms.t.value=t;portalMat.uniforms.t.value=t;
  if(scene===out){sky.position.copy(camera.position);sun.position.set(P.x+SUN_OFF.x,SUN_OFF.y,P.z+SUN_OFF.z);sun.target.position.set(P.x,0,P.z);
    const pp=pollen.geometry.attributes.position;for(let i=0;i<pp.count;i++){let y=pp.getY(i)+Math.sin(t*.6+i)*.004;pp.setY(i,y);}pp.needsUpdate=true;pollen.position.set(P.x*.6,0,P.z*.6);pollen.rotation.y=t*.01;}
  else{
    const dx=dogAI.tx-dog.position.x,dz=dogAI.tz-dog.position.z,d=Math.hypot(dx,dz);
    if(d>.1){dog.position.x+=dx/d*dt*1.6;dog.position.z+=dz/d*dt*1.6;dog.rotation.y=Math.atan2(dx,dz);}
    else{dogAI.wait-=dt;if(dogAI.wait<0){const near=Math.hypot(P.x-dog.position.x,P.z-dog.position.z)<5&&rand()<.6;
      dogAI.tx=near?clamp(P.x+(rand()-.5)*1.6,-3,3):(rand()-.5)*6;dogAI.tz=near?clamp(P.z+(rand()-.5)*1.6,-2.5,3.5):(rand()-.5)*5+.5;dogAI.wait=1+rand()*2.5;}}
    dog.userData.tail.rotation.y=Math.sin(t*14)*.6;}
  if(marker.material.opacity>0){marker.material.opacity=Math.max(0,marker.material.opacity-dt*1.2);marker.scale.multiplyScalar(1+dt*.6);}
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
P.y=floorAt(P.x,P.z);
requestAnimationFrame(frame);
})();
</script>
