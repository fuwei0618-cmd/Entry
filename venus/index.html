<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>維納斯的桌子</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1c1814;color:#2E2420;font-family:"PingFang TC","Noto Sans TC",system-ui,sans-serif;overflow:hidden}
#bg{position:fixed;inset:-40px;background:url(ripple-s.webp) center/cover;filter:blur(30px) brightness(.55);transform:scale(1.1)}
#view{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#sizer{position:relative;flex-shrink:0}
#stage{position:absolute;left:0;top:0;width:1680px;height:944px;transform-origin:0 0;overflow:hidden;background:#E8DCCB}
#stage>img{position:absolute;top:0;left:-372px;width:1680px;height:944px;object-fit:cover}
#paper{position:absolute;left:902px;top:0;width:778px;height:944px;background:#F6EEE3;box-shadow:-8px 0 30px rgba(40,28,20,.25)}
.band{position:absolute;transition:filter .2s;left:930px;width:722px;border:0;border-radius:0;display:grid;grid-template-columns:150px 215px 1fr;align-items:center;gap:14px;padding:0 16px;text-align:left}
.band .nm{display:flex;flex-direction:column;gap:2px;cursor:pointer}
.band .ss2{font-size:12.5px;line-height:1.55}
.band .ss2 b{font-weight:700;margin-right:6px}
.tk{display:flex;flex-wrap:wrap;gap:5px}
.tk .chk{width:auto;min-height:26px;font-size:12px;padding:0 9px;gap:6px;background:rgba(255,255,255,.75)}
.tk .chk i{width:12px;height:12px;border-radius:4px}
.side{position:absolute;font-size:12px;letter-spacing:.2em;color:#8A6E4B;writing-mode:vertical-rl}
#stage>svg{position:absolute;inset:0}
button{font:inherit;cursor:pointer}
.serif{font-family:"Songti TC","Noto Serif TC",serif;font-weight:700}
.rl{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:999px;padding:3px 11px;font-size:13px;letter-spacing:.15em;white-space:nowrap;background:rgba(255,250,244,.88);color:#5A4228;box-shadow:0 1px 6px rgba(60,40,20,.15)}
.rl.focus{background:#3A2A24;color:#FFE7C2;box-shadow:0 0 0 2px #E2B867,0 0 16px rgba(226,184,103,.8)}
.card{position:absolute;width:318px;height:300px;border-radius:16px;background:rgba(255,250,244,.94);box-shadow:0 4px 16px rgba(40,28,20,.14);padding:11px 13px;display:flex;flex-direction:column;gap:5px;border:1.5px solid transparent}
.card.focus{border-color:#E2B867;box-shadow:0 0 0 3px rgba(226,184,103,.35),0 4px 16px rgba(40,28,20,.14)}
.head{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px}
.num{width:24px;height:24px;border-radius:50%;background:#B8893A;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.more{margin-left:auto;font-size:12px;color:#8A6E4B}
.ss{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;font-size:12px;line-height:1.5;padding:5px 8px;border-radius:8px;background:#F4EBDF}
.ss b{color:#8A6E4B}.ss b.x{color:#8E2B2B}
.chk{display:flex;align-items:center;gap:8px;min-height:27px;padding:0 8px;border-radius:8px;border:1px solid #EADCCB;background:#fff;color:#2E2420;text-align:left;width:100%;font-size:13px}
.chk.on{border-color:#C98E80;background:#F7ECE4;color:#7A5A48;text-decoration:line-through}
.chk i{width:15px;height:15px;border-radius:5px;border:2px solid #C9B6A4;flex-shrink:0}
.chk.on i{background:#8E2B2B;border-color:#8E2B2B}
.chk em{margin-left:auto;font-style:normal;font-size:10.5px;color:#8A6E4B;background:#F3EADF;border-radius:999px;padding:1px 7px;text-decoration:none}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.go{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;border:1px solid #CDB8A4;background:#fff;color:#3A2A24;text-decoration:none;font-size:12px}
.strip{position:absolute;left:50%;transform:translateX(-50%);border-radius:999px;background:rgba(40,28,22,.84);color:#FFF6EC;padding:8px 20px;display:flex;align-items:center;gap:16px;white-space:nowrap;font-size:13px}
#detail{position:absolute;inset:0;background:rgba(30,20,14,.35);display:none;align-items:center;justify-content:center}
#detail.on{display:flex}
#dbox{width:620px;max-height:820px;overflow:auto;border-radius:22px;background:#FFFAF4;padding:26px 28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 40px rgba(30,20,14,.3)}
.back{position:fixed;left:14px;top:calc(env(safe-area-inset-top) + 12px);z-index:5;border:1px solid rgba(244,238,230,.3);background:rgba(28,24,20,.72);color:#F4EEE6;border-radius:999px;padding:8px 14px;font-size:13px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
</style></head><body>

 {k:"dress",why:"每天把底子拿出來給人看。化妝只做四件事：整理膚色、重建立體、強化五官、設一個焦點。",n:"修飾",sub:"妝、髮型、穿搭",soft:"邊界暈開、蓬鬆、柔軟的布料",sexy:"一個焦點、露一個點、看得到腰線",
  tasks:[["托盤妝","每天"],["練一種妝或一種編髮","每週"],["週日排好下週穿搭","每週"],["整理五件衣服或化妝品","每月"]],links:[["妝台",E+"vanity/"],["衣櫥",E+"wardrobe/"]]},
 {k:"style",why:"別人看到、聽到、聞到的你。三殿決定今天開多大聲，聲音和香味也是你的一部分。",n:"風格",sub:"三殿、聲音、香味、別人感受到的你",soft:"溫柔、語速慢、皮膚感的香味",sexy:"一個暖色重點、靠近才聞得到的香",
  tasks:[["拍一張這一季的我","每季"],["找一支招牌香味","每季"],["換季整理衣櫥","每季"]],links:[["衣櫥・三殿",E+"wardrobe/"]]}
];
const KEY="origina-venus-v1";
let S={focus:"dress",done:{}};
try{const o=JSON.parse(localStorage.getItem(KEY)||"null");if(o)S=Object.assign(S,{focus:o.focus||S.focus,done:o.done||{}});}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=id=>document.getElementById(id);
function period(p){const d=new Date();const y=d.getFullYear(),m=d.getMonth()+1;
  if(p==="每天")return d.toLocaleDateString("sv");
  if(p==="每週"){const t=new Date(d);t.setDate(d.getDate()-((d.getDay()+6)%7));return "W"+t.toLocaleDateString("sv");}
  if(p==="每月")return y+"-"+m;return y+"-Q"+Math.ceil(m/3);}
function rad(i){const rx=62+i*66;return [rx,rx*.87];}
const COL=["#6E3632","#8E4E40","#AE7552","#C69E76","#DCC3A0","#EDE0CB"];
const BT=78,BH=128;
const IC=[
 '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
 '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
 '<circle cx="12" cy="5" r="2.2"/><path d="M12 8v7M8 10.5h8M12 15l-3 6M12 15l3 6"/>',
 '<path d="M7 4c-2 3-2 9 0 12 2 3 8 3 10 0 2-3 2-9 0-12"/><path d="M9 11h.01M15 11h.01M10 15h4"/>',
 '<rect x="9" y="11" width="6" height="10" rx="1"/><path d="M10 11V6l4-2v7"/>',
 '<path d="M12 3l2.2 6.2L20 12l-5.8 2.8L12 21l-2.2-6.2L4 12l5.8-2.8z"/>'];
function icon(i,c,sz){return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${IC[i]}</svg>`;}
function bandY(i){return BT+(5-i)*BH;}
function items(r){return r.tasks.map(([t,p],j)=>{const key=r.k+j+"@"+period(p);return {t,p,key,on:!!S.done[key]};});}
function toggle(key){if(S.done[key])delete S.done[key];else S.done[key]=1;save();render();}
function taskHTML(r){return items(r).map(it=>`<button class="chk${it.on?" on":""}" data-key="${it.key}"><i></i><span>${it.t}</span><em>${it.p}</em></button>`).join("");}

  let tot=0,dn=0,html="",badges="";
  R.forEach((r,i)=>{const [rx,ry]=rad(i);const f=S.focus===r.k;const its=items(r);const d=its.filter(x=>x.on).length;const q=its.length?d/its.length:0;tot+=its.length;dn+=d;
    const [ix,iy]=i?rad(i-1):[0,0];
    svg+=`<path class="ann" data-i="${i}" data-open="${r.k}" fill-rule="evenodd" fill="${COL[i]}" fill-opacity="${.34+q*.3}" data-base="${.34+q*.3}" style="cursor:pointer" d="M ${CX-rx} ${CY} a ${rx} ${ry} 0 1 0 ${2*rx} 0 a ${rx} ${ry} 0 1 0 ${-2*rx} 0 ${i?`M ${CX-ix} ${CY} a ${ix} ${iy} 0 1 0 ${2*ix} 0 a ${ix} ${iy} 0 1 0 ${-2*ix} 0`:""}"/>`;
    if(q>0)svg+=`<ellipse cx="${CX}" cy="${CY}" rx="${rx}" ry="${ry}" fill="none" stroke="#FFD58A" stroke-width="${4+q*10}" opacity="${.25+q*.55}" filter="url(#glow)"/>`;
    svg+=`<ellipse cx="${CX}" cy="${CY}" rx="${rx}" ry="${ry}" fill="none" stroke="${q>=1?"#E9A83A":"#9A6E2E"}" stroke-width="${2+q*2.4+(f?1:0)}" opacity="${.75+q*.25}" ${f?'stroke-dasharray="10 6"':''}/>`;
    // 字沿著漣漪寫（上半圈）
    const tr=rx-26,ty=ry-26;
    svg+=`<path id="arc${i}" d="M ${CX-tr} ${CY} A ${tr} ${ty} 0 0 1 ${CX+tr} ${CY}" fill="none"/>`;
    if(i>0)svg+=`<text font-size="${i<2?14:15}" letter-spacing="3" fill="#4A3424" style="pointer-events:none;font-family:'Songti TC','Noto Serif TC',serif;font-weight:700;paint-order:stroke" stroke="rgba(255,250,240,.75)" stroke-width="4"><textPath href="#arc${i}" startOffset="50%" text-anchor="middle">${r.n}${i>1?"・"+r.sub.split("、").slice(0,3).join(" "):""}</textPath></text>`;
    // 切線上的點 → 剖面那一層
    const px=CX+rx,py=CY,by=bandY(i)+BH/2;
    svg+=`<path style="pointer-events:none" d="M ${px} ${py} C ${px+60} ${py}, 860 ${by}, 930 ${by}" fill="none" stroke="${f?"#E2B867":"#B8893A"}" stroke-width="${f?2.2:1.2}" opacity=".85"/>`;
    badges+=`<g style="pointer-events:none"><circle cx="${px-ix?px-(rx-ix)/2:px}" cy="${py}" r="11" fill="${COL[i]}" stroke="#fff" stroke-width="1.5"/><text x="${px-ix?px-(rx-ix)/2:px}" y="${py+4.5}" text-anchor="middle" font-size="12" font-weight="700" fill="${i<3?"#fff":"#3A2A24"}">${i+1}</text></g>`;
    const dark=i<3,ink=dark?"#FFF3E6":"#3A2A24",sub=dark?"rgba(255,243,230,.75)":"#6A5246";
    html+=`<div class="band" data-i="${i}" style="top:${bandY(i)}px;height:${BH}px;background:${COL[i]};color:${ink};${f?"box-shadow:inset 0 0 0 3px #E2B867;":""}">
      <div class="nm" data-open="${r.k}"><span style="font-size:12px;letter-spacing:.2em;color:${sub}">第 ${i+1} 層　${d}/${its.length}</span><span style="display:flex;align-items:center;gap:8px">${icon(i,ink,28)}<span class="serif" style="font-size:30px;line-height:1.1">${r.n}</span></span><span style="font-size:12px;color:${sub}">${r.sub}</span><span style="font-size:12px;color:${dark?"#FFD58A":"#8A6E4B"}">詳細 ›</span></div>

      <div class="tk">${taskHTML(r)}</div><div style="position:absolute;left:0;bottom:0;height:5px;width:${q*100}%;background:#FFD58A;transition:width .4s"></div></div>`;

  svg+=`<text x="${CX+mx+16}" y="${CY-10}" font-size="13" fill="#8E2B2B" text-anchor="end" letter-spacing="2">✂ 從中心切開</text>`;

  $("svg").innerHTML=svg;
  html+=`<div style="position:absolute;left:930px;top:22px;width:722px;display:flex;align-items:baseline;gap:14px;color:#3A2A24"><span class="serif" style="font-size:22px;letter-spacing:4px">剖面</span><span style="font-size:13px;color:#6A5246">把水盆切開，就是六層由內到外。越下面越根本、越慢；越上面越快、越容易換。</span></div>

  $("labels").innerHTML=html;
  const f=R.find(r=>r.k===S.focus);$("focusName").textContent=f.n+"・"+f.sub;
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openD(b.dataset.open));

  document.querySelectorAll(".band").forEach(b=>{const i=b.dataset.i;b.onmouseenter=()=>hl(i);b.onmouseleave=()=>hl(null);});
  document.querySelectorAll(".ann").forEach(a=>{a.onmouseenter=()=>hl(a.dataset.i);a.onmouseleave=()=>hl(null);});

function hl(i){document.querySelectorAll(".ann").forEach(a=>a.setAttribute("fill-opacity",a.dataset.i===i?.7:a.dataset.base));
  document.querySelectorAll(".band").forEach(b=>b.style.filter=i!=null&&b.dataset.i!==i?"saturate(.5) opacity(.55)":"");}
let cur=null;
function openD(k){cur=k;const r=R.find(x=>x.k===k),i=R.indexOf(r);

    <div class="links">${r.links.map(([t,u])=>`<a class="go" style="min-height:38px;font-size:14px" href="${u}">${t} →</a>`).join("")}</div>
    <button id="f" style="min-height:46px;border-radius:12px;border:0;background:${S.focus===r.k?"#E9D9BE":"#3A2A24"};color:${S.focus===r.k?"#5A4228":"#FFF6EC"};font-size:15px">${S.focus===r.k?"這是這個月的重點":"設成這個月的重點"}</button>`;
  $("detail").classList.add("on");
  $("x").onclick=()=>{cur=null;$("detail").classList.remove("on");};
  $("f").onclick=()=>{S.focus=r.k;save();render();};
  $("dbox").querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>toggle(b.dataset.key));

$("detail").addEventListener("click",e=>{if(e.target.id==="detail"){cur=null;$("detail").classList.remove("on");}});
function fit(){const s=Math.min(innerWidth/1680,innerHeight/944);$("stage").style.transform=`scale(${s})`;$("sizer").style.width=1680*s+"px";$("sizer").style.height=944*s+"px";}
addEventListener("resize",fit);render();fit();
$("back").onclick=()=>{location.href="../scenes/?s=beauty";};
</script>
</body></html>
