<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3EADF">
<title>底妝筆記・琳琳</title>
<link rel="apple-touch-icon" href="../venus/icon-180.png"><link rel="icon" href="../venus/icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#F1E7DA;color:#3A2A24;font-family:"PingFang TC","Noto Sans TC",system-ui,sans-serif;overflow:hidden}
#view{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#sizer{position:relative;flex-shrink:0}
#stage{position:absolute;left:0;top:0;width:1680px;height:944px;transform-origin:0 0;overflow:hidden;background:#F3EADF}
.serif{font-family:"Songti TC","Noto Serif TC",serif;font-weight:700}
.back{position:fixed;left:14px;top:calc(env(safe-area-inset-top) + 12px);z-index:5;border:1px solid rgba(244,238,230,.3);background:rgba(28,24,20,.72);color:#F4EEE6;border-radius:999px;padding:8px 14px;font-size:13px;text-decoration:none}
#face{position:absolute;left:0;top:0;width:640px;height:944px}
.hd{position:absolute;left:680px;top:26px;right:30px;display:flex;align-items:center;gap:22px}
.hd h1{margin:0;font:700 40px "Songti TC","Noto Serif TC",serif;letter-spacing:.06em;white-space:nowrap}
.hd .k{display:flex;gap:10px}
.hd .k span{background:#FFFBF6;border-radius:999px;padding:7px 16px;font:700 17px "Songti TC",serif;color:#8E2B2B;box-shadow:0 3px 10px rgba(60,40,20,.07)}
.lead{position:absolute;left:680px;top:88px;right:30px;font-size:15.5px;color:#6A5246}
.lead b{color:#8E2B2B}
.grp{position:absolute;left:680px;right:30px}
.gt{font:700 18px "Songti TC",serif;color:#8A6E4B;letter-spacing:.3em;margin:0 0 8px 4px}
.gt small{font:400 13px "PingFang TC",sans-serif;letter-spacing:0;margin-left:10px;color:#A0805A}
.cards{display:grid;gap:12px}
.cd{all:unset;cursor:pointer;box-sizing:border-box;background:#FFFBF6;border-radius:20px;padding:14px 16px;box-shadow:0 5px 18px rgba(60,40,20,.07);border:2px solid transparent;display:flex;flex-direction:column;gap:6px;min-height:118px}
.cd.on{border-color:#E2B867;background:#FFF6E8}
.cd.dim{opacity:.5}
.cd h3{margin:0;display:flex;align-items:center;gap:10px;font:700 21px "Songti TC","Noto Serif TC",serif}
.cd h3 i{font-style:normal;width:30px;height:30px;border-radius:50%;background:#3A2A24;color:#FFF4E6;font:700 15px sans-serif;display:grid;place-items:center;flex:none}
.cd h3 em{font-style:normal;margin-left:auto;font:600 12.5px "PingFang TC",sans-serif;color:#8A5A20;background:#FFF1DC;border-radius:999px;padding:3px 10px}
.cd p{margin:0;font-size:16px;line-height:1.6;color:#3A2A24}
.cd .ck{font-size:14px;color:#8E2B2B;font-weight:600}
.cd .more{font-size:14px;line-height:1.65;color:#5A4228;border-top:1px dashed #E2D3C2;padding-top:8px;margin-top:2px}
.cd .more b{color:#8E2B2B}
.ft{position:absolute;left:680px;right:30px;bottom:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ft div{background:#FFFBF6;border-radius:14px;padding:9px 12px;font-size:13.5px;line-height:1.5;box-shadow:0 3px 10px rgba(60,40,20,.05)}
.ft b{color:#8E2B2B;display:block;font-size:14px}

/* 窄螢幕（直放、分割畫面）：臉在上、卡片在下，可以往下滑 */
html:has(body.narrow),body.narrow{overflow:auto;height:auto}
body.narrow #view{position:static;display:block}
body.narrow #sizer{width:auto!important;height:auto!important}
body.narrow #stage{position:static;width:auto;height:auto;transform:none!important;overflow:visible;padding:calc(env(safe-area-inset-top) + 60px) 16px 30px}
body.narrow #face{position:static;display:block;width:100%;height:auto;aspect-ratio:430/560;max-height:62vh;border-radius:22px;margin:0 auto 16px}
body.narrow .hd,body.narrow .lead,body.narrow .grp,body.narrow .ft{position:static;top:auto!important}
body.narrow .hd{flex-wrap:wrap;gap:10px}
body.narrow .hd h1{font-size:32px}
body.narrow .hd .k span{font-size:15px;padding:6px 12px}
body.narrow .lead{margin:8px 0 16px;font-size:15px}
body.narrow .grp{margin-bottom:16px}
body.narrow .cards{grid-template-columns:1fr!important}
body.narrow .ft{grid-template-columns:1fr 1fr;margin-top:6px}
body.narrow #face.stick{position:sticky;top:8px;z-index:2;max-height:38vh;box-shadow:0 8px 24px rgba(40,20,10,.2)}
</style></head><body>
<a class="back" id="back" href="../venus/">← 維納斯的桌子</a>
<div id="view"><div id="sizer"><div id="stage">
  <svg id="face" viewBox="640 140 430 630" preserveAspectRatio="xMidYMid slice" aria-label="底妝步驟畫在臉上"></svg>
  <div class="hd"><h1>不卡粉的底妝</h1><div class="k"><span>皮膚先軟</span><span>出油先控</span><span>粉底要薄</span></div></div>
  <div class="lead">卡粉、浮粉、脫妝，<b>不是粉底不好</b>，是皮膚還沒準備好，加上粉底上得太厚。點一張卡，左邊只看那一步。</div>
  <div class="grp" style="top:130px"><div class="gt">妝前<small>最重要，不能急</small></div><div class="cards" id="g0" style="grid-template-columns:repeat(3,1fr)"></div></div>
  <div class="grp" id="gp1"><div class="gt">上粉底<small>薄、貼、往上</small></div><div class="cards" id="g1" style="grid-template-columns:1fr 2fr"></div></div>
  <div class="grp" id="gp2"><div class="gt">定妝<small>壓實，不是蓋粉</small></div><div class="cards" id="g2" style="grid-template-columns:1fr"></div></div>
  <div class="ft">
    <div><b>✕ 擦完馬上上妝</b>沒有白印子才開始</div>
    <div><b>✕ 用粉撲拍粉底</b>粉撲吸粉，改用刷子刷薄</div>
    <div><b>✕ 全臉一樣厚</b>中間有，越往外越薄</div>
    <div><b>✕ 卡粉就怪粉底</b>先查死皮、水分、油</div>
  </div>
</div></div></div>
<script>
const ST=[
 {g:0,t:"軟化死皮",tag:"鼻翼・嘴周",s:"乳液厚敷鼻翼、嘴周，往上推，用濕洗臉巾擦掉",ck:"",more:"死皮軟了，定妝才不會爆皮、卡粉；不擦掉，鼻子會滑、會脫妝。",
  d:`<ellipse cx="855" cy="500" rx="58" ry="40" fill="#FFE7A8" fill-opacity=".6" filter="url(#sf)"/><ellipse cx="855" cy="625" rx="85" ry="50" fill="#FFE7A8" fill-opacity=".5" filter="url(#sf)"/><path d="M820 560 L800 520 M890 560 L910 520" stroke="#fff" stroke-width="5" marker-end="url(#ar)"/>`,p:[855,500]},
 {g:0,t:"補水＋防曬",tag:"平推不拍",s:"掌心揉薄，輕輕平推；防曬順一個方向，眼周也擦",ck:"手指按，沒有白印子才下一步",more:"越拍越乾。乾的地方再加一點乳液。<b>等它吸收，就是我的三分鐘。</b>",
  d:`<path d="M720 480 Q760 440 800 470" stroke="#fff" stroke-width="5" fill="none" marker-end="url(#ar)"/><path d="M990 480 Q950 440 910 470" stroke="#fff" stroke-width="5" fill="none" marker-end="url(#ar)"/><path d="M800 300 L910 300" stroke="#fff" stroke-width="5" marker-end="url(#ar)"/><circle cx="760" cy="410" r="40" fill="none" stroke="#FFE7A8" stroke-width="3" stroke-dasharray="4 6"/><circle cx="950" cy="410" r="40" fill="none" stroke="#FFE7A8" stroke-width="3" stroke-dasharray="4 6"/>`,p:[720,470]},
 {g:0,t:"局部控油",tag:"只擦出油處",s:"鼻子、額頭、面中，薄薄打圈推開",ck:"",more:"油會反光、放大瑕疵，粉底會氧化變暗、脫妝。",
  d:`<path d="M790 300 H920 M855 300 V520" stroke="#9FD3E8" stroke-width="44" stroke-opacity=".4" stroke-linecap="round" fill="none"/>`,p:[920,300]},
 {g:1,t:"先調粉底",tag:"手背上",s:"粉底液＋兩下定妝噴霧揉勻；油皮加一點散粉",ck:"推不開就加一點防曬",more:"",
  d:`<g transform="translate(985 690)"><ellipse rx="44" ry="26" fill="#E8C4A0" stroke="#fff" stroke-width="3"/><circle cx="34" cy="-40" r="5" fill="#9FD3E8"/><circle cx="46" cy="-52" r="4" fill="#9FD3E8"/></g>`,p:[985,690]},
 {g:1,t:"用刷子刷薄",tag:"薄的扁平刷",s:"刷子立起來，從臉頰斜往下，先刷外圍；毛孔、嘴角往上刷",ck:"有刷痕：刷子貼著皮膚刮一下",more:"另一手把皮膚繃緊再刷。眼皮、額頭來回輕輕帶過。鼻子：手指先揉，再用刷子往上刷掉多的。<b>粉撲會吸走粉底，臉上反而不遮瑕。</b>",
  d:`<path d="M730 430 L700 520" stroke="#fff" stroke-width="5" marker-end="url(#ar)"/><path d="M980 430 L1010 520" stroke="#fff" stroke-width="5" marker-end="url(#ar)"/><path d="M800 560 L780 510" stroke="#FFE7A8" stroke-width="5" marker-end="url(#ar2)"/><path d="M910 560 L930 510" stroke="#FFE7A8" stroke-width="5" marker-end="url(#ar2)"/><path d="M820 300 h70" stroke="#fff" stroke-width="4" stroke-dasharray="6 6"/>`,p:[700,520]},
 {g:2,t:"濕粉撲壓實",tag:"垂直點壓",s:"乾粉撲噴三下定妝噴霧，沾一點剩的粉底，有斑、泛紅的地方多拍；手放平微彎，垂直輕輕點壓",ck:"",more:"把刷痕壓實，粉底黏住皮膚，一整天不脫妝。",
  d:`<g transform="translate(950 470)"><ellipse rx="50" ry="32" fill="#F7D7C7" fill-opacity=".85" stroke="#fff" stroke-width="3"/><path d="M0 -72 v30" stroke="#fff" stroke-width="5" marker-end="url(#ar)"/></g>`,p:[950,470]}];
let sel=null;
const $=id=>document.getElementById(id);
function render(){
  let g=`<defs><marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fff"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FFE7A8"/></marker><filter id="sf"><feGaussianBlur stdDeviation="6"/></filter></defs><image href="face.webp" x="0" y="0" width="1680" height="944"/>`;
  ST.forEach((s,i)=>{if(sel===i)g+=`<g>${s.d}</g>`;});
  ST.forEach((s,i)=>{if(sel===null||sel===i)g+=`<g><circle cx="${s.p[0]}" cy="${s.p[1]}" r="15" fill="#3A2A24" stroke="#fff" stroke-width="3"/><text x="${s.p[0]}" y="${s.p[1]+5.5}" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" font-family="sans-serif">${i+1}</text></g>`;});
  $("face").innerHTML=g;
  [0,1,2].forEach(k=>$("g"+k).innerHTML=ST.map((s,i)=>s.g!==k?"":`<button class="cd${sel===i?" on":""}${sel!==null&&sel!==i?" dim":""}" data-i="${i}"><h3><i>${i+1}</i>${s.t}<em>${s.tag}</em></h3><p>${s.s}</p>${s.ck?`<p class="ck">檢查：${s.ck}</p>`:""}${sel===i&&s.more?`<div class="more">${s.more}</div>`:""}</button>`).join(""));
  const h0=$("g0").parentNode.getBoundingClientRect(),sc=h0.height/ (parseFloat(getComputedStyle($("stage")).transform.split(",")[3])||1);
  layout();
  document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;sel=sel===i?null:i;render();});
  $("face").classList.toggle("stick",document.body.classList.contains("narrow")&&sel!==null);
}
function layout(){if(document.body.classList.contains("narrow")){["gp1","gp2"].forEach(i=>$(i).style.top="");return;}const p0=$("g0").parentNode,p1=$("gp1"),p2=$("gp2");const t0=130+p0.offsetHeight+14;p1.style.top=t0+"px";p2.style.top=(t0+p1.offsetHeight+14)+"px";}
function fit(){const nar=innerWidth/innerHeight<1.25||innerWidth<760;document.body.classList.toggle("narrow",nar);if(nar){layout();return;}const s=Math.min(innerWidth/1680,innerHeight/944);$("stage").style.transform=`scale(${s})`;$("sizer").style.width=1680*s+"px";$("sizer").style.height=944*s+"px";}
addEventListener("resize",fit);render();fit();
if(document.referrer.includes("/vanity/")&&!document.referrer.includes("base")){const b=$("back");b.href="./";b.textContent="← 妝台";}
</script>
</body></html>
