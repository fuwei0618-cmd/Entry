<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1814">
<title>Origina 場景</title>
<style>
:root{--ink:#F4EEE6;--glass:rgba(28,24,20,.58);--line:rgba(244,238,230,.3);--gold:#E2C188}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1c1814;color:var(--ink);font-family:"PingFang TC","Noto Sans TC",system-ui,sans-serif;overflow:hidden}
#bg{position:fixed;inset:-40px;background-size:cover;background-position:center;filter:blur(30px) brightness(.55);transform:scale(1.1);transition:background-image .4s}
#view{position:fixed;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#view::-webkit-scrollbar{display:none}
#stage{position:relative;height:100%;aspect-ratio:16/9;margin:0 auto}
@media (min-aspect-ratio:16/9){#stage{height:auto;width:100%;top:50%;transform:translateY(-50%)}}
#stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s}
#stage img.on{opacity:1}
.hot{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font:inherit}
.hot i{width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(255,255,255,.25);box-shadow:0 0 0 0 rgba(255,255,255,.6);animation:pulse 2.4s infinite}
.hot span{background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:5px 11px;border-radius:999px;font-size:13px;letter-spacing:.06em;white-space:nowrap;border:1px solid var(--line)}
.hot.door i{width:28px;height:28px;border-color:var(--gold);background:rgba(226,193,136,.3)}
.hot.door span{border-color:var(--gold)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}70%{box-shadow:0 0 0 14px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;display:flex;align-items:center;gap:10px;pointer-events:none;background:linear-gradient(rgba(0,0,0,.35),transparent)}
.top *{pointer-events:auto}
.top button{border:1px solid var(--line);background:var(--glass);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.top h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.1em;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.top small{display:block;font-size:11px;font-weight:400;opacity:.8;letter-spacing:.04em}
#chips{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 12px}
#chips button{border:1px solid var(--line);background:var(--glass);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#chips button.door{border-color:var(--gold)}
#pan{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 64px);transform:translateX(-50%);background:var(--glass);border-radius:999px;padding:6px 14px;font-size:12px;opacity:.85;pointer-events:none;transition:opacity .6s}
#sheet{position:fixed;left:0;right:0;bottom:0;transform:translateY(105%);transition:transform .3s;background:rgba(32,27,22,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px 22px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 22px);max-width:560px;margin:0 auto;border:1px solid var(--line);border-bottom:0}
#sheet.on{transform:none}
#sheet .tag{font-size:12px;letter-spacing:.14em;color:var(--gold)}
#sheet h2{margin:4px 0 8px;font-size:21px;letter-spacing:.06em}
#sheet p{margin:0 0 14px;line-height:1.7;font-size:14px;opacity:.9}
#sheet .row{display:flex;gap:8px;flex-wrap:wrap}
#sheet .row a,#sheet .row button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:10px 16px;font:inherit;font-size:14px;text-decoration:none}
#sheet .row .pri{background:var(--ink);color:#2a231d;border-color:var(--ink)}
#sheet .row .off{opacity:.5}
</style></head><body>
<div id="bg"></div>
<div id="view"><div id="stage"></div></div>
<div class="top"><button id="back">← 返回</button><h1 id="title"></h1></div>
<div id="chips"></div><div id="pan">← 左右滑動看整個房間 →</div>
<div id="sheet" role="dialog" aria-modal="true"><div class="tag" id="sTag"></div><h2 id="sTitle"></h2><p id="sBody"></p><div class="row" id="sRow"></div></div>
<script>
const GH="https://fuwei0618-cmd.github.io/";
/* 每個場景：圖片、熱點（x,y 是圖片寬高的百分比） */
const S={
 beauty:{title:"Beauty",sub:"梳化與保養",img:"img/beauty.webp",fallback:["img/glam.webp","img/spa.webp"],back:null,hots:[
   {x:33,y:50,door:1,label:"梳化間",go:"glam"},
   {x:67,y:52,door:1,label:"保養廠",go:"spa"}]},
 glam:{title:"梳化間",sub:"衣櫥・妝髮・美甲",img:"img/glam.webp",back:"beauty",hots:[
   {x:16,y:36,label:"妝髮",t:"妝髮",b:"髮型、妝容步驟模板：出門前照著做，不用每次重想。",app:null},
   {x:42,y:40,label:"衣櫥",t:"衣櫥",b:"單品與穿搭模板，盡簡衣櫥的概念：少而精，每件都會穿。",app:null},
   {x:46,y:67,label:"行李模板",t:"行李模板",b:"輕／中／重三種行李 × 季節，旅行前一鍵帶出清單。",app:null},
   {x:72,y:83,label:"美甲",t:"美甲",b:"做過的款式、顏色和店家，下次直接指給美甲師看。",app:null},
   {x:80,y:64,label:"回到 Beauty",go:"beauty",door:1}]},
 spa:{title:"保養廠",sub:"醫美・半永久・日常保養",img:"img/spa.webp",back:"beauty",hots:[
   {x:44,y:62,label:"醫美・正顎",t:"醫美療程",b:"療程紀錄、回診時間。正顎手術也在這裡：正顎手冊已經做好，可以直接打開。",app:[["打開正顎手冊",GH+"OGS/"]]},
   {x:66,y:47,label:"半永久",t:"半永久",b:"眉、睫、唇的紀錄和補色時間。",app:null},
   {x:87,y:68,label:"日常保養",t:"日常保養",b:"早晚保養流程、用完要補的瓶瓶罐罐。",app:null},
   {x:20,y:70,label:"回到 Beauty",go:"beauty",door:1}]},
 gym:{title:"健身房",sub:"皮拉提斯・瑜伽・重訓",img:"img/gym.webp",back:null,hots:[
   {x:48,y:70,label:"皮拉提斯",t:"皮拉提斯",b:"你最想堅持到底的一件事。記下每堂課練了什麼、哪裡進步。",app:[["打開紀錄",GH+"Gym/#tab=log"],["今日課表",GH+"Gym/#tab=today"]]},
   {x:18,y:76,label:"伸展・柔軟",t:"伸展與柔軟度",b:"開肩、開髖、一字馬：木頭人偶示範每個動作。",app:[["看動作示範",GH+"Gym/#tab=move"]]},
   {x:60,y:44,label:"體態",t:"鏡子前的體態",b:"身體數據、目標和每天的狀況，看見自己慢慢改變。",app:[["打開身體",GH+"Gym/#tab=body"]]},
   {x:91,y:69,label:"重訓",t:"重訓",b:"每週課表、逐組打勾，組間休息有計時器。",app:[["打開課表",GH+"Gym/#tab=plan"],["計時器",GH+"Gym/#tab=timer"]]}]}
};
const $=s=>document.querySelector(s);
const q=new URLSearchParams(location.search);
let cur=null;const hist=[];
function show(id,push){
  const sc=S[id];if(!sc)return;if(push&&cur)hist.push(cur);cur=id;closeSheet();
  $("#title").innerHTML=`${sc.title}<small>${sc.sub}</small>`;
  const st=$("#stage");st.innerHTML="";
  const img=new Image();img.alt=sc.title;img.onload=()=>img.classList.add("on");
  img.onerror=()=>{ // 主場景圖還沒放上來時：兩扇門左右各半
    if(!sc.fallback)return;img.remove();sc.fallback.forEach((f,i)=>{const h=new Image();h.src=f;h.className="on";h.style.cssText=`left:${i*50}%;width:50%;object-position:${i?"35%":"40%"} center;filter:brightness(.85)`;st.prepend(h);});};
  img.src=sc.img;st.appendChild(img);
  $("#bg").style.backgroundImage=`url(${sc.img.replace(".webp","-s.webp")})`;
  sc.hots.forEach(h=>{const b=document.createElement("button");b.className="hot"+(h.door?" door":"");b.style.left=h.x+"%";b.style.top=h.y+"%";
    b.innerHTML=`<i></i><span>${h.label}</span>`;b.onclick=()=>h.go?show(h.go,true):openSheet(sc,h);st.appendChild(b);});
  const ch=$("#chips");ch.innerHTML="";sc.hots.forEach(h=>{const b=document.createElement("button");if(h.door)b.className="door";b.textContent=h.label;b.onclick=()=>h.go?show(h.go,true):openSheet(sc,h);ch.appendChild(b);});
  const v=$("#view");requestAnimationFrame(()=>{v.scrollLeft=(v.scrollWidth-v.clientWidth)/2;});
  $("#pan").style.opacity=v.scrollWidth>v.clientWidth+4?".85":"0";setTimeout(()=>$("#pan").style.opacity="0",3500);
  $("#back").textContent=hist.length?"← 返回":"← Origina";
  try{history.replaceState(null,"","?s="+id);}catch(e){}
}
function openSheet(sc,h){
  $("#sTag").textContent=sc.title;$("#sTitle").textContent=h.t||h.label;$("#sBody").textContent=h.b||"";
  $("#sRow").innerHTML=(h.app?h.app.map(([t,u],i)=>`<a class="${i?"":"pri"}" href="${u}">${t}</a>`).join(""):`<span class="off" style="padding:10px 0;font-size:13px">這個 App 正在做，之後點這裡就會打開。</span>`)+`<button id="sClose">關閉</button>`;
  $("#sClose").onclick=closeSheet;$("#sheet").classList.add("on");
}
function closeSheet(){$("#sheet").classList.remove("on");}
$("#stage").addEventListener("click",e=>{if(e.target.tagName==="IMG")closeSheet();});
$("#back").onclick=()=>{if(hist.length){const p=hist.pop();show(p,false);return;}
  if(window.top!==window.self){try{window.parent.postMessage({origina:"close-app"},"*");}catch(e){}}
  location.href=GH+"Entry/map/";};
addEventListener("resize",()=>{const v=$("#view");v.scrollLeft=(v.scrollWidth-v.clientWidth)/2;});
show(q.get("s")||"beauty",false);
</script>
</body></html>
