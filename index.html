<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#CFE3D6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Origina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=LXGW+WenKai+TC:wght@400&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: 全螢幕 3D 場景 + 紙片風浮層 UI。場景：森林 → 家 1F → B1 臥室（下沉庭院）→ B2 禱告房；家的後門 → 舞台（獨立空間）。單一淺色紙模型風格。 */
:root{
  --paper:#FFF8EC; --ink:#3E2E24; --muted:#7A6555; --accent:#D9583F;
  --shadow:0 2px 0 rgba(62,46,36,.12),0 8px 18px rgba(62,46,36,.18);
  --f:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-hand:"LXGW WenKai TC","Kaiti TC",serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:#CFE3D6}
body{font-family:var(--f);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.chip{background:var(--paper);border:0;border-radius:12px;box-shadow:var(--shadow);padding:10px 14px}
.hud-tl{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:2px;pointer-events:none}
.hud-tl b{font-size:16px;letter-spacing:.04em}
.hud-tl span{font-size:13px;color:var(--muted)}
.hud-tr{position:fixed;right:16px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:8px}
.hud-tr button{min-height:44px;font-weight:700;font-size:14px}
.prompt{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);min-height:52px;padding:12px 22px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);border-radius:14px;box-shadow:var(--shadow);border:0;white-space:nowrap}
.prompt small{font-weight:500;opacity:.75;font-size:13px}
.hint{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:13px;color:var(--muted);transition:opacity .6s;text-align:center;max-width:calc(100% - 32px);pointer-events:none}
.joy{position:fixed;left:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,248,236,.45);box-shadow:inset 0 0 0 2px rgba(255,248,236,.85);touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--paper);box-shadow:var(--shadow)}
.prompt[hidden],.joy[hidden]{display:none}
.fade{position:fixed;inset:0;background:#2A211B;opacity:0;pointer-events:none;transition:opacity .28s}
.fade.on{opacity:1}
.sheet-bg{position:fixed;inset:0;background:rgba(42,33,27,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{width:min(440px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:22px 22px 18px;display:flex;flex-direction:column;gap:12px}
.sheet .tag{font-size:12px;letter-spacing:.14em;color:var(--muted)}
.sheet h2{margin:0;font-size:22px}
.sheet p{margin:0;line-height:1.7;font-size:15px}
.sheet .quote{font-family:var(--f-hand);font-size:22px;line-height:1.6;padding:6px 0}
.sheet ul{margin:0;padding-left:20px;line-height:1.8;font-size:14px}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;border:0;font-weight:700;font-size:14px;text-decoration:none}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.light{background:#EFE3D0;color:var(--ink)}
.btn.off{background:#EFE3D0;color:var(--muted);cursor:default}
.places{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.places button{text-align:left;padding:10px 12px;border-radius:12px;border:0;background:#F3E8D6;min-height:52px}
.places button b{display:block;font-size:14px}
.places button span{font-size:12px;color:var(--muted)}
.ptabs{display:flex;gap:6px;margin:4px 0 12px}.ptabs button{flex:1;border:0;border-radius:999px;padding:8px 10px;background:#F3E8D6;font-weight:700;color:var(--muted)}.ptabs button[aria-pressed="true"]{background:#3E2E24;color:#FFF8EC}
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 8px}.apps a{display:grid;justify-items:center;gap:6px;text-decoration:none;color:inherit;font-size:12px;text-align:center}.apps i{width:56px;height:56px;border-radius:14px;background:#ECE8E1;display:grid;place-items:center;box-shadow:0 2px 6px rgba(62,46,36,.12)}.apps svg{width:32px;height:32px;fill:#2B2724}
.places h3{grid-column:1/-1;margin:6px 0 0;font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#CFE3D6}

/* overlays: map + in-app viewer */
#worldView{background:#0F1A30;color:#EDE6D6}
#worldView .ovbar{background:#0F1A30;border-color:#24345A}#worldView .ovbar h2{color:#EDE6D6}
#worldView .btn.light{background:#24345A;color:#EDE6D6}
.wbody{flex:1;overflow:auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;align-content:start;max-width:1100px;margin:0 auto;width:100%;box-sizing:border-box}
.wmap{width:100%;aspect-ratio:2/1;max-width:100%}.wmap svg{width:100%;height:100%;display:block}
.wstats{display:flex;gap:10px;flex-wrap:wrap}.wstats div{background:#17254A;border-radius:12px;padding:10px 14px;min-width:84px}.wstats b{display:block;font-size:22px;color:#E8C46A}.wstats span{font-size:12px;color:#A9B3CC}
.wchips{display:flex;flex-wrap:wrap;gap:6px}.wchips span{background:#17254A;border-radius:999px;padding:5px 10px;font-size:13px}
.wnote{font-size:12px;color:#A9B3CC;margin:0}
.ov{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column}
.ov[hidden]{display:none}
.ovbar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;border-bottom:1px solid #EADBC4;background:var(--paper)}
.ovbar h2{flex:1;margin:0;font-size:17px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovbar .btn{min-height:38px;padding:8px 14px;font-size:14px}
.ovbody{flex:1;overflow:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px))}
#appView iframe{flex:1;width:100%;border:0;background:#fff}
#appView.panel{background:rgba(40,32,26,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));align-items:center}
#appView.panel>.ovbar,#appView.panel>iframe{width:100%;max-width:900px}
#appView.panel>.ovbar{border-radius:18px 18px 0 0;padding-top:10px;box-sizing:border-box}
#appView.panel>iframe{border-radius:0 0 18px 18px;box-shadow:0 18px 50px rgba(40,32,26,.3);background:#F4EFE6}
@media (max-width:640px){#appView.panel{padding:calc(8px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px))}}
.mwrap{max-width:980px;margin:0 auto;display:grid;gap:14px}
.mnote{font-size:12px;color:var(--muted);letter-spacing:.06em}
.mapbox{position:relative;width:100%;aspect-ratio:76/80;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(62,46,36,.12)}
.mapbox>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mspot{position:absolute;display:flex;align-items:center;gap:4px;transform:translate(-7px,-50%)}
.mspot.flip{flex-direction:row-reverse;transform:translate(calc(-100% + 7px),-50%)}
.mspot i.dot{width:10px;height:10px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--paper);flex:none}
.mlab{border:0;background:rgba(255,248,236,.94);color:var(--ink);font:700 12px/1 var(--f);padding:6px 8px;border-radius:999px;box-shadow:0 1px 4px rgba(62,46,36,.18);white-space:nowrap;cursor:pointer}
.mlab:hover{background:#fff}
.mapp{width:min(56px,6vw);height:min(56px,6vw);border:0;border-radius:25%;background:#ECE8E1;display:grid;place-items:center;padding:0;box-shadow:0 1px 4px rgba(62,46,36,.2);cursor:pointer;flex:none}
.mapp svg{width:64%;height:64%;fill:#2B2724}
.here{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(255,248,236,.9);pointer-events:none}
.here::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--accent);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(.5);opacity:1}to{transform:scale(1.4);opacity:0}}
.phone-only{display:none}@media (max-width:640px){.phone-only{display:inline}}
.mapscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:16px}
@media (max-width:640px){.mapscroll .mapbox{width:190%;max-width:none;border-radius:0}.mspot .mlab{font-size:11px;padding:5px 7px}.mapscroll .mapp{width:40px;height:40px}.mapscroll{margin-inline:-16px;border-radius:0}}
.insets{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.inset{border-radius:16px;background:#F6EBDA;padding:12px 12px 14px;display:grid;gap:8px}
.inset h3{margin:0;font-size:13px;letter-spacing:.14em;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.inset h3 em{font-style:normal;font-size:11px;color:var(--accent);letter-spacing:.04em}
.inset .mapbox{aspect-ratio:16/9;box-shadow:none;background:transparent}
@media (prefers-reduced-motion:reduce){.here::after{animation:none}}
@media (prefers-reduced-motion:reduce){.fade,.hint{transition:none}}
</style>

<script src="sync/origina-sync.js" data-role="host"></script>

<body>
<canvas id="c" tabindex="0" aria-label="森林之家 3D 場景。點地面行走，拖曳轉動視角。"></canvas>
<div class="hud-tl chip"><b id="appName">Origina</b><span id="where">森林</span></div>
<div class="hud-tr">
  <button class="chip" id="viewBtn" aria-label="切換視角">第三人稱</button>
  <button class="chip" id="menuBtn" aria-label="打開地圖">地圖</button>
</div>
<div class="hint chip" id="hint">點地面走過去 · 拖曳轉動視角 · 電腦可用 WASD 或方向鍵</div>
<button class="prompt" id="prompt" hidden></button>
<div class="joy" id="joy" hidden><i id="knob"></i></div>
<div class="fade" id="fade"></div>
<div id="sheetRoot"></div>
<div id="mapView" class="ov" hidden></div>
<div id="appView" class="ov" hidden></div>
<div id="worldView" class="ov" hidden></div>

<script src="three.min.js"></script>
<script>
(function(){
"use strict";
/* ====== 正式名稱：改名只要改這一行（手機主畫面的名字在 manifest.webmanifest）====== */
const APP_NAME='Origina';
document.title=APP_NAME;document.getElementById('appName').textContent=APP_NAME;
/* Origina · v3：營火與螢火蟲、舞台燈海、白水木移到臥室、流水盆移到禱告房 */
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<div class="err">3D 元件沒有載入成功，請重新整理頁面。</div>');return;}
const R=THREE;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand=rng(20261006);
const sm=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- renderer ---------- */
const canvas=$('#c');
let renderer;
try{renderer=new R.WebGLRenderer({canvas,antialias:true});}
catch(e){document.body.insertAdjacentHTML('beforeend','<div class="err">這台裝置的瀏覽器沒有開啟 3D（WebGL），所以無法顯示森林之家。</div>');return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=R.PCFSoftShadowMap;
const camera=new R.PerspectiveCamera(58,1,0.08,420);
camera.rotation.order='YXZ';
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

const mat=(color,o)=>new R.MeshStandardMaterial(Object.assign({color,roughness:.88,metalness:0,flatShading:true},o||{}));
function mesh(geo,m,x,y,z,parent,cast=true,recv=true){const o=new R.Mesh(geo,m);o.position.set(x||0,y||0,z||0);o.castShadow=cast;o.receiveShadow=recv;if(parent)parent.add(o);return o;}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function makeLabel(text,sub,scale=1){
  const c=document.createElement('canvas');c.width=512;c.height=sub?168:128;const g=c.getContext('2d');
  const w=512,h=c.height;g.fillStyle='rgba(62,46,36,.18)';rr(g,10,14,w-20,h-20,26);g.fill();
  g.fillStyle='#FFF8EC';rr(g,8,6,w-16,h-20,26);g.fill();
  g.fillStyle='#3E2E24';g.textAlign='center';g.textBaseline='middle';
  g.font='700 54px "Noto Sans TC","PingFang TC",sans-serif';g.fillText(text,w/2,sub?60:58);
  if(sub){g.fillStyle='#7A6555';g.font='500 34px "Noto Sans TC","PingFang TC",sans-serif';g.fillText(sub,w/2,118);}
  const t=new R.CanvasTexture(c);t.anisotropy=4;
  const s=new R.Sprite(new R.SpriteMaterial({map:t,depthWrite:false,transparent:true}));
  s.scale.set(3.2*scale,3.2*scale*h/512,1);s.renderOrder=5;return s;
}
function label(scene,text,x,y,z,sub,scale){const l=makeLabel(text,sub,scale);l.position.set(x,y,z);l.userData.text=text;scene.add(l);(scene.userData.labels||(scene.userData.labels=[])).push(l);return l;}
function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new R.CanvasTexture(c);if(rep){t.wrapS=t.wrapT=R.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;}
const planksTex=(r)=>canvasTex(512,512,(g)=>{const cs=['#C9A27A','#BF956C','#D1AC84','#C49C72'];for(let i=0;i<16;i++){g.fillStyle=cs[i%4];g.fillRect(0,i*32,512,32);g.fillStyle='rgba(62,46,36,.18)';g.fillRect(0,i*32+31,512,1);g.fillRect((i*137)%512,i*32,1,32);}},r);
const graniteTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#5E6266';g.fillRect(0,0,w,h);const r2=rng(7);for(let i=0;i<2600;i++){const v=r2();g.fillStyle=v<.45?'rgba(240,240,236,.85)':v<.8?'rgba(30,32,34,.8)':'rgba(150,154,158,.9)';g.fillRect(r2()*w,r2()*h,1+r2()*2.5,1+r2()*2.5);}},[2,1]);


const flameTex=canvasTex(64,128,(g)=>{const gr=g.createRadialGradient(32,92,2,32,80,60);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.35,'rgba(255,255,255,.75)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.beginPath();g.moveTo(32,4);g.bezierCurveTo(46,40,62,70,56,96);g.bezierCurveTo(50,124,14,124,8,96);g.bezierCurveTo(2,70,18,40,32,4);g.fill();});
const glowTex=canvasTex(64,64,(g)=>{const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.25,'rgba(255,255,255,.85)');gr.addColorStop(.6,'rgba(255,255,255,.18)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);});
function seg(parent,a,b,r0,r1,m){const d=new R.Vector3().subVectors(b,a),L=d.length();const o=new R.Mesh(new R.CylinderGeometry(r1,r0,L,7),m);o.position.copy(a).addScaledVector(d,.5);o.quaternion.setFromUnitVectors(new R.Vector3(0,1,0),d.clone().normalize());o.castShadow=true;o.receiveShadow=true;parent.add(o);return o;}
const leafGeo=(()=>{const sh=new R.Shape();sh.moveTo(0,0);sh.bezierCurveTo(.09,.05,.14,.22,.085,.34);sh.bezierCurveTo(.05,.395,-.05,.395,-.085,.34);sh.bezierCurveTo(-.14,.22,-.09,.05,0,0);
  const g=new R.ShapeGeometry(sh,8);const p=g.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i);p.setZ(i,4*x*x-.25*y*y);}g.computeVertexNormals();return g;})();
/* 白水木：灰白枝幹、枝頭一圈圈銀綠色的葉子、捲曲的小白花 */
function makeHeliotrope(parent,x,z,sc=1){
  const G=new R.Group();G.position.set(x,0,z);G.scale.setScalar(sc);parent.add(G);
  const pot=new R.Mesh(new R.LatheGeometry([new R.Vector2(.001,0),new R.Vector2(.19,0),new R.Vector2(.22,.03),new R.Vector2(.26,.36),new R.Vector2(.29,.40),new R.Vector2(.285,.43),new R.Vector2(.255,.43),new R.Vector2(.245,.39)],32),
    new R.MeshStandardMaterial({color:0xEDE7DC,roughness:.55}));pot.castShadow=pot.receiveShadow=true;G.add(pot);
  const band=new R.Mesh(new R.CylinderGeometry(.268,.262,.04,32,1,true),new R.MeshStandardMaterial({color:0xB9A58C,roughness:.6}));band.position.y=.3;G.add(band);
  const soil=new R.Mesh(new R.CircleGeometry(.245,24),new R.MeshStandardMaterial({color:0x5A4434,roughness:1}));soil.rotation.x=-Math.PI/2;soil.position.y=.395;G.add(soil);
  const bark=new R.MeshStandardMaterial({color:0x9A8E80,roughness:.9});
  const V=(a,b,c)=>new R.Vector3(a,b,c);
  const base=V(0,.39,0),k1=V(.03,.78,.01);
  seg(G,base,k1,.055,.042,bark);
  const tips=[[V(-.16,1.02,.05),V(-.3,1.22,.09)],[V(.15,.98,-.05),V(.31,1.17,-.1)],[V(.02,1.08,.1),V(.06,1.4,.16)],[V(.1,.9,.15),V(.21,1.03,.27)],[V(-.05,.98,-.14),V(-.1,1.16,-.27)]];
  const leafA=new R.MeshStandardMaterial({color:0xA6B9A4,roughness:.85,side:R.DoubleSide}),leafB=new R.MeshStandardMaterial({color:0xC2D0BE,roughness:.85,side:R.DoubleSide}),flower=new R.MeshStandardMaterial({color:0xFBF8F0,roughness:.7});
  tips.forEach(([mid,tip],ti)=>{seg(G,k1,mid,.036,.026,bark);seg(G,mid,tip,.026,.016,bark);
    const n=10+(ti%2);
    for(let k=0;k<n;k++){const a=k/n*Math.PI*2+ti,el=.35+((k*7)%5)*.09,ls=.82+((k*3)%4)*.1;
      const holder=new R.Group();holder.position.copy(tip);holder.rotation.y=a;G.add(holder);
      const l=new R.Mesh(leafGeo,k%2?leafA:leafB);l.scale.setScalar(ls);l.rotation.x=-(Math.PI/2-el)*.95;l.castShadow=true;holder.add(l);}
    if(ti===0||ti===2){for(let j=0;j<9;j++){const a=j*.42,r=.05+j*.006;const f=new R.Mesh(new R.SphereGeometry(.014,6,4),flower);f.position.set(tip.x+Math.cos(a)*r,tip.y+.1+j*.006,tip.z+Math.sin(a)*r);G.add(f);}}
  });
  return G;
}
/* 轉運流水盆：花崗岩雙層盆、上層流水、橘色轉運球、金魚 */
function makeFountain(parent,x,z){

function heightAt(x,z){
  const r=Math.hypot(x,z-18);

/* ---------- movement ---------- */
function resolve(p){
  for(const c of cur.col){
    if(c.r!==undefined){const dx=p.x-c.x,dz=p.z-c.z,d=Math.hypot(dx,dz),m=c.r+.32;if(d<m&&d>1e-4){p.x=c.x+dx/d*m;p.z=c.z+dz/d*m;}}
    else{const m=.32;if(p.x>c.x0-m&&p.x<c.x1+m&&p.z>c.z0-m&&p.z<c.z1+m){const pen=[p.x-(c.x0-m),(c.x1+m)-p.x,p.z-(c.z0-m),(c.z1+m)-p.z];const i=pen.indexOf(Math.min(...pen));
      if(i===0)p.x=c.x0-m;else if(i===1)p.x=c.x1+m;else if(i===2)p.z=c.z0-m;else p.z=c.z1+m;}}
  }
  if(cur.bounds){const[a,b,c,d]=cur.bounds;p.x=clamp(p.x,a,b);p.z=clamp(p.z,c,d);}
  else{const r=Math.hypot(p.x,p.z);if(r>58){p.x*=58/r;p.z*=58/r;}}
}
function step(dt){
  let ix=0,iy=0;
  if(keys['w']||keys['arrowup'])iy+=1;if(keys['s']||keys['arrowdown'])iy-=1;if(keys['a']||keys['arrowleft'])ix-=1;if(keys['d']||keys['arrowright'])ix+=1;

    const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);mx_=(fx*iy+rx*ix)*s;mz_=(fz*iy+rz*ix)*s;}

    if(d<.18){target=null;}else{mx_=dx/d*Math.min(1,d/.6);mz_=dz/d*Math.min(1,d/.6);

  const sp=P.speed*(cur.indoor?(cur.id==='stage'?.8:.6):1);

  if(P.moving){const p={x:P.x+mx_*sp*dt,z:P.z+mz_*sp*dt};resolve(p);P.x=p.x;P.z=p.z;
    const want=Math.atan2(mx_,mz_);let df=want-P.face;df=Math.atan2(Math.sin(df),Math.cos(df));P.face+=df*Math.min(1,dt*12);P.walkT+=dt*sp*1.6;}
  P.y+=(cur.floor(P.x,P.z)-P.y)*Math.min(1,dt*14);
  player.position.set(P.x,P.y,P.z);player.rotation.y=P.face;
  const sw=P.moving?Math.sin(P.walkT):0;body.legL.rotation.x=sw*.6;body.legR.rotation.x=-sw*.6;body.armL.rotation.x=-sw*.5;body.armR.rotation.x=sw*.5;
  player.position.y+=P.moving?Math.abs(Math.cos(P.walkT))*.05:0;

/* 姿勢：靠近床就躺下蓋被子，靠近禱告墊就跪下合十閉眼 */
let pose=null,stillT=0;
function applyPose(dt){
  stillT=P.moving?0:stillT+dt;
  let want=null;
  if(stillT>.25&&curHot){if(curHot.id==='bed')want='sleep';else if(curHot.id==='pray')want='pray';}
  pose=want;
  player.rotation.order='YXZ';player.rotation.x=0;
  body.legL.position.set(-.1,.28,0);body.legR.position.set(.1,.28,0);body.armL.rotation.z=0;body.armR.rotation.z=0;
  const closed=!!pose;body.eyes.forEach(e=>e.visible=!closed);body.shut.forEach(e=>e.visible=closed);
  if(SC.f2.blanket)SC.f2.blanket.visible=pose==='sleep';
  if(pose==='sleep'){const B=SC.f2.bedPos;player.position.set(B.x,B.y,B.z);player.rotation.y=Math.PI;player.rotation.x=-Math.PI/2;
    body.legL.rotation.x=body.legR.rotation.x=0;body.armL.rotation.x=body.armR.rotation.x=0;}
  else if(pose==='pray'){const K=SC.attic.kneel;player.position.set(K.x,K.y-.42,K.z);player.rotation.y=Math.PI;
    body.legL.rotation.x=body.legR.rotation.x=Math.PI/2;body.legL.position.set(-.1,.42,-.22);body.legR.position.set(.1,.42,-.22);

  {const sc=mapV.querySelector('.mapscroll');if(sc&&sc.scrollWidth>sc.clientWidth)sc.scrollLeft=(sc.scrollWidth-sc.clientWidth)*.5;}

const worldV=$('#worldView');
function loadScript(u){return new Promise((res,rej)=>{if(document.querySelector('script[src="'+u+'"]'))return res();const e=document.createElement('script');e.src=u;e.onload=res;e.onerror=rej;document.head.appendChild(e);});}
async function worldTrips(){
  try{if(indexedDB.databases){const l=await indexedDB.databases();if(!l.some(d=>d.name==='world'))return[];}
    return await new Promise(res=>{const r=indexedDB.open('world');r.onsuccess=()=>{const db=r.result;if(!db.objectStoreNames.contains('trips')){db.close();return res([]);}const q=db.transaction('trips','readonly').objectStore('trips').getAll();q.onsuccess=()=>{res(q.result||[]);db.close();};q.onerror=()=>res([]);};r.onerror=()=>res([]);});}catch(e){return[];}}
async function cloudTrips(){ // 先看 OneDrive 上旅遊手冊的資料（每台裝置都一樣），沒有登入再看這台裝置
  try{if(window.OriginaSync&&await OriginaSync.getToken()){const d=await OriginaSync.api.getJSON('World/data.json');if(d&&d.data&&d.data.trips)return d.data.trips;}}catch(e){}
  return worldTrips();}
async function openWorld(){closeSheet();
  worldV.innerHTML=`<div class="ovbar"><h2>世界之門</h2><span style="display:flex;gap:8px"><button class="btn light" id="wApp">打開旅遊手冊</button><button class="btn light" id="wClose">✕ 回到家</button></span></div><div class="wbody"><div class="wmap" id="wMap"><p class="wnote">世界地圖載入中…</p></div><div class="wstats" id="wStats"></div><div class="wchips" id="wChips"></div><p class="wnote">金色是去過的地方、綠色是排好的下一趟（大國家只亮去過的城市）；資料來自旅遊手冊（登入 OneDrive 時讀雲端，否則讀這台裝置）。</p></div>`;
  worldV.hidden=false;
  $('#wClose').onclick=()=>{worldV.hidden=true;worldV.innerHTML='';canvas.focus({preventScroll:true});};
  $('#wApp').onclick=()=>{worldV.hidden=true;worldV.innerHTML='';openApp('旅遊手冊',APPMAP['旅遊手冊'].u);};
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js');
    await loadScript('https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js');
    const [topo,trips]=await Promise.all([fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(r=>r.json()),cloudTrips()]);
    const today=new Date().toISOString().slice(0,10),been=new Set(),next=new Set();
    const BIG=new Set(['CN','US','RU','CA','AU','BR','IN','AR','KZ','ID','MX','MN','DZ','SA','CD','LY','SD','IR','PE','CL']),spots=[];
    trips.forEach(t=>{const up=t.start&&t.start>today,geo=t.cityGeo||{},cs=Object.keys(geo);(t.countries&&t.countries.length?t.countries:[t.country]).forEach(c=>{if(BIG.has(c)&&cs.length){cs.forEach(k=>spots.push({k,g:geo[k],up}));const n=ISO_NUM[c];if(n&&!up)been.add('x'+n);return;}const n=ISO_NUM[c];if(!n)return;(up?next:been).add(n);});});
    const names={};(window.PRESETS?.world||[]).forEach(w=>names[w[0]]=w[2]+' '+w[1]);
    const W=1000,H=500,svg=d3.create('svg').attr('viewBox',`0 0 ${W} ${H}`);
    const proj=d3.geoNaturalEarth1().fitSize([W,H],{type:'Sphere'}),path=d3.geoPath(proj);
    svg.append('path').attr('d',path({type:'Sphere'})).attr('fill','#13234A');
    svg.append('path').attr('d',path(d3.geoGraticule10())).attr('fill','none').attr('stroke','#1E3263').attr('stroke-width',.6);
    const feats=topojson.feature(topo,topo.objects.countries).features;
    svg.append('g').selectAll('path').data(feats).join('path').attr('d',path)
      .attr('fill',d=>been.has(String(d.id).padStart(3,'0'))?'#E8C46A':next.has(String(d.id).padStart(3,'0'))?'#8FB89A':'#2C3F6B')
      .attr('stroke','#0F1A30').attr('stroke-width',.5).append('title').text(d=>d.properties.name);
    const sg=svg.append('g');spots.forEach(p=>{const xy=proj([p.g[1],p.g[0]]);if(!xy)return;const c=p.up?'#8FB89A':'#E8C46A';
      sg.append('circle').attr('cx',xy[0]).attr('cy',xy[1]).attr('r',9).attr('fill',c).attr('opacity',.28);
      sg.append('circle').attr('cx',xy[0]).attr('cy',xy[1]).attr('r',3.2).attr('fill',c).attr('stroke','#0F1A30').attr('stroke-width',.6).append('title').text(p.k);});
    const el=$('#wMap');el.innerHTML='';el.appendChild(svg.node());
    const codes=[...new Set(trips.filter(t=>!(t.start>today)).flatMap(t=>t.countries&&t.countries.length?t.countries:[t.country]))].filter(c=>c&&c!=='OTHER');
    $('#wStats').innerHTML=`<div><b>${new Set([...been].map(v=>v.replace('x',''))).size}</b><span>去過的國家</span></div><div><b>${trips.filter(t=>!(t.start>today)).length}</b><span>趟旅行</span></div><div><b>${next.size}</b><span>計畫中</span></div>`;
    $('#wChips').innerHTML=codes.map(c=>{let n=names[c];try{n=n||new Intl.DisplayNames(['zh-TW'],{type:'region'}).of(c)}catch(e){}return `<span>${n||c}</span>`;}).join('')||'<span>還沒有去過的國家紀錄，從旅遊手冊新增第一趟旅行</span>';
  }catch(e){$('#wMap').innerHTML='<p class="wnote">世界地圖載入失敗，請確認網路後再打開一次。</p>';}
}
function closeMap(){mapV.hidden=true;mapV.innerHTML='';canvas.focus({preventScroll:true});}
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!appV.hidden)closeApp();else if(!mapV.hidden)closeMap();}});
$('#menuBtn').addEventListener('click',openMap);

function toggleView(){view=view==='third'?'first':'third';$('#viewBtn').textContent=view==='third'?'第三人稱':'第一人稱';if(view==='first')P.pitch=-.05;camInit=true;}
$('#viewBtn').addEventListener('click',toggleView);
setTimeout(()=>{$('#hint').style.opacity='0';},7000);

/* 場景上的名稱牌可以直接點 */
Object.values(SC).forEach(sc=>{(sc.scene.userData.labels||[]).forEach(l=>{const t=l.userData.text,k=t.split(' · ')[0];
  let h=t==='回家'?sc.hots.find(x=>x.id==='home'):sc.hots.find(x=>{const hn=x.name.split(' · ')[0];return hn===k||x.name.startsWith(k)||k.startsWith(hn);});
  if(h)l.userData.hot=h;});});
/* ---------- loop ---------- */
const clock=new R.Clock();
function frame(){
  const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
  if(overlayOpen()){requestAnimationFrame(frame);return;}
  if(!sheetOpen())step(dt);
  updateCamera(dt);checkHot();
  waterMat.uniforms.t.value=t;portalMat.uniforms.t.value=t;
  if(cur.update)cur.update(dt,t);
  if(marker.material.opacity>0){marker.material.opacity=Math.max(0,marker.material.opacity-dt*1.2);marker.scale.multiplyScalar(1+dt*.6);}
  renderer.render(cur.scene,camera);
  requestAnimationFrame(frame);
}
P.y=cur.floor(P.x,P.z);
{const qs=new URLSearchParams(location.search),g=qs.get('go'),ap=qs.get('app');if(g){const[id,sp]=g.split(',');if(SC[id])goto(id,sp);}if(ap&&APPMAP[ap])openApp(ap,APPMAP[ap].u);else if(qs.has('map'))openMap();}
requestAnimationFrame(frame);
})();
