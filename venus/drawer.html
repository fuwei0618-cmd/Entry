html,body{margin:0;min-height:100%;background:#F3EADF;color:#3A2A24;font-family:"PingFang TC","Noto Sans TC",system-ui,sans-serif}
.back{position:fixed;left:14px;top:calc(env(safe-area-inset-top) + 12px);z-index:5;border:1px solid rgba(244,238,230,.3);background:rgba(28,24,20,.72);color:#F4EEE6;border-radius:999px;padding:8px 14px;font-size:13px;text-decoration:none}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}

#msg{min-height:20px;margin:0;font-size:14px;color:#8E2B2B}
#note{display:none;max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 64px) 16px 40px}
#note h1{font:700 34px "Songti TC","Noto Serif TC",serif;letter-spacing:.06em;margin:0 0 8px}
.lead{font-size:16px;line-height:1.7;color:#5A4228;margin:0 0 18px}.lead b,li b,p b{color:#8E2B2B}
section{background:#FFFBF6;border-radius:22px;padding:18px 22px;margin-bottom:16px;box-shadow:0 5px 18px rgba(60,40,20,.07)}
h2{font:700 22px "Songti TC","Noto Serif TC",serif;margin:0 0 8px}
p,li{font-size:15.5px;line-height:1.7}p{margin:0 0 8px}ul{margin:0;padding-left:20px}
.w{margin-top:12px;background:#F8EFE3;border-radius:14px;padding:12px 16px}.w>b{color:#3A2A24}
.src a{display:block;font-size:14px;color:#7A5A40;padding:5px 0}
