<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Origina 總表</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600&display=swap">
<style id="pg-css">/* 清水模灰底、極細框線的工作表；分類列像建築圖說的分區標題 */
:root{--bg:#EEECE8;--surface:#F8F7F4;--ink:#2A2724;--muted:#7B746C;--line:#D8D3CB;--accent:#8A6E4B;--chip-on:#E1EADB;--chip-on-ink:#3E5A33;--chip-mid:#F1E6CF;--chip-mid-ink:#7A5A1E;--chip-off:#E8E4DE;--chip-off-ink:#6E675F;--row-off:#E9E6E1;--display:"Noto Serif TC",serif;--body:"Noto Sans TC","PingFang TC",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D1C1A;--surface:#262421;--ink:#ECE7E0;--muted:#A39B91;--line:#3B3833;--accent:#C9A87C;--chip-on:#2E3B2A;--chip-on-ink:#B9D3AC;--chip-mid:#3D3322;--chip-mid-ink:#E6C98E;--chip-off:#33302C;--chip-off-ink:#B0A79C;--row-off:#201E1C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1D1C1A;--surface:#262421;--ink:#ECE7E0;--muted:#A39B91;--line:#3B3833;--accent:#C9A87C;--chip-on:#2E3B2A;--chip-on-ink:#B9D3AC;--chip-mid:#3D3322;--chip-mid-ink:#E6C98E;--chip-off:#33302C;--chip-off-ink:#B0A79C;--row-off:#201E1C;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body)}
#app{padding-block:24px 48px;padding-inline:16px;max-width:1600px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:16px}
h1{font-family:var(--display);font-weight:600;font-size:28px;margin:0;letter-spacing:.04em}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.state{font-size:12px;color:var(--muted);min-width:7em;text-align:right}
.state.dirty{color:var(--accent);font-weight:700}
button.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer}
button.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wrap{overflow:auto;max-height:calc(100vh - 150px);border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;min-width:1500px;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;text-align:left}
th{position:sticky;top:0;background:var(--surface);font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.06em;padding:10px;white-space:nowrap;z-index:2}
td{padding:0}
td.c-name,th.c-name{position:sticky;left:0;background:var(--surface);z-index:1}
th.c-name{z-index:3}
tr.group td{background:var(--bg);font-family:var(--display);font-size:14px;letter-spacing:.12em;padding:8px 12px;color:var(--accent)}
.cell{padding:9px 10px;min-height:20px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.cell:empty::before{content:attr(data-ph);color:var(--line)}
.cell:focus{background:color-mix(in srgb,var(--accent) 8%,transparent);outline:none}
.c-name .cell{font-weight:700;min-width:7em}
.c-cat .cell{min-width:4.5em;white-space:nowrap}
.c-space .cell{color:var(--muted);min-width:5em}
.c-mean,.c-func,.c-rec,.c-deco{min-width:12em}
.c-todo{min-width:16em}
.c-todo .cell{color:var(--accent)}
.c-func{min-width:28em}
.iconbtn{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;width:100%;min-width:8.5em}
.iconbtn svg{width:26px;height:26px;fill:var(--ink);flex:none}
.iconbtn .none{width:26px;height:26px;border:1px dashed var(--line);border-radius:6px;flex:none}
.iconbtn span{font-size:12px;color:var(--muted)}
.app .cell{font-weight:500;min-width:9em}
.app .url{font-size:11px;color:var(--muted);padding-top:0;word-break:break-all}
.app a{display:inline-block;margin:0 10px 8px;font-size:12px;color:var(--accent);text-decoration:none}
select.status{font:inherit;font-size:12px;border:0;border-radius:999px;padding:4px 10px;margin:8px;appearance:none;cursor:pointer}
select.status[data-v="已上線"]{background:var(--chip-on);color:var(--chip-on-ink)}
select.status[data-v="製作中"]{background:var(--chip-mid);color:var(--chip-mid-ink)}
select.status[data-v="未開始"],select.status[data-v="無 App"]{background:var(--chip-off);color:var(--chip-off-ink)}
tr.row-app td{background:var(--surface)}
tr.row-none td,tr.row-pause td{background:var(--row-off)}
tr.row-none td .cell,tr.row-pause td .cell{color:var(--muted)}
tr.row-none .iconbtn svg,tr.row-pause .iconbtn svg{opacity:.45}
tr.row-app td.c-name{box-shadow:inset 3px 0 0 var(--accent)}
select.status[data-v="暫不製作"]{background:transparent;color:var(--chip-off-ink);box-shadow:inset 0 0 0 1px var(--line)}
.del{all:unset;cursor:pointer;color:var(--muted);padding:9px 10px;font-size:14px}
.del:hover{color:var(--accent)}
.picker{position:fixed;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:repeat(5,64px);gap:6px;box-shadow:0 12px 32px rgba(0,0,0,.18);max-width:calc(100vw - 32px)}
.picker button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:3px;padding:6px 2px;border-radius:8px;font-size:10px;color:var(--muted);text-align:center}
.picker button:hover,.picker button:focus-visible{background:var(--bg)}
.picker svg{width:30px;height:30px;fill:var(--ink)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
@media (max-width:600px){h1{font-size:22px}.picker{grid-template-columns:repeat(4,64px)}}

/* 總覽：一頁看完。四欄分區，每項一行：圖示・名稱・狀態點・空間・下一步 */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{all:unset;cursor:pointer;font-size:13px;padding:7px 14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ov-sum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:-4px 0 12px}
.ov-sum b{color:var(--ink);font-weight:700;margin-left:3px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;background:var(--chip-off-ink);opacity:.5}
.dot.on{background:#6E9A5B;opacity:1}.dot.mid{background:#C99A3E;opacity:1}.dot.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--chip-off-ink)}
.ov-hero{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;cursor:pointer}
.ov-hero h2{margin:0;font-family:var(--display);font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.ov-hero ol{margin:0;padding-left:1.3em;font-size:12.5px;line-height:1.55;color:var(--accent);columns:2 22em;column-gap:28px}
.ov-hero li.done{color:var(--muted);list-style:none;margin-left:-1.3em}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;align-items:start}
.ov-col{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ov-col h3{margin:0;padding:8px 12px;font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.12em;color:var(--accent);background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.ov-col h3 span{font-family:var(--body);font-weight:400;letter-spacing:0;color:var(--muted);font-size:11px}
.it{all:unset;box-sizing:border-box;display:grid;grid-template-columns:20px 1fr auto;grid-template-rows:auto auto;column-gap:8px;align-items:center;width:100%;padding:6px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.it:last-child{border-bottom:0}
.it:hover,.it:focus-visible{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.it svg{width:18px;height:18px;fill:var(--ink);grid-row:1/3}
.it .none{width:18px;height:18px;grid-row:1/3}
.it .nm{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .sp{font-size:11px;color:var(--muted);white-space:nowrap}
.it .td{grid-column:2/4;font-size:11.5px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.it.one svg,.it.one .none{grid-row:1}
.it.dim .nm{color:var(--muted);font-weight:500}.it.dim svg{opacity:.4}
/* 完整表格裡：右下角一直浮著「回總覽」，不用滑回最上面 */
.doors{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.doors a{font-size:12.5px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px}
.doors a:hover{border-color:var(--accent);color:var(--accent)}

.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:12px}
.hb{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px 12px}
.hb h3{margin:0 0 6px;font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.12em;color:var(--accent)}
.hbt{font-size:13px;line-height:1.75;white-space:pre-wrap;outline:none;border-radius:6px;padding:2px 4px;margin:0 -4px;min-height:1.7em}
.hbt:empty::before{content:attr(data-ph);color:var(--line)}
.hbt:focus{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.hb.mine{box-shadow:inset 3px 0 0 var(--accent)}.hb.mine .hbt{color:var(--ink);font-weight:500}
.hb.cl .hbt,.hb.use .hbt{color:var(--muted)}

/* 完整表格：前面合成一格「項目」，功能欄拉寬 */
table{min-width:1180px}
td.c-item,th.c-item{position:sticky;left:0;background:var(--surface);z-index:1}th.c-item{z-index:3}
tr.row-none td.c-item,tr.row-pause td.c-item{background:var(--row-off)}
tr.row-app td.c-item{box-shadow:inset 3px 0 0 var(--accent)}
.c-item{min-width:15em;max-width:17em}
.ihead{display:flex;align-items:center;gap:2px;padding:6px 6px 0 4px}
.ihead .cell.nm{font-weight:700;flex:1;min-width:4em;padding:4px 6px}
.ihead select.status{margin:0}
.iconbtn.sm{min-width:0;width:auto;padding:4px}
.iconbtn.sm svg,.iconbtn.sm .none{width:22px;height:22px}
.imeta,.iapp{display:flex;align-items:center;gap:0;padding:0 6px;font-size:12px;color:var(--muted)}
.imeta>span{padding:0 2px}
.cell.mini{padding:2px 4px;font-size:12px;min-height:0;color:var(--muted);white-space:nowrap}
.iapp .cell.mini{color:var(--ink)}
.iapp a{margin:0 0 0 6px!important}
.c-item .url{padding:0 10px 8px}
.c-func{min-width:34em}
/* 總覽 */
.home2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px;margin-bottom:10px}
@media (max-width:760px){.home2{grid-template-columns:1fr}}
.hb.mine{background:var(--surface);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:inset 4px 0 0 var(--accent)}
.hb.mine h3{font-size:15px}
.hbt.big{font-size:15px;line-height:1.9;color:var(--ink);font-weight:500}
.hb.cl{background:transparent}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin-bottom:8px}
.rule{display:grid;gap:2px;padding:8px 12px;border-radius:10px;background:var(--bg);border:1px dashed var(--line);font-size:12.5px;line-height:1.6}
.rule b{font-family:var(--display);font-weight:600;color:var(--accent);font-size:13px;outline:none}
.rule span{color:var(--muted);outline:none}
.rule [contenteditable]:focus{background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:4px}
details.use{margin-bottom:14px;font-size:13px}
details.use summary{cursor:pointer;color:var(--muted);font-size:12.5px;padding:4px 0}
details.use .hbt{color:var(--muted);padding:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:6px}
.bands{display:grid;gap:14px}
.band h3{margin:0 0 6px;font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.12em;color:var(--accent);display:flex;gap:8px;align-items:baseline}
.band h3 span{font-family:var(--body);font-weight:400;letter-spacing:0;color:var(--muted);font-size:11px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.tiles .it{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:52px}
.tiles .it:last-child{border-bottom:1px solid var(--line)}

.pm-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table.pm{min-width:0;width:100%;border-collapse:collapse;font-size:13px}
.pm th{position:static;font-size:11.5px;color:var(--muted);font-weight:500;padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);border-right:0;background:transparent}
.pm th:first-child,.pm td:first-child{text-align:left;padding-left:12px}
.pm td{border-right:0;border-bottom:1px solid var(--line);padding:3px 6px;text-align:center;vertical-align:middle}
.pm th:first-child,.pm td:first-child{width:1%;white-space:nowrap;padding-right:18px}.pm th:nth-child(2),.pm th:nth-child(3),.pm th:nth-child(4){width:62px}
.pm th.pm-next,.pm td.pm-next{text-align:left;padding-left:14px}
.pm tr.pm-g td{background:color-mix(in srgb,var(--accent) 9%,var(--bg));font-family:var(--display);font-weight:600;letter-spacing:.12em;color:var(--accent);font-size:12.5px;padding:6px 12px;text-align:left}
.pm-n{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;padding:4px 0}
.pm-n svg,.pm-n .none{width:18px;height:18px;fill:var(--ink);flex:none}.pm-n b{font-size:13px}a.pm-n{color:inherit;text-decoration:none}a.pm-n b{color:var(--accent);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent);text-underline-offset:3px}.pm-n small.pm-role{color:var(--accent);opacity:.85}.pm .pm-t.why{color:var(--ink);opacity:.8}.pm-main{font-style:normal;font-size:10.5px;font-weight:700;color:#fff;background:#B08D57;border-radius:4px;padding:1px 4px;margin-right:-2px}.pm-sys h4{margin:14px 0 4px;font-size:13.5px;display:flex;align-items:center;gap:8px}.pm-sys h4 i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#B08D57;color:#fff;font-size:11.5px}.pm-sys p{margin:0 0 4px;font-size:12.5px;line-height:1.6}.pm-order{font-size:12.5px;margin:6px 0 2px;color:var(--muted)}.pm-order b{color:var(--ink);font-weight:600}.pm-use.l2{width:calc(64px + (100% - 64px) / 2)!important}@media(max-width:700px){.pm-use.l2{width:100%!important}}.pm-use.half{width:50%!important;min-width:300px!important}@media(max-width:700px){.pm-use.half{width:100%!important}}.pm-use{width:100%!important;min-width:0!important;max-width:100%;table-layout:fixed;border-collapse:collapse;margin:10px 0 4px;font-size:12.5px}.pm-use th,.pm-use td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}.pm-use thead th{color:var(--muted);font-weight:500}.pm-use tbody th{color:var(--muted);font-weight:500}.pm-use th:first-child{width:64px}.pm-use td,.pm-use th{white-space:normal!important;word-break:break-word}.pm-usenote{font-size:12.5px;color:var(--muted);margin:4px 0 0}.pm-mainrule{font-size:12.5px;margin:10px 0 0}.pm-mainrule b{color:#B08D57}.pm-out{font-style:normal;font-size:11px;color:var(--accent)}.pm-n small{color:var(--muted);font-size:11px}
.pm-t{all:unset;cursor:pointer;display:block;color:var(--accent);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;padding:4px 0}
.pm .muted{color:var(--muted)}
.ch{all:unset;cursor:pointer;display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 6px;border-radius:7px;font-size:12px;font-weight:700;box-sizing:border-box}
.ch.on{background:var(--chip-on);color:var(--chip-on-ink)}.ch.mid{background:var(--chip-mid);color:var(--chip-mid-ink)}
.ch.q{background:var(--chip-mid);color:var(--chip-mid-ink);opacity:.75}.ch.wait{background:#F6DAD5;color:#A3402F}
.ch.off{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);font-weight:400}
.pm tr.pm-h td{text-align:left;padding:6px 12px 2px 14px;font-size:11.5px;color:var(--muted);letter-spacing:.1em;border-bottom:0;background:transparent}
.pm tr.pm-h td::before{content:"門廳・";color:var(--line)}
.pm tr.inhub td:first-child{padding-left:30px}
.pm-tools{display:flex;justify-content:flex-end;margin:0 0 6px}.seg.sm button{font-size:12px;padding:5px 12px}
.pm tr.pm-g td{border-left:4px solid var(--gc,transparent)}.pm tr.pm-g td small{font-family:var(--body);font-weight:400;letter-spacing:0;color:var(--muted);font-size:11px;margin-left:10px}
label.circ{font-size:11.5px;color:var(--muted);display:flex;gap:4px;align-items:center;padding:2px 4px 6px}label.circ select{font:inherit;font-size:11.5px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:1px 4px}
.pm tr.dim .pm-n b{color:var(--muted);font-weight:500}.pm tr.dim svg{opacity:.4}
.pm tr.pm-sum td{background:color-mix(in srgb,var(--accent) 9%,var(--bg));font-weight:700;font-size:12px;color:var(--accent);border-bottom:0;padding:7px 6px}
.pm tbody tr:not(.pm-g):not(.pm-sum):hover td{background:color-mix(in srgb,var(--accent) 5%,transparent)}

table.rules{display:table;width:100%;min-width:0;border-collapse:separate;border-spacing:0;margin-bottom:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
table.rules tr.rule{display:table-row;padding:0;border:0;background:none;gap:0}table.rules th{position:static;background:var(--bg);color:var(--muted);font-weight:500;font-size:12px;padding:8px 14px;border-right:0;text-align:left}
table.rules td{padding:8px 14px;border-right:0;border-bottom:1px solid var(--line)}table.rules tr:last-child td{border-bottom:0}
table.rules td.rl{font-family:var(--display);color:var(--accent);width:4.5em;white-space:nowrap}table.rules td.rq{width:8.5em;white-space:nowrap}
table.rules b{font-weight:700;font-family:var(--body);font-size:13px;color:var(--ink)}table.rules td span{color:var(--ink)}table.rules [contenteditable]{outline:none;border-radius:4px}table.rules [contenteditable]:focus{background:color-mix(in srgb,var(--accent) 8%,transparent)}

ol.flow{list-style:none;margin:0 0 12px;padding:6px 0 0;display:grid;grid-template-columns:repeat(3,1fr);gap:0 18px;position:relative}
ol.flow::before{content:"";position:absolute;left:calc(100%/6);right:calc(100%/6);top:19px;height:2px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 40%,var(--line)))}
ol.flow li.rule{position:relative;display:grid;justify-items:center;text-align:center;gap:3px;padding:0 6px;background:none;border:0}
ol.flow .fdot{font-style:normal;position:relative;z-index:1;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--bg);font-size:12px;font-weight:700;margin-bottom:6px;box-shadow:0 0 0 4px var(--bg)}
ol.flow li:not(:last-child)::after{content:"";position:absolute;right:-9px;top:15px;border:5px solid transparent;border-left:7px solid var(--accent)}

<p class="pm-mainrule"><b>每個圈，同一時間只留一件主要在做的事</b>（「四個我」裡標「主」的那一列），其他的留在表上，但先不追。</p>
</div></details>`;
  // 進度地圖：像門市中控台，一列一個空間，一眼看出哪裡還沒好。點色塊可以直接切換
  const order=[];S.rows.forEach(r=>{if(r.cat!=='主入口'&&!order.includes(r.cat))order.push(r.cat);});
  const AP={'已上線':['✓','on'],'製作中':['做','mid'],'未開始':['?','q'],'暫不製作':['—','off'],'無 App':['—','off']};
  const chip=(v)=>v==='✓'?'on':v==='待'?'wait':v==='做'?'mid':v==='?'?'q':'off';
  const rowsAll=S.rows.map((r,i)=>[r,i]).filter(([r])=>r.cat!=='主入口'||groupBy==='circle');
  const cnt2=f=>rowsAll.filter(([r])=>f(r)).length,need=f=>rowsAll.filter(([r])=>f(r)).length;
  const CIRC=[['Camino','中心・Camino・Teresa','找回聲音、回到自己','#C9A55A'],['Teresa','Shakira・為眾生','火：把聲音送到世界','#C9705A'],['Chiara','Faye・富偉','水：守住豐盛，換來自由（Chiara 打底）','#8C9A6B'],['Elva','Elva・燕尾蝶','風：先愛自己，再允許被愛','#B5546F'],['地基','地基','三個我共用的家本身','#9A8F82']];
  const byCirc=groupBy==='circle';
  const groups=byCirc?[...CIRC.map(([k,n,d,c])=>[k,n,d,c,rowsAll.filter(([r])=>r.cat!=='工作・Eric'&&(r.circle||'')===k)]),['?','還沒分','點完整表格裡的「屬於」來分配','#B8AFA3',rowsAll.filter(([r])=>r.cat!=='工作・Eric'&&!CIRC.some(c=>c[0]===(r.circle||'')))],...[...new Set(rowsAll.filter(([r])=>r.cat==='工作・Eric').map(()=>'工作・Eric'))].map(c=>[c,c,'不屬於 Origina，交接時整區移走','#B8AFA3',rowsAll.filter(([r])=>r.cat===c)])].filter(g=>g[4].length)
    :order.map(cat=>[cat,cat,'','',rowsAll.filter(([r])=>r.cat===cat)]);
  const cols=`<div class="pm-tools"><span class="seg sm" role="group" aria-label="分組"><button data-grp="space" aria-pressed="${!byCirc}">空間</button><button data-grp="circle" aria-pressed="${byCirc}">四個我</button></span></div><div class="pm-wrap"><table class="pm"><thead><tr><th class="hubh"></th><th>空間</th><th>App</th><th>雲端</th><th>信念</th><th class="pm-next">${byCirc?'為什麼有它':'下一步'}</th></tr></thead><tbody>${groups.map(([gk,gn,gd,gc,L])=>`<tr class="pm-g${gc?' tinted':''}"${gc?` style="--gc:${gc}"`:''}><td colspan="6">${esc(gn||'未分類')}${gd?`<small>${esc(gd)}</small>`:''}</td></tr>`+(byCirc&&L.some(([r])=>layerOf(r))?hubbed(byLayer(L),layerOf,1):hubbed(L)).map(([r,i,hub,first,inHub,n])=>rowHTML(r,i,inHub,first?`<td class="hubv" rowspan="${n}"><span>${esc(hub)}</span></td>`:inHub?'':'<td class="hub0"></td>')).join('')).join('')}
    <tr class="pm-sum"><td></td><td>已完成</td><td>${cnt2(r=>r.status==='已上線')}/${need(r=>!['無 App','暫不製作'].includes(r.status))}</td><td>${cnt2(r=>r.cloud==='✓')}/${need(r=>r.cloud!=='—')}</td><td>${cnt2(r=>r.belief==='✓')}/${need(r=>r.belief!=='—')}</td><td></td></tr></tbody></table></div>`;
  function rowHTML(r,i,inHub,hubCell){{const a=AP[r.status]||['?','q'],t=firstTodo(r.todo),dim=r.status==='無 App'||r.status==='暫不製作';
      return `<tr class="${dim?'dim':''}${inHub?' inhub':''}">${hubCell}<td>${(()=>{const inner=`${svg(r.icon)}${groupBy==='circle'&&r.main?'<i class="pm-main" title="這個圈現在主要在做的事">主</i>':''}<b>${esc(r.name)}</b>${groupBy==='circle'&&r.role?`<small class="pm-role">${esc(r.role)}</small>`:inHub||/^工作/.test(r.cat||'')?'':`<small>${esc(r.space)}</small>`}`;const u=(r.url||'').trim();return /^https?:\/\//.test(u)?`<a class="pm-n" href="${esc(u)}" target="_blank" rel="noopener" title="開網頁">${inner}<i class="pm-out">↗</i></a>`:`<button class="pm-n" data-go="${i}" title="到完整表格">${inner}</button>`;})()}</td>
      <td><button class="ch ${a[1]}" data-cyc="${i}:status" title="${esc(r.status)}">${a[0]}</button></td>
      <td><button class="ch ${chip(r.cloud)}" data-cyc="${i}:cloud" title="OneDrive 同步">${esc(r.cloud||'—')}</button></td>
      <td><button class="ch ${chip(r.belief)}" data-cyc="${i}:belief" title="信念頁">${esc(r.belief||'—')}</button></td>
      <td class="pm-next"><button class="pm-t${groupBy==='circle'?' why':''}" data-go="${i}">${groupBy==='circle'?(shortWhy(r)?esc(shortWhy(r)):'<span class="muted">—</span>'):t?esc(t):'<span class="muted">—</span>'}</button></td></tr>`;}}
  return `<div class="ov-sum">${sum}</div>${hero}${cols}<p class="note">點任何一項，跳到完整表格的那一列修改。</p>`;}
function render(){
  const order=[];S.rows.forEach((r,i)=>{if(!order.includes(r.cat))order.push(r.cat);});
  let body='';
  order.forEach(cat=>{body+=`<tr class="group"><td colspan="${COLS.length+1}">${esc(cat||'未分類')}</td></tr>`;
    S.rows.forEach((r,i)=>{if(r.cat!==cat)return;
      body+=`<tr data-row="${i}" class="${r.status==='無 App'?'row-none':r.status==='暫不製作'?'row-pause':'row-app'}"><td class="c-item">
        <div class="ihead"><button class="iconbtn sm" data-icon="${i}" aria-label="選擇圖示（${esc(ICONS[r.icon]?.name||'無')}）" title="換圖示">${svg(r.icon)}</button>${ed(i,'name','名稱','nm')}<select class="status" data-i="${i}" data-v="${esc(r.status)}" aria-label="狀態">${STATUS.map(s=>`<option${s===r.status?' selected':''}>${s}</option>`).join('')}</select></div>
        <div class="imeta">${ed(i,'cat','分類','mini')}<span>·</span>${ed(i,'space','空間','mini')}</div><div class="imeta"><label class="circ">屬於<select data-circ="${i}">${['','Camino','Teresa','Chiara','Elva','地基'].map(c=>`<option value="${c}"${(r.circle||'')===c?' selected':''}>${c==='Teresa'?'Shakira':c==='Chiara'?'Faye':c||'還沒分'}</option>`).join('')}</select></label></div>
        <div class="iapp">${ed(i,'app','App 名稱','mini')}${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">打開 ↗</a>`:''}</div>${ed(i,'url','貼上連結','url')}</td>
      ${['mean','func','deco','todo'].map(k=>`<td class="c-${k}">${ed(i,k)}</td>`).join('')}
      <td><button class="del" data-del="${i}" aria-label="刪除這一列">×</button></td></tr>`;});});
  app.innerHTML=`<header class="top"><div><h1>Origina 總表</h1><div class="sub">每一個空間、圖示、App 與它的意義。點格子直接改，改完按儲存。</div>
    <nav class="doors" aria-label="其他文件">${DOORS.map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener">${n} ↗</a>`).join('')}</nav></div>
    <div class="actions"><span class="seg" role="group" aria-label="檢視"><button data-view="ov" aria-pressed="${view==='ov'}">總覽</button><button data-view="table" aria-pressed="${view==='table'}">完整表格</button></span><span class="state ${dirty?'dirty':''}" id="st">${dirty?'有未儲存的修改':'已儲存 · '+esc(S.saved)}</span><button class="btn" id="add">新增一列</button><button class="btn primary" id="save" ${dirty&&artifact&&!saving?'':'disabled'}>${saving?'儲存中…':'儲存'}</button></div></header>
    ${view==='ov'?overview():`<div class="wrap"><table><thead><tr>${COLS.map(([k,t])=>`<th class="c-${k}">${t}</th>`).join('')}<th></th></tr></thead><tbody>${body}</tbody></table></div><button class="backov" data-view="ov">← 總覽</button>`}
    <p class="note" id="note">${msg?esc(msg):artifact===false?'這個檢視只能看，不能儲存。':'分類欄改成新的名稱，就會自動分成新的一組。'}</p>`;
}
function mark(){dirty=1;const st=document.getElementById('st');st.textContent='有未儲存的修改';st.className='state dirty';const b=document.getElementById('save');if(b)b.disabled=!artifact||saving;}
app.addEventListener('input',e=>{const ru=e.target.closest('[data-rule]');if(ru){S.home.rules=[...app.querySelectorAll('.rule')].map(r=>r.querySelector('[data-part=n]').innerText.trim()+'：'+r.querySelector('[data-part=d]').innerText.trim()).join('\n');mark();return;}const hb=e.target.closest('[data-home]');if(hb){S.home[hb.dataset.home]=hb.innerText.replace(/\n$/,'');mark();return;}const c=e.target.closest('.cell');if(!c)return;S.rows[+c.dataset.i][c.dataset.k]=c.innerText.replace(/\n$/,'');mark();});
app.addEventListener('focusout',e=>{const c=e.target.closest('.cell');if(c&&(c.dataset.k==='cat'||c.dataset.k==='url'))render();});
app.addEventListener('change',e=>{if(e.target.matches('select[data-circ]')){S.rows[+e.target.dataset.circ].circle=e.target.value;mark();return;}if(e.target.matches('select.status')){S.rows[+e.target.dataset.i].status=e.target.value;e.target.dataset.v=e.target.value;mark();}});
app.addEventListener('click',e=>{
  const vb=e.target.closest('[data-view]');if(vb){view=vb.dataset.view;try{localStorage.setItem('origina.sheet.view',view);}catch(_){}render();return;}
  const cy=e.target.closest('[data-cyc]');if(cy){const[i,f]=cy.dataset.cyc.split(':'),r=S.rows[+i];
    if(f==='status'){const L=['已上線','製作中','未開始','暫不製作'];r.status=L[(L.indexOf(r.status)+1)%L.length];}else{const L=['✓','待','—'];r[f]=L[(L.indexOf(r[f]||'—')+1)%L.length];}mark();render();return;}
  const gb=e.target.closest('[data-grp]');if(gb){groupBy=gb.dataset.grp;try{localStorage.setItem('origina.sheet.group',groupBy);}catch(_){}render();return;}
  const go=e.target.closest('[data-go]');if(go){jump(+go.dataset.go);return;}
  const ib=e.target.closest('[data-icon]');if(ib){openPicker(ib,+ib.dataset.icon);return;}
  const d=e.target.closest('[data-del]');if(d){S.rows.splice(+d.dataset.del,1);mark();render();return;}
  if(e.target.id==='add'){const last=S.rows[S.rows.length-1];S.rows.push({cat:last?last.cat:'家',space:'',name:'',icon:'',app:'',url:'',status:'未開始',mean:'',func:'',rec:'',deco:'',todo:''});mark();render();return;}
  if(e.target.id==='save')save();});
function jump(i){view='table';try{localStorage.setItem('origina.sheet.view',view);}catch(_){}render();const tr=app.querySelector(`tr[data-row="${i}"]`);if(!tr)return;tr.scrollIntoView({block:'center',inline:'nearest'});tr.classList.add('flash');const c=tr.querySelector('.c-todo .cell')||tr.querySelector('.cell');if(c)c.focus({preventScroll:true});}
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.ov-hero')){e.preventDefault();jump(+e.target.dataset.go);}});
let pk=null;
function openPicker(btn,i){closePicker();pk=document.createElement('div');pk.className='picker';pk.setAttribute('role','dialog');
  pk.innerHTML=Object.keys(ICONS).map(k=>`<button data-k="${k}">${svg(k)}${esc(ICONS[k].name)}</button>`).join('')+`<button data-k="">${svg('')}不用圖示</button>`;
  document.body.appendChild(pk);const r=btn.getBoundingClientRect(),w=pk.offsetWidth,h=pk.offsetHeight;
  pk.style.left=Math.max(16,Math.min(innerWidth-w-16,r.left))+'px';pk.style.top=(r.bottom+h+8<innerHeight?r.bottom+6:Math.max(16,r.top-h-6))+'px';
  pk.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.rows[i].icon=b.dataset.k;mark();closePicker();render();});
  pk.querySelector('button').focus();}
function closePicker(){if(pk){pk.remove();pk=null;}}
document.addEventListener('pointerdown',e=>{if(pk&&!pk.contains(e.target)&&!e.target.closest('[data-icon]'))closePicker();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePicker();});
const RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
const HEAD='<title>Origina 總表</title>\n<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600&display=swap">\n';
function doc(){const css=document.getElementById('pg-css').textContent,js=document.getElementById('pg-js').textContent,ic=document.getElementById('pg-icons').textContent;
  const st=JSON.stringify(S).replace(/<\//g,'<\\/');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+HEAD+'<style id="pg-css">'+css+'</style>\n<div id="app"></div>\n<script id="pg-icons" type="application/json">'+ic+'<\/script>\n<script id="pg-state" type="application/json">'+st+'<\/script>\n<script id="pg-js">'+js+'<\/script>\n</body></html>';}
async function save(){if(!artifact||saving)return;saving=true;const d=new Date();S.saved=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;render();
  msg='';try{S.rev=Date.now();localStorage.setItem('origina.sheet.data',JSON.stringify(S));dirty=0;}catch(err){msg=err&&err.code==='conflict'?'剛剛有另一個視窗先存了，頁面會更新成那個版本。':(err&&(err.code==='not_granted'||err.code==='not_writer')?'你沒有編輯這頁的權限，修改無法儲存。':'儲存沒有成功，請再按一次儲存。');}
  saving=false;render();}
render();
artifact=true;render();
})();
